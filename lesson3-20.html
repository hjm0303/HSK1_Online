    /* ===== HSK 3: pháo hoa cánh quạt vàng, vòng sáng và lời chúc nổi ===== */
    .hsk3-firework{
      position:fixed;
      width:1px;
      height:1px;
      pointer-events:none;
      z-index:100000;
    }
    .hsk3-firework-ring{
      position:absolute;
      left:0;
      top:0;
      width:18px;
      height:18px;
      border:3px solid currentColor;
      border-radius:999px;
      opacity:0;
      transform:translate(-50%,-50%) scale(.15);
      box-shadow:0 0 18px currentColor;
      animation:hsk3FireworkRing 1.12s ease-out forwards;
    }
    .hsk3-firework-spark{
      position:absolute;
      left:-3px;
      top:-9px;
      width:6px;
      height:18px;
      border-radius:999px 999px 45% 45%;
      background:linear-gradient(to bottom,#fff 0 20%,currentColor 42% 100%);
      color:inherit;
      opacity:0;
      transform-origin:50% 9px;
      filter:drop-shadow(0 0 7px currentColor);
      animation:hsk3FireworkSpark 1.22s cubic-bezier(.16,.72,.24,1) forwards;
    }
    .hsk3-firework-star{
      position:absolute;
      left:0;
      top:0;
      color:inherit;
      font-size:16px;
      line-height:1;
      opacity:0;
      text-shadow:0 0 9px currentColor;
      animation:hsk3FireworkStar 1.35s ease-out forwards;
    }
    .hsk3-cheer{
      position:fixed;
      left:50%;
      top:27%;
      z-index:100001;
      pointer-events:none;
      transform:translate(-50%,-50%) scale(.65);
      border:2px solid rgba(255,255,255,.92);
      border-radius:999px;
      padding:9px 19px;
      color:#fff;
      background:linear-gradient(135deg,#d99a00,#8f5b00);
      box-shadow:0 14px 35px rgba(101,61,0,.25),inset 0 1px rgba(255,255,255,.55);
      font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;
      font-size:18px;
      font-weight:900;
      letter-spacing:.05em;
      opacity:0;
      animation:hsk3Cheer 1.45s ease-out forwards;
    }
    @keyframes hsk3FireworkRing{
      0%{opacity:.95;transform:translate(-50%,-50%) scale(.15)}
      65%{opacity:.65}
      100%{opacity:0;transform:translate(-50%,-50%) scale(8.5)}
    }
    @keyframes hsk3FireworkSpark{
      0%{opacity:0;transform:rotate(var(--angle)) translateY(0) scaleY(.2)}
      16%{opacity:1}
      72%{opacity:1;transform:rotate(var(--angle)) translateY(var(--distance)) scaleY(1)}
      100%{opacity:0;transform:rotate(var(--angle)) translateY(calc(var(--distance) + 24px)) scale(.25)}
    }
    @keyframes hsk3FireworkStar{
      0%{opacity:0;transform:translate(-50%,-50%) scale(.15) rotate(0)}
      24%{opacity:1}
      78%{opacity:1;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.15) rotate(170deg)}
      100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy) + 20px)) scale(.35) rotate(230deg)}
    }
    @keyframes hsk3Cheer{
      0%{opacity:0;transform:translate(-50%,-50%) scale(.65)}
      18%,70%{opacity:1;transform:translate(-50%,-50%) scale(1)}
      100%{opacity:0;transform:translate(-50%,-76%) scale(.92)}
    }

function mascot(className = "tiny-mascot", pose = "default") {
  const src = MASCOT_POSES[pose] || MASCOT_POSES.default;
  return `<img class="mascot-img ${className}" data-pose="${pose}" src="${src}" alt="小阳 - linh vật HSK 3">`;

function highlightWords(text, words = LESSON.extraVocabulary) {
  let safe = escapeHTML(text);
  [...words]
    .sort((a, b) => b.han.length - a.han.length)
    .forEach((w) => {
      const tip = `${w.han}|${w.py}|${w.vi}`;
      safe = safe
        .split(w.han)
        .join(
          `<button type="button" class="extra-word inline-vocab cn" data-word-tip="${escapeHTML(tip)}" aria-label="Xem nghĩa của ${escapeHTML(w.han)}">${w.han}</button>`,
        );
    });
  return safe;
}

function highlightExtras(text) {
  return highlightWords(text, LESSON.extraVocabulary);
}

function speak(text,rate=.88){
  if(!soundOn || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(String(text));u.lang="zh-CN";u.rate=rate;u.pitch=1;
  const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>/^zh-CN$/i.test(v.lang))||voices.find(v=>/^zh/i.test(v.lang))||null;
  speechSynthesis.speak(u);
}

function cleanZh(s){return String(s||"").replace(/[\s，。！？,.!?、；;：“”"'（）()]/g,"").toLowerCase()}
function cleanVi(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/đ/g,"d").replace(/[^a-z0-9\u3400-\u9fff]+/g," ").trim().replace(/\s+/g," ")}

function confetti(){const colors=["#f97316","#fb923c","#f59e0b","#0f766e","#fdba74"];for(let i=0;i<60;i++){const e=document.createElement("div");e.className="confetti";e.style.left=Math.random()*100+"vw";e.style.background=colors[i%colors.length];e.style.animationDelay=Math.random()*.5+"s";document.body.appendChild(e);setTimeout(()=>e.remove(),2800)}}
let feedbackAudioContext=null;
function playFeedbackSound(correct){
  if(!soundOn)return;
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtx)return;
  try{
    feedbackAudioContext=feedbackAudioContext||new AudioCtx();
    const ctx=feedbackAudioContext;
    if(ctx.state==='suspended')ctx.resume();
    const now=ctx.currentTime;

    /* HSK 3 dùng tiếng chuông ngũ cung và tiếng gõ gỗ, khác bộ âm của HSK 2. */
    const master=ctx.createGain();
    const compressor=ctx.createDynamicsCompressor();
    master.gain.setValueAtTime(.78,now);
    compressor.threshold.setValueAtTime(-20,now);
    compressor.knee.setValueAtTime(16,now);
    compressor.ratio.setValueAtTime(4,now);
    compressor.attack.setValueAtTime(.005,now);
    compressor.release.setValueAtTime(.22,now);
    master.connect(compressor);compressor.connect(ctx.destination);

    if(correct){
      [[587.33,0,.24],[880,.12,.28],[987.77,.25,.3],[1174.66,.42,.42]].forEach(([freq,delay,duration],index)=>{
        const osc=ctx.createOscillator(),shimmer=ctx.createOscillator(),gain=ctx.createGain(),shimmerGain=ctx.createGain();
        osc.type='triangle';
        osc.frequency.setValueAtTime(freq,now+delay);
        shimmer.type='sine';
        shimmer.frequency.setValueAtTime(freq*2,now+delay);
        gain.gain.setValueAtTime(.0001,now+delay);
        gain.gain.exponentialRampToValueAtTime(index===3?.36:.30,now+delay+.012);
        gain.gain.exponentialRampToValueAtTime(.0001,now+delay+duration);
        shimmerGain.gain.setValueAtTime(.0001,now+delay);
        shimmerGain.gain.exponentialRampToValueAtTime(.08,now+delay+.01);
        shimmerGain.gain.exponentialRampToValueAtTime(.0001,now+delay+duration*.72);
        osc.connect(gain);gain.connect(master);
        shimmer.connect(shimmerGain);shimmerGain.connect(master);
        osc.start(now+delay);shimmer.start(now+delay);
        osc.stop(now+delay+duration+.04);shimmer.stop(now+delay+duration+.04);
      });
    }else{
      [[392,349.23,0],[311.13,277.18,.16],[233.08,220,.32]].forEach(([startFreq,endFreq,delay],index)=>{
        const osc=ctx.createOscillator(),gain=ctx.createGain();
        osc.type=index===1?'square':'triangle';
        osc.frequency.setValueAtTime(startFreq,now+delay);
        osc.frequency.exponentialRampToValueAtTime(endFreq,now+delay+.13);
        gain.gain.setValueAtTime(.0001,now+delay);
        gain.gain.exponentialRampToValueAtTime(index===1?.11:.18,now+delay+.008);
        gain.gain.exponentialRampToValueAtTime(.0001,now+delay+.17);
        osc.connect(gain);gain.connect(master);osc.start(now+delay);osc.stop(now+delay+.19);
      });
    }
  }catch(_){/* Trình duyệt chặn Web Audio thì bỏ qua, không ảnh hưởng bài học */}
}
function fireworks(){
  const colors=['#f6c945','#d99a00','#fff1a6','#14b8a6','#38bdf8','#f472b6'];
  const centers=[
    [22+Math.random()*17,28+Math.random()*15],
    [62+Math.random()*19,22+Math.random()*16]
  ];
  centers.forEach((center,burst)=>{
    const shell=document.createElement('div');
    shell.className='hsk3-firework';
    shell.style.left=center[0]+'vw';
    shell.style.top=center[1]+'vh';
    const ring=document.createElement('span');
    ring.className='hsk3-firework-ring';
    ring.style.color=colors[burst%colors.length];
    ring.style.animationDelay=(burst*.13)+'s';
    shell.appendChild(ring);
    for(let i=0;i<18;i++){
      const spark=document.createElement('span');
      spark.className='hsk3-firework-spark';
      spark.style.color=colors[(i+burst*2)%colors.length];
      spark.style.setProperty('--angle',(i*20+(burst?10:0))+'deg');
      spark.style.setProperty('--distance',(58+Math.random()*76)+'px');
      spark.style.animationDelay=(burst*.13+Math.random()*.07)+'s';
      shell.appendChild(spark);
    }
    for(let i=0;i<8;i++){
      const angle=Math.PI*2*i/8+burst*.24;
      const distance=78+Math.random()*72;
      const star=document.createElement('span');
      star.className='hsk3-firework-star';
      star.textContent=i%2?'✦':'◆';
      star.style.color=colors[(i*2+burst)%colors.length];
      star.style.setProperty('--dx',Math.cos(angle)*distance+'px');
      star.style.setProperty('--dy',Math.sin(angle)*distance+'px');
      star.style.animationDelay=(burst*.13+.16+Math.random()*.06)+'s';
      shell.appendChild(star);
    }
    document.body.appendChild(shell);
    setTimeout(()=>shell.remove(),1750);
  });
  const cheer=document.createElement('div');
  cheer.className='hsk3-cheer cn';
  cheer.textContent='太棒了！';
  document.body.appendChild(cheer);
  setTimeout(()=>cheer.remove(),1650);
}

function levenshtein(a,b){const x=[...String(a)],y=[...String(b)],dp=Array(y.length+1).fill(0).map((_,j)=>j);for(let i=1;i<=x.length;i++){let prev=dp[0];dp[0]=i;for(let j=1;j<=y.length;j++){const tmp=dp[j];dp[j]=Math.min(dp[j]+1,dp[j-1]+1,prev+(x[i-1]===y[j-1]?0:1));prev=tmp}}return dp[y.length]}
function speechScore(expected,heard,confidence=0){const a=cleanZh(expected),b=cleanZh(heard);if(!a||!b)return 0;if(a===b)return 100;const sim=1-levenshtein(a,b)/Math.max(a.length,b.length);const contains=(a.includes(b)||b.includes(a))?0.82:0;return Math.max(0,Math.min(100,Math.round(Math.max(sim,contains)*92+Math.max(0,confidence)*8)))}
function stopRoleSession(silent = false) {
  const session = activeRoleSession;
  if (!session) return;
  if (!silent && typeof session.finalize === "function") {
    session.finalize();
    return;
  }
  activeRoleSession = null;
  session.finalized = true;
  try {
    session.recognition?.stop();
  } catch (_) {}
  try {
    if (session.recorder && session.recorder.state !== "inactive")
      session.recorder.stop();
  } catch (_) {}
  try {
    session.stream?.getTracks().forEach((track) => track.stop());
  } catch (_) {}
  const btn = document.querySelector(
    `[data-role-mic="${session.lineIndex}"]`,
  );
  if (btn) {
    btn.classList.remove("recording");
    btn.textContent = "Bắt đầu ghi âm";
  }
}

    return head+`<div class="vocab-study-body vocab-feedback-view"><div class="vocab-feedback ${f.correct?'ok':'bad'}"><h3>${f.correct?'✓ CHÍNH XÁC':'⊗ CHƯA ĐÚNG'}</h3><div style="margin-top:7px;opacity:.86">Bạn đã nhập: <b>${escapeHTML(f.value||'{trống}')}</b></div><div class="answer cn">${w.han}</div><div class="vocab-study-py" style="color:#fff">${w.py}</div><div class="meaning">${w.vi}</div><div class="vocab-example-box" style="background:rgba(255,255,255,.13);color:#fff"><span class="cn">${w.example}</span><br>${w.exampleVi}</div></div><div class="vocab-feedback-actions"><button id="vocabFeedbackNext">Tiếp theo →</button><p class="vocab-mode-foot" style="margin-top:8px">hoặc nhấn Enter ↵</p></div></div>`;
  }
  const instruction=state.vocabMode==="vi-zh"?"Xem tiếng Việt và viết chữ Hán":state.vocabMode==="zh-vi"?"Xem chữ Hán và nhập nghĩa tiếng Việt":state.vocabMode==="zh-zh"?"Nhìn chữ Hán rồi viết lại chính xác":"Nghe từ và nhập chữ Hán hoặc nghĩa tiếng Việt";
  const question=state.vocabMode==="vi-zh"?w.vi:w.han;
  return head+`<div class="vocab-study-body"><div class="vocab-study-card"><span class="vocab-study-pos">${w.pos}</span>${state.vocabMode==="listen"?`<button id="vocabListenOrb" class="vocab-listen-orb cn">听</button><p style="margin:14px 0 0;color:#64748b">${instruction}</p><button id="vocabSlow" class="vocab-main-btn" style="margin-top:10px;background:#334155">Nghe chậm</button>`:`<p style="margin:15px 0 4px;color:#94a3b8;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase">${instruction}</p><div class="${state.vocabMode==='vi-zh'?'vocab-study-vi':'vocab-study-han cn'}">${question}</div>`}<div class="vocab-input-wrap"><span class="vocab-input-tag">${state.vocabMode==='zh-vi'?'VN':'字'}</span><input id="vocabAnswerInput" class="vocab-answer-input" autocomplete="off" placeholder="${instruction}"><button id="vocabSubmit" class="vocab-submit">→</button></div><p class="vocab-mode-foot" style="margin-top:9px">Nhấn Enter để kiểm tra</p></div></div>`;
}
function bindVocab(){
  const w=()=>LESSON.vocabulary[state.vocabIndex%LESSON.vocabulary.length];
  const next=(delta=1)=>{state.vocabIndex=(state.vocabIndex+delta+LESSON.vocabulary.length)%LESSON.vocabulary.length;state.vocabFlipped=false;state.vocabFeedback=null;render()};
  document.querySelectorAll('[data-vocab-mode]').forEach(b=>b.onclick=()=>{state.vocabMode=b.dataset.vocabMode;state.vocabIndex=0;state.vocabFlipped=false;state.vocabFeedback=null;render()});
  document.querySelectorAll('[data-vocab-back],#vocabStudyBack,#vocabSwitchMode').forEach(b=>b.onclick=()=>{state.vocabMode=null;state.vocabFeedback=null;render()});
  if(!state.vocabMode)return;
  document.getElementById('vocabPrev')?.addEventListener('click',()=>next(-1));
  document.getElementById('vocabNext')?.addEventListener('click',()=>next(1));
  document.getElementById('vocabFlip')?.addEventListener('click',()=>{state.vocabFlipped=true;render();setTimeout(()=>speak(w().han),80)});
  document.getElementById('vocabSpeak')?.addEventListener('click',()=>speak(w().han));
  if(state.vocabMode==='flashcard'){
    setEnterAction(()=>{if(!state.vocabFlipped){state.vocabFlipped=true;render()}else next(1)});
    return;
  }
  if(state.vocabFeedback){
    const btn=document.getElementById('vocabFeedbackNext');btn.onclick=()=>next(1);btn.focus();setEnterAction(()=>next(1));
    return;
  }
  const input=document.getElementById('vocabAnswerInput');
  let composing=false;
  const correct=(value)=>{const mode=state.vocabMode,item=w(),v=String(value||'').trim();if(mode==='vi-zh'||mode==='zh-zh')return cleanZh(v)===cleanZh(item.han);const meanings=item.vi.split(/[;,/]|hoặc/gi).map(cleanVi).filter(Boolean),user=cleanVi(v);const meaningOk=meanings.some(x=>x===user||x.includes(user)||user.includes(x));return mode==='zh-vi'?meaningOk:(cleanZh(v)===cleanZh(item.han)||meaningOk)};
  const submit=()=>{if(composing||!input?.value.trim())return;const value=input.value.trim(),ok=correct(value);state.vocabFeedback={value,correct:ok};if(ok)addScore(10);answerFeedback(ok);render()};
  input?.addEventListener('compositionstart',()=>composing=true);input?.addEventListener('compositionend',()=>composing=false);input?.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&!composing&&e.keyCode!==229){e.preventDefault();submit()}});document.getElementById('vocabSubmit').onclick=submit;input?.focus();
  document.getElementById('vocabListenOrb')?.addEventListener('click',()=>speak(w().han));document.getElementById('vocabSlow')?.addEventListener('click',()=>speak(w().han,.58));if(state.vocabMode==='listen')setTimeout(()=>speak(w().han),250);
}

function grammarHTML(){return `<div class="panel section">

    <article class="grammar-card"><div class="grammar-head"><div class="grammar-no">2</div><h3>Phủ định và động từ năng nguyện trong câu bị động</h3></div><p>Các từ phủ định như <span class="cn">没、没有、不</span> và động từ năng nguyện như <span class="cn">会、能、应该</span> phải đặt trước <span class="cn">被</span>, không đặt sau động từ chính.</p><div class="formula"><span>Chủ thể + 没 / 不 + 被 + tác nhân + động từ</span><span>Chủ thể + 会 / 能 / 应该 + 被 + tác nhân + động từ</span></div><div class="example-list"><div class="example"><span class="cn">问题还没有被解决呢。</span><small>Vấn đề vẫn chưa được giải quyết.</small></div><div class="example"><span class="cn">病人还没被送到医院。</span><small>Bệnh nhân vẫn chưa được đưa đến bệnh viện.</small></div><div class="example"><span class="cn">下个月她会被妈妈送到美国。</span><small>Tháng sau cô ấy sẽ được mẹ đưa sang Mỹ.</small></div><div class="example"><span class="cn">这个办法应该被大家试一试。</span><small>Cách này nên được mọi người thử xem.</small></div></div></article>
    <article class="grammar-card"><div class="grammar-head"><div class="grammar-no">3</div><h3><span class="cn">只有……才……</span></h3></div><p>Cấu trúc này nối hai vế điều kiện–kết quả. Vế sau <span class="cn">只有</span> là điều kiện duy nhất; vế sau <span class="cn">才</span> là kết quả chỉ có thể xuất hiện khi điều kiện đó được đáp ứng.</p><div class="formula"><span>只有 + điều kiện，才 + kết quả</span></div><div class="example-list"><div class="example"><span class="cn">只有写完作业，才能看电视。</span><small>Chỉ khi làm xong bài tập mới được xem TV.</small></div><div class="example"><span class="cn">只有妈妈做的饭，她才爱吃。</span><small>Chỉ cơm mẹ nấu cô ấy mới thích ăn.</small></div><div class="example"><span class="cn">只有爸爸妈妈才能分出来。</span><small>Chỉ có bố mẹ mới phân biệt được.</small></div><div class="example"><span class="cn">只有真正做事情，才能了解有多难。</span><small>Chỉ khi thật sự bắt tay làm mới hiểu khó đến mức nào.</small></div></div></article>
    <article class="grammar-card"><div class="grammar-head"><div class="grammar-no">!</div><h3>Bốn lỗi dễ gặp</h3></div><div class="example-list"><div class="example"><span class="cn">✗ 我的照相机谁被拿走了？<br>✓ 我的照相机被谁拿走了？</span><small>Tác nhân đứng sau <span class="cn">被</span>.</small></div><div class="example"><span class="cn">✗ 问题被还没有解决。<br>✓ 问题还没有被解决。</span><small>Phủ định phải đứng trước <span class="cn">被</span>.</small></div><div class="example"><span class="cn">✗ 只有认真学习，就会进步。<br>✓ 只有认真学习，才会进步。</span><small><span class="cn">只有</span> thường đi với <span class="cn">才</span>, không phải <span class="cn">就</span>.</small></div><div class="example"><span class="cn">✗ 只有才努力，成绩好。<br>✓ 只有努力学习，成绩才会好。</span><small>Điều kiện phải nằm sau <span class="cn">只有</span>, kết quả sau <span class="cn">才</span>.</small></div></div></article>

</div>`}

function exerciseShell(type,text,total,motivationIndex=0){const m=MOTIVATIONS[motivationIndex%MOTIVATIONS.length];return `<div class="panel exercise-shell"><div class="exercise-head"><div class="pet-box"><span class="pet-icon">${mascot("tiny-mascot")}</span><span class="pet-text" id="${type}Pet"><span class="cn">${m.han}</span><br>${text}</span></div><div class="progress"><div id="${type}Progress" style="width:${progress(state[type]||0,total)}%"></div></div><div class="counter" id="${type}Counter">Câu ${(state[type]||0)+1}/${total}</div></div><div class="exercise-stage" id="${type}Stage"></div></div>`}

function renderFill(){
  const i=state.fill,q=LESSON.fill[i],stage=document.getElementById('fillStage');setEnterAction(null);
  if(!q){stage.innerHTML=finishCard('Hoàn thành phần Điền từ',LESSON.fill.length);return}
  stage.innerHTML=`<div class="question-card"><div class="prompt cn">${q.q}</div><div class="prompt-sub">${q.vi}</div><div class="options">${shuffle(q.options).map(o=>`<button class="option-btn" data-fill-option="${o}">${o}</button>`).join('')}</div><div id="fillResult" class="result"></div><button id="fillNext" class="next-btn">Câu tiếp theo →</button></div>`;
  const goNext=()=>nextExercise('fill',LESSON.fill.length,renderFill);
  document.querySelectorAll('[data-fill-option]').forEach(b=>b.onclick=()=>{if(document.querySelector('#fillNext.show'))return;const ok=b.dataset.fillOption===q.answer;b.classList.add(ok?'correct':'wrong');const result=document.getElementById('fillResult');result.className='result '+(ok?'ok':'bad');result.innerHTML=ok?'Chính xác!':`Chưa đúng. Đáp án: <b>${q.answer}</b>`;if(ok){addScore(10);answerFeedback(true);setTimeout(()=>speak(q.q.replace('___',q.answer)),430)}else{answerFeedback(false);[...document.querySelectorAll('[data-fill-option]')].find(x=>x.dataset.fillOption===q.answer)?.classList.add('correct')}const next=document.getElementById('fillNext');next.classList.add('show');next.onclick=goNext;next.focus();setEnterAction(goNext)});

function renderTyping(){
  const i=state.typing,q=LESSON.typing[i],stage=document.getElementById('typingStage');setEnterAction(null);
  if(!q){stage.innerHTML=finishCard('Hoàn thành phần Dịch & Gõ chữ',LESSON.typing.length);return}
  const label=q.dir==='vi-zh'?'Dịch Việt → Trung':'Dịch Trung → Việt';
  stage.innerHTML=`<div class="question-card"><span class="badge">${label}</span><div class="prompt ${q.dir==='zh-vi'?'cn':''}" style="margin-top:9px">${q.prompt}</div><div class="input-row"><input id="typingInput" class="text-input" autocomplete="off" placeholder="${q.dir==='vi-zh'?'Gõ câu tiếng Trung…':'Gõ nghĩa tiếng Việt…'}"><button id="typingSubmit" class="submit-btn">➤</button></div><div id="typingResult" class="result"></div><button id="typingNext" class="next-btn">Câu tiếp theo →</button></div>`;
  const input=document.getElementById('typingInput');let composing=false,answered=false;
  const goNext=()=>nextExercise('typing',LESSON.typing.length,renderTyping);
  const submit=()=>{if(answered){goNext();return}const value=input.value.trim();if(!value||composing)return;let ok=false;if(q.dir==='vi-zh')ok=cleanZh(value)===cleanZh(q.answer);else{const v=cleanVi(value);ok=[q.answer,...(q.alts||[])].some(a=>v===cleanVi(a)||v.includes(cleanVi(a))||cleanVi(a).includes(v))}answered=true;const result=document.getElementById('typingResult');result.className='result '+(ok?'ok':'bad');result.innerHTML=ok?`Chính xác! ${q.show?`<span class="cn">${q.show}</span>`:''}`:`Đáp án gợi ý: <b class="${q.dir==='vi-zh'?'cn':''}">${q.show||q.answer}</b>`;if(ok){addScore(12);answerFeedback(true);if(q.dir==='vi-zh')setTimeout(()=>speak(q.show||q.answer),430)}else answerFeedback(false);input.disabled=true;const next=document.getElementById('typingNext');next.classList.add('show');next.onclick=goNext;next.focus();setEnterAction(goNext)};
  input.addEventListener('compositionstart',()=>composing=true);input.addEventListener('compositionend',()=>composing=false);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&!composing&&e.keyCode!==229){e.preventDefault();submit()}});document.getElementById('typingSubmit').onclick=submit;input.focus();
}

let arrangeSelected=[];
function renderArrange(){
  const i=state.arrange,q=LESSON.arrange[i],stage=document.getElementById('arrangeStage');arrangeSelected=[];setEnterAction(null);
  if(!q){stage.innerHTML=finishCard('Hoàn thành phần Sắp xếp câu',LESSON.arrange.length);return}
  const pieces=shuffle(q.pieces.map((text,index)=>({text,index})));
  stage.innerHTML=`<div class="question-card"><div class="prompt-sub" style="font-style:normal;font-weight:800;font-size:20px;color:#334155">${q.vi}</div><div id="arrangeZone" class="arrange-zone"><span style="color:#7b6a4f;font-size:22px;font-weight:700">Chạm các mảnh bên dưới</span></div><div id="arrangePool" class="arrange-pool">${pieces.map((p,i)=>`<button class="piece" data-piece-id="${i}" data-piece="${p.text}">${p.text}</button>`).join('')}</div><div class="actions"><button id="arrangeCheck" class="action-btn primary">Kiểm tra</button><button id="arrangeReset" class="action-btn secondary">Làm lại</button></div><div id="arrangeResult" class="result"></div><button id="arrangeNext" class="next-btn">Câu tiếp theo →</button></div>`;
  const draw=()=>{const zone=document.getElementById('arrangeZone');zone.innerHTML=arrangeSelected.length?arrangeSelected.map((x,j)=>`<button class="selected-piece" data-selected="${j}">${x.text}</button>`).join(''):'<span style="color:#7b6a4f;font-size:22px;font-weight:700">Chạm các mảnh bên dưới</span>';document.querySelectorAll('[data-selected]').forEach(b=>b.onclick=()=>{const x=arrangeSelected.splice(Number(b.dataset.selected),1)[0];document.querySelector(`[data-piece-id="${x.id}"]`)?.classList.remove('used');draw()})};
  document.querySelectorAll('[data-piece-id]').forEach(b=>b.onclick=()=>{if(b.classList.contains('used'))return;b.classList.add('used');arrangeSelected.push({text:b.dataset.piece,id:b.dataset.pieceId});draw()});
  const goNext=()=>nextExercise('arrange',LESSON.arrange.length,renderArrange);
  const check=()=>{const value=arrangeSelected.map(x=>x.text).join(''),ok=cleanZh(value)===cleanZh(q.answer),r=document.getElementById('arrangeResult');r.className='result '+(ok?'ok':'bad');r.innerHTML=ok?'Trật tự chính xác!':`Câu đúng: <b class="cn">${q.answer}。</b>`;if(ok){addScore(12);answerFeedback(true);setTimeout(()=>speak(q.answer),430)}else answerFeedback(false);const next=document.getElementById('arrangeNext');next.classList.add('show');next.onclick=goNext;next.focus();setEnterAction(goNext)};
  document.getElementById('arrangeReset').onclick=()=>{arrangeSelected=[];document.querySelectorAll('[data-piece-id]').forEach(b=>b.classList.remove('used'));draw();document.getElementById('arrangeResult').className='result';document.getElementById('arrangeResult').textContent='';document.getElementById('arrangeNext').classList.remove('show');setEnterAction(check)};
  document.getElementById('arrangeCheck').onclick=check;setEnterAction(check);
}

function finishCard(title,total){confetti();return `<div class="question-card" style="text-align:center"><div class="cn" style="font-size:40px;font-weight:900;color:var(--orange-700)">完成</div><h2 style="margin:4px 0;color:var(--orange-700)">${title}</h2><p>Bạn đã hoàn thành ${total} câu. Hãy chuyển sang mục tiếp theo để tiếp tục luyện tập.</p></div>`}
function updateExercise(type,total){const bar=document.getElementById(type+'Progress'),count=document.getElementById(type+'Counter');if(bar)bar.style.width=state[type]>=total?'100%':progress(state[type],total)+'%';if(count)count.textContent=`Câu ${Math.min(state[type]+1,total)}/${total}`}

function matchHTML(){return `<div class="panel section"><div class="section-title"><div><h2>Nối cặp</h2><p>Ghép từ/câu tiếng Trung với nghĩa đúng.</p></div><span id="matchCount" class="badge">0 cặp</span></div><div class="match-toolbar"><button class="match-mode ${state.matchMode==='vocab'?'active':''}" data-match-mode="vocab">${LESSON.vocabulary.length} từ mới</button><button class="match-mode ${state.matchMode==='sentences'?'active':''}" data-match-mode="sentences">Câu trong bài đọc</button></div><div id="matchStage"></div>${motivationHTML(2)}</div>`}
function matchData(){if(state.matchMode==='vocab')return LESSON.vocabulary.map(v=>({key:String(v.id),left:v.han,right:v.vi}));return LESSON.readings.flatMap((d,di)=>d.lines.map((l,li)=>({key:`${di}-${li}`,left:l.han,right:l.vi}))).slice(0,12)}
function bindMatch(){document.querySelectorAll('[data-match-mode]').forEach(b=>b.onclick=()=>{state.matchMode=b.dataset.matchMode;state.matchLeft=null;state.matchRight=null;state.matched=new Set();render()});const data=matchData();const rights=shuffle(data.map(x=>({key:x.key,text:x.right})));document.getElementById('matchStage').innerHTML=`<div class="match-board"><div class="match-column">${data.map(x=>`<button class="match-card" data-side="left" data-key="${x.key}"><span class="cn">${x.left}</span></button>`).join('')}</div><div class="match-column">${rights.map(x=>`<button class="match-card" data-side="right" data-key="${x.key}">${x.text}</button>`).join('')}</div></div><div id="matchStatus" class="match-status">Chọn một thẻ ở mỗi bên.</div>`;document.querySelectorAll('.match-card').forEach(b=>b.onclick=()=>{if(b.classList.contains('matched'))return;const side=b.dataset.side;document.querySelectorAll(`.match-card[data-side="${side}"]`).forEach(x=>x.classList.remove('selected'));b.classList.add('selected');state[side==='left'?'matchLeft':'matchRight']=b;if(state.matchLeft&&state.matchRight){const ok=state.matchLeft.dataset.key===state.matchRight.dataset.key;if(ok){state.matchLeft.classList.add('matched');state.matchRight.classList.add('matched');state.matched.add(state.matchLeft.dataset.key);addScore(8);answerFeedback(true);document.getElementById('matchStatus').textContent='Chính xác!';if(side==='right'){const spoken=state.matchLeft.textContent.trim();setTimeout(()=>speak(spoken),430)}}else{state.matchLeft.classList.add('wrong');state.matchRight.classList.add('wrong');document.getElementById('matchStatus').textContent='Hai thẻ chưa khớp.';answerFeedback(false);setTimeout(()=>{state.matchLeft?.classList.remove('wrong','selected');state.matchRight?.classList.remove('wrong','selected');state.matchLeft=null;state.matchRight=null},500)}if(ok){state.matchLeft.classList.remove('selected');state.matchRight.classList.remove('selected');state.matchLeft=null;state.matchRight=null;document.getElementById('matchCount').textContent=`${state.matched.size}/${data.length} cặp`;if(state.matched.size===data.length){confetti();document.getElementById('matchStatus').textContent='Hoàn thành toàn bộ cặp nối!'}}}})}

function quizHTML(){return `<div class="panel quiz-card"><div class="quiz-top"><div><div class="eyebrow">HSK 3 • BÀI 20</div><h2 style="margin:2px 0">Trắc nghiệm ${LESSON.quiz.length} câu</h2></div><div class="quiz-stats"><span class="quiz-pill">Điểm <b id="quizScore">${state.quizScore}</b>/${LESSON.quiz.length}</span><span class="quiz-pill">Câu <b id="quizNum">${Math.min(state.quiz+1,LESSON.quiz.length)}</b>/${LESSON.quiz.length}</span></div></div><div id="quizStage"></div></div>`}
function renderQuiz(){
  const q=LESSON.quiz[state.quiz],stage=document.getElementById('quizStage');setEnterAction(null);
  if(!q){stage.innerHTML=finishCard(`Hoàn thành trắc nghiệm: ${state.quizScore}/${LESSON.quiz.length}`,LESSON.quiz.length);return}
  stage.innerHTML=`<div class="quiz-question">${q.q}</div><div class="quiz-options">${q.opts.map((o,i)=>`<button class="quiz-option" data-quiz-option="${i}"><span class="quiz-letter">${String.fromCharCode(65+i)}</span><span class="quiz-answer">${o}</span></button>`).join('')}</div><div id="quizResult" class="result"></div><button id="quizNext" class="next-btn">Câu tiếp theo →</button>`;
  const goNext=()=>{state.quiz++;renderQuiz();const n=document.getElementById('quizNum');if(n)n.textContent=Math.min(state.quiz+1,LESSON.quiz.length)};
  document.querySelectorAll('[data-quiz-option]').forEach(b=>b.onclick=()=>{if(document.querySelector('#quizNext.show'))return;const idx=Number(b.dataset.quizOption),ok=idx===q.a;b.classList.add(ok?'correct':'wrong');document.querySelector(`[data-quiz-option="${q.a}"]`)?.classList.add('correct');const result=document.getElementById('quizResult');result.className='result '+(ok?'ok':'bad');result.textContent=ok?'Chính xác!':'Chưa đúng.';if(ok){state.quizScore++;addScore(10);document.getElementById('quizScore').textContent=state.quizScore}answerFeedback(ok);const next=document.getElementById('quizNext');next.classList.add('show');next.onclick=goNext;next.focus();setEnterAction(goNext)});
}

async function startRoleRecording(lineIndex, expected) {
  stopRoleSession(true);
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const out = document.getElementById(`speechResult-${lineIndex}`);
  const btn = document.querySelector(`[data-role-mic="${lineIndex}"]`);
  if (!SR || !navigator.mediaDevices?.getUserMedia) {
    out.className = "speech-result low";
    out.textContent =
      "Trình duyệt chưa hỗ trợ ghi âm và chấm giọng. Hãy mở trang bằng Chrome hoặc Edge trên HTTPS.";
    return;
  }

  let stream;
  let recorder = null;
  const chunks = [];
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    if (window.MediaRecorder) {
      recorder = new MediaRecorder(stream);
      recorder.ondataavailable = (event) => {
        if (event.data?.size) chunks.push(event.data);
      };
      recorder.onstop = () => {
        if (!chunks.length) return;
        const recordingKey = `${state.scenario}-${lineIndex}`;
        const old = roleRecordings.get(recordingKey);
        if (old) URL.revokeObjectURL(old);
        const url = URL.createObjectURL(
          new Blob(chunks, { type: recorder.mimeType || "audio/webm" }),
        );
        roleRecordings.set(recordingKey, url);
        const play = document.querySelector(
          `[data-role-play="${lineIndex}"]`,
        );
        if (play) play.disabled = false;
      };
      recorder.start();
    }
  } catch (_) {
    out.className = "speech-result low";
    out.textContent =
      "Micro chưa được cấp quyền. Hãy cho phép Micro trong trình duyệt rồi thử lại.";
    return;
  }

  const session = {
    lineIndex,
    expected,
    recognition: null,
    recorder,
    stream,
    chunks,
    transcript: "",
    currentTranscript: "",
    confidenceTotal: 0,
    confidenceCount: 0,
    finalized: false,
    finalize: null,
  };
  activeRoleSession = session;
  btn.classList.add("recording");
  btn.textContent = "Dừng & chấm điểm";
  out.className = "speech-result";
  out.textContent =
    "Đang ghi âm liên tục... Hãy đọc hết đoạn; chỉ dừng khi bạn bấm “Dừng & chấm điểm”.";

  const heardText = () =>
    `${session.transcript}${session.currentTranscript}`.trim();

  const finish = () => {
    if (activeRoleSession === session) activeRoleSession = null;
    try {
      session.recognition?.stop();
    } catch (_) {}
    try {
      if (recorder && recorder.state !== "inactive") recorder.stop();
    } catch (_) {}
    setTimeout(() => {
      try {
        stream?.getTracks().forEach((track) => track.stop());
      } catch (_) {}
    }, 120);
    btn.classList.remove("recording");
    btn.textContent = "Bắt đầu ghi âm";
  };

  const grade = () => {
    if (session.finalized) return;
    session.finalized = true;
    const heard = heardText();
    if (!heard) {
      out.className = "speech-result mid";
      out.textContent =
        "Chưa nhận được lời nói rõ ràng. Bản ghi vẫn được lưu; hãy thử lại ở nơi yên tĩnh hơn.";
      finish();
      return;
    }
    const confidence = session.confidenceCount
      ? session.confidenceTotal / session.confidenceCount
      : 0;
    const result = speechScore(expected, heard, confidence);
    const recordingKey = `${state.scenario}-${lineIndex}`;
    const old = state.roleScores[recordingKey] || 0;
    state.roleScores[recordingKey] = Math.max(old, result);
    if (result > old) addScore(Math.max(1, Math.round((result - old) / 10)));
    const scoreEl = document.getElementById(`speechScore-${lineIndex}`);
    scoreEl.textContent = `${result} điểm`;
    scoreEl.className = `speech-score ${result >= 80 ? "good" : result >= 60 ? "mid" : "low"}`;
    out.className = `speech-result ${result >= 80 ? "good" : result >= 60 ? "mid" : "low"}`;
    out.innerHTML =
      result >= 90
        ? `Rất tốt! Bạn đã đọc liền mạch cả đoạn. Máy nghe được: <b class="cn">${escapeHTML(heard)}</b>`
        : result >= 70
          ? `Khá tốt (${result}/100). Máy nghe được: <b class="cn">${escapeHTML(heard)}</b>. Hãy nghe chậm và chỉnh thêm thanh điệu.`
          : `Điểm ${result}/100. Máy nghe được: <b class="cn">${escapeHTML(heard)}</b>. Hãy chia đoạn thành cụm ngắn rồi đọc liền lại.`;
    playFeedbackSound(result >= 70);
    if (result >= 80) fireworks();
    finish();
  };
  session.finalize = grade;

  const launchRecognition = () => {
    if (
      session.finalized ||
      activeRoleSession !== session ||
      !stream?.active
    )
      return;
    const recognition = new SR();
    session.recognition = recognition;
    recognition.lang = "zh-CN";
    recognition.interimResults = true;
    recognition.maxAlternatives = 3;
    recognition.continuous = true;
    session.currentTranscript = "";
    recognition.onresult = (event) => {
      const parts = [];
      for (let i = 0; i < event.results.length; i++) {
        const alt = event.results[i][0];
        if (!alt) continue;
        parts.push(alt.transcript);
        if (alt.confidence) {
          session.confidenceTotal += alt.confidence;
          session.confidenceCount += 1;
        }
      }
      session.currentTranscript = parts.join("");
      const live = heardText();
      if (live) {
        out.className = "speech-result";
        out.innerHTML = `Đang nghe: <b class="cn">${escapeHTML(live)}</b><br>Hệ thống vẫn ghi âm; đọc xong hãy tự bấm “Dừng & chấm điểm”.`;
      }
    };
    recognition.onerror = (event) => {
      if (session.finalized) return;
      if (event.error === "not-allowed" || event.error === "service-not-allowed") {
        session.finalized = true;
        out.className = "speech-result low";
        out.textContent =
          "Trình duyệt chưa được phép nhận dạng giọng nói. Hãy kiểm tra quyền Micro rồi thử lại.";
        finish();
      } else if (event.error !== "no-speech" && event.error !== "aborted") {
        out.className = "speech-result mid";
        out.textContent =
          "Nhận dạng vừa bị ngắt, nhưng bản ghi vẫn đang tiếp tục. Hệ thống sẽ tự nối lại; bạn cứ đọc tiếp.";
      }
    };
    recognition.onend = () => {
      if (session.finalized || activeRoleSession !== session) return;
      if (session.currentTranscript.trim()) {
        session.transcript += session.currentTranscript;
        session.currentTranscript = "";
      }
      setTimeout(launchRecognition, 160);
    };
    try {
      recognition.start();
    } catch (_) {
      setTimeout(launchRecognition, 260);
    }
  };

  launchRecognition();
}

function bindCommon(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{stopRoleSession(true);currentTab=b.dataset.tab;renderTabs();render()});
  document.querySelectorAll('[data-mini]').forEach(b=>b.onclick=()=>{const id=b.dataset.mini;document.querySelectorAll('[data-mini]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('[data-subpage]').forEach(x=>x.classList.toggle('active',x.dataset.subpage===id))});
  document.querySelector('[data-pinyin-toggle]')?.addEventListener('click',e=>{const area=document.getElementById('readingArea'),hidden=area.classList.toggle('pinyin-hidden');e.currentTarget.classList.toggle('active',!hidden);e.currentTarget.textContent=hidden?'Hiện Pinyin':'Ẩn Pinyin'});
  document.querySelector('[data-meaning-toggle]')?.addEventListener('click',e=>{const area=document.getElementById('readingArea'),hidden=area.classList.toggle('meaning-hidden');e.currentTarget.classList.toggle('active',!hidden);e.currentTarget.textContent=hidden?'Hiện nghĩa':'Ẩn nghĩa'});
  bindSpeak();
  document.querySelectorAll('[data-char-index]').forEach(b=>b.onclick=()=>{currentWriting=Number(b.dataset.charIndex);render()});
}

function bindSpeak() {
  document.querySelectorAll("[data-speak]").forEach((element) => {
    element.onclick = (event) => {
      if (event.currentTarget.id === "roleDone") return;
      if (event.target.closest?.("[data-word-tip]")) return;
      speak(
        element.dataset.speak,
        Number(element.dataset.speakRate) || 0.88,
      );
    };
    if (element.getAttribute("role") === "button") {
      element.onkeydown = (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          element.click();
        }
      };
    }
  });
  bindInlineVocabulary(document);
}

function initWriter(){const item=WRITING_WORDS[currentWriting];const board=document.getElementById('writerBoard');if(!board)return;board.innerHTML='';if(window.HanziWriter){writer=HanziWriter.create('writerBoard',item.han,{width:board.clientWidth||300,height:board.clientHeight||300,padding:18,showOutline:true,strokeAnimationSpeed:1,delayBetweenStrokes:250,strokeColor:'#9b6200',radicalColor:'#0f766e',outlineColor:'#f8dc82'});document.getElementById('animateWriter').onclick=()=>writer.animateCharacter();document.getElementById('quizWriter').onclick=()=>writer.quiz({showHintAfterMisses:2,highlightOnComplete:true,onComplete:()=>{addScore(15);answerFeedback(true)}});document.getElementById('resetWriter').onclick=()=>{writer.cancelQuiz();writer.showCharacter({duration:0})}}else{board.innerHTML=`<div class="cn" style="font-size:180px;text-align:center;color:var(--orange-700);line-height:300px">${item.han}</div>`}}

document.addEventListener('keydown',e=>{
  if(e.defaultPrevented||e.isComposing||e.keyCode===229)return;
  const tag=document.activeElement?.tagName;
  if(currentTab==='vocab'&&state.vocabMode==='flashcard'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();state.vocabIndex=(state.vocabIndex+(e.key==='ArrowRight'?1:-1)+LESSON.vocabulary.length)%LESSON.vocabulary.length;state.vocabFlipped=false;state.vocabFeedback=null;render();return}
  if(e.key!=='Enter'||!enterAction)return;
  if(tag==='TEXTAREA'||(tag==='INPUT'&&!document.activeElement.disabled))return;
  e.preventDefault();const action=enterAction;setEnterAction(null);action();
});

renderTabs();render();
document.getElementById('soundToggle').onclick=()=>{soundOn=!soundOn;document.getElementById('soundToggle').textContent=soundOn?'音':'静'};
</script>
