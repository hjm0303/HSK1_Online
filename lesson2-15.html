<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HSK 2 • Bài 15 • 新年就要到了。</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <style>
    :root{
      --orange-50:#fff7ed;
      --orange-100:#ffedd5;
      --orange-200:#fed7aa;
      --orange-300:#fdba74;
      --orange-400:#fb923c;
      --orange-500:#f97316;
      --orange-600:#ea580c;
      --orange-700:#c2410c;
      --orange-800:#9a3412;
      --amber:#f59e0b;
      --ink:#263241;
      --muted:#64748b;
      --line:#e5e7eb;
      --panel:#ffffff;
      --green:#0f766e;
      --shadow:0 16px 42px rgba(154,52,18,.10);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      color:var(--ink);
      font-family:"Inter","Be Vietnam Pro","Segoe UI",Arial,sans-serif;
      background:
        radial-gradient(circle at 8% 4%,rgba(251,146,60,.14) 0 14%,transparent 15%),
        radial-gradient(circle at 92% 8%,rgba(245,158,11,.12) 0 13%,transparent 14%),
        linear-gradient(145deg,#fffaf5 0%,#f8fafc 58%,#fff7ed 100%);
    }
    .cn{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","Heiti SC",sans-serif}
    button,input{font:inherit}
    button{cursor:pointer}
    .app-shell{max-width:1480px;margin:0 auto;padding:12px 18px 34px}
    .panel{background:rgba(255,255,255,.96);border:1px solid rgba(253,186,116,.46);border-radius:24px;box-shadow:var(--shadow)}
    .header{
      min-height:68px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;
      background:linear-gradient(135deg,#fff 0%,#fff7ed 64%,#ffedd5 100%);
      position:relative;overflow:hidden;
    }
    .header::after{content:"HSK 2";position:absolute;right:180px;bottom:-24px;font-weight:900;font-size:86px;color:rgba(249,115,22,.055);pointer-events:none}
    .brand{display:flex;align-items:center;gap:11px;min-width:0}
    .brand-badge{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;color:#fff;font-size:25px;font-weight:900;background:linear-gradient(145deg,var(--orange-500),var(--orange-700));box-shadow:0 9px 0 rgba(154,52,18,.16),0 16px 26px rgba(234,88,12,.20)}
    .eyebrow{font-size:11px;font-weight:900;letter-spacing:.08em;color:var(--orange-600);text-transform:uppercase}
    .main-title{font-size:clamp(17px,2.2vw,27px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.18}
    .header-tools{display:flex;align-items:center;gap:8px;z-index:1}
    .tool-btn,.score-pill{min-height:38px;border:1px solid var(--orange-200);border-radius:13px;background:#fff;padding:7px 11px;font-weight:900;color:var(--orange-700);box-shadow:0 7px 15px rgba(154,52,18,.08)}
    .tool-btn:hover{transform:translateY(-1px);background:var(--orange-50)}
    .tabs-wrap{position:sticky;top:6px;z-index:50;margin:10px 0;padding:6px;overflow:hidden;background:rgba(255,255,255,.96);backdrop-filter:blur(10px)}
    .tabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
    .tabs::-webkit-scrollbar{display:none}
    .tab-btn{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 10px;border:1px solid #e2e8f0;border-radius:11px;background:#f8fafc;color:#475569;font-size:12px;font-weight:900;transition:.18s}
    .tab-btn:hover{transform:translateY(-1px);border-color:var(--orange-300);color:var(--orange-700);background:var(--orange-50)}
    .tab-btn.active{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--orange-500),var(--orange-700));box-shadow:0 8px 18px rgba(234,88,12,.24)}
    .tab-icon{width:23px;height:23px;border-radius:8px;display:grid;place-items:center;background:#fff;color:var(--orange-600);box-shadow:0 4px 9px rgba(15,23,42,.08)}
    .tab-btn.active .tab-icon{color:var(--orange-700)}
    .tab-panel{display:none}.tab-panel.active{display:block}
    .section{padding:16px}
    .section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
    .section-title h2{margin:0;font-size:clamp(17px,2vw,24px);font-weight:900}
    .section-title p{margin:2px 0 0;color:var(--muted);font-size:12px}
    .badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:6px 10px;background:var(--orange-100);color:var(--orange-800);font-size:11px;font-weight:900}
    .mini-tabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;scrollbar-width:none}
    .mini-tab{flex:0 0 auto;border:1px solid var(--orange-200);border-radius:13px;background:#fff;padding:8px 12px;color:#64748b;font-size:12px;font-weight:900}
    .mini-tab.active{background:linear-gradient(135deg,#fb923c,#ea580c);color:#fff;border-color:transparent;box-shadow:0 8px 18px rgba(234,88,12,.22)}
    .subpage{display:none}.subpage.active{display:block}
    .grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
    .card{border:1px solid #e2e8f0;border-radius:18px;background:#fff;padding:13px;box-shadow:0 10px 24px rgba(15,23,42,.055)}
    .orange-card{background:linear-gradient(145deg,#fff7ed,#fff);border-color:var(--orange-200)}
    .card h3{margin:0 0 7px;font-size:14px;font-weight:900}
    .card p{margin:0;color:#475569;line-height:1.58;font-size:13px}
    .goal-item{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start}
    .goal-icon{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--orange-100),#fff);font-size:21px}
    .lesson-banner{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:16px;border-radius:21px;background:linear-gradient(135deg,#fff7ed,#ffedd5);border:1px solid var(--orange-200)}
    .lesson-banner .cn{font-size:clamp(25px,3.5vw,45px);font-weight:900;color:var(--orange-700);line-height:1.25}
    .lesson-banner .vi{margin-top:5px;font-weight:800;color:#475569}
    .fox{font-size:64px;filter:drop-shadow(0 10px 12px rgba(154,52,18,.16));animation:float 3s ease-in-out infinite}
    @keyframes float{50%{transform:translateY(-6px)}}
    .dialogue{border:1px solid var(--orange-200);border-radius:18px;overflow:hidden;background:#fff}
    .dialogue-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;background:linear-gradient(135deg,var(--orange-100),#fff7ed);font-weight:900;color:var(--orange-800)}
    .dialogue-lines{padding:10px 12px;display:grid;gap:7px}
    .line{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:start;border-radius:13px;padding:8px 10px}
    .line:nth-child(odd){background:#fff7ed}.line:nth-child(even){background:#f8fafc}
    .speaker{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--orange-500);color:#fff;font-weight:900}
    .line-han{font-size:16px;font-weight:900}.line-py{font-size:11px;color:var(--orange-700);font-weight:800;margin-top:1px}.line-vi{font-size:12px;color:#64748b;margin-top:2px}
    .speak-btn{width:32px;height:32px;border:0;border-radius:10px;background:#fff;color:var(--orange-600);box-shadow:0 6px 12px rgba(15,23,42,.08)}
    .speak-btn:hover{background:var(--orange-100);transform:scale(1.04)}
    .pronunciation-group{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .stress-card{border-radius:18px;padding:14px;border:1px solid var(--orange-200);background:linear-gradient(145deg,#fff,#fff7ed)}
    .stress-pattern{display:flex;align-items:end;justify-content:center;gap:8px;margin:10px 0 13px}
    .stress-dot{width:44px;border-radius:13px 13px 6px 6px;background:linear-gradient(180deg,var(--orange-400),var(--orange-600));display:grid;place-items:center;color:#fff;font-weight:900;box-shadow:0 8px 16px rgba(234,88,12,.18)}
    .stress-dot.medium{height:58px}.stress-dot.strong{height:82px}.stress-dot.light{height:38px;opacity:.68}
    .word-chip-wrap{display:flex;flex-wrap:wrap;gap:7px}
    .word-chip{border:1px solid var(--orange-200);border-radius:13px;background:#fff;padding:8px 10px;text-align:left;color:#334155}
    .word-chip:hover{transform:translateY(-2px);background:var(--orange-50)}
    .word-chip .cn{display:block;font-size:17px;font-weight:900;color:var(--orange-700)}
    .word-chip small{font-weight:800;color:#64748b}
    .vocab-controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
    .filter-btn{border:1px solid var(--orange-200);border-radius:999px;padding:7px 11px;background:#fff;color:#64748b;font-size:11px;font-weight:900}
    .filter-btn.active{background:var(--orange-600);color:#fff;border-color:var(--orange-600)}
    .vocab-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
    .vocab-card{position:relative;min-height:155px;border:1px solid var(--orange-200);border-radius:19px;padding:14px;background:linear-gradient(145deg,#fff,#fff9f4);overflow:hidden;transition:.18s}
    .vocab-card:hover{transform:translateY(-4px);box-shadow:0 16px 26px rgba(154,52,18,.12)}
    .vocab-card::after{content:attr(data-watermark);position:absolute;right:-5px;bottom:-24px;font-family:"Noto Sans SC";font-size:92px;font-weight:900;color:rgba(249,115,22,.055);pointer-events:none}
    .vocab-index{position:absolute;right:10px;top:9px;width:28px;height:28px;border-radius:10px;display:grid;place-items:center;background:var(--orange-100);color:var(--orange-700);font-size:11px;font-weight:900}
    .vocab-han{font-size:28px;font-weight:900;color:var(--orange-700)}
    .vocab-py{font-size:13px;font-weight:900;color:#0f766e}.vocab-vi{margin-top:7px;font-size:13px;font-weight:800}.vocab-pos{margin-top:7px;display:inline-flex;border-radius:999px;background:#ecfdf5;color:#047857;padding:4px 7px;font-size:9px;font-weight:900}.vocab-example{margin-top:7px;color:#64748b;font-size:11px;line-height:1.45}
    .review-list{display:flex;flex-wrap:wrap;gap:7px}.review-chip{border-radius:999px;padding:6px 9px;background:#f8fafc;border:1px solid #e2e8f0;font-size:11px;font-weight:800;color:#475569}
    .writing-layout{display:grid;grid-template-columns:235px minmax(0,1fr);gap:12px}
    .char-sidebar{padding:10px;border:1px solid var(--orange-200);border-radius:18px;background:#fff}
    .char-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:420px;overflow:auto;padding-right:2px}
    .char-btn{aspect-ratio:1;border:1px solid var(--orange-200);border-radius:11px;background:#fff7ed;color:var(--orange-700);font-family:"Noto Sans SC";font-size:20px;font-weight:900}
    .char-btn.active{background:linear-gradient(135deg,var(--orange-500),var(--orange-700));color:#fff;border-color:transparent}
    .writer-main{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:14px;align-items:center;border:1px solid #e2e8f0;border-radius:18px;background:#fff;padding:14px}
    .writer-board{width:min(310px,70vw);height:min(310px,70vw);margin:auto;border:2px solid var(--orange-200);border-radius:16px;background:
      linear-gradient(45deg,transparent 49.6%,rgba(249,115,22,.16) 49.8%,rgba(249,115,22,.16) 50.2%,transparent 50.4%),
      linear-gradient(-45deg,transparent 49.6%,rgba(249,115,22,.16) 49.8%,rgba(249,115,22,.16) 50.2%,transparent 50.4%),
      linear-gradient(90deg,transparent 49.6%,rgba(249,115,22,.18) 49.8%,rgba(249,115,22,.18) 50.2%,transparent 50.4%),
      linear-gradient(0deg,transparent 49.6%,rgba(249,115,22,.18) 49.8%,rgba(249,115,22,.18) 50.2%,transparent 50.4%),#fffdf9;
      box-shadow:inset 0 0 0 7px #fff,0 12px 25px rgba(15,23,42,.08);overflow:hidden}
    .writer-info .big-char{font-family:"Noto Sans SC";font-size:58px;font-weight:900;color:var(--orange-700)}
    .writer-info h3{font-size:20px;margin:0}.writer-info p{font-size:12px;color:#64748b;line-height:1.55}
    .writer-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.action-btn{border:0;border-radius:12px;padding:8px 12px;font-size:11px;font-weight:900}.primary{background:linear-gradient(135deg,var(--orange-500),var(--orange-700));color:#fff}.secondary{background:#f1f5f9;color:#475569}.green{background:#0f766e;color:#fff}
    .note-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
    .grammar-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .grammar-card{border:1px solid var(--orange-200);border-radius:19px;background:#fff;padding:14px;box-shadow:0 10px 24px rgba(15,23,42,.05)}
    .grammar-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}.grammar-no{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--orange-500),var(--orange-700));color:#fff;font-weight:900}.grammar-card h3{margin:0;font-size:16px;font-weight:900;color:var(--orange-800)}
    .formula{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:15px;background:linear-gradient(135deg,#fff7ed,#ffedd5);font-weight:900;color:var(--orange-800);margin:8px 0}.formula span{border-radius:10px;background:#fff;padding:6px 8px;border:1px solid var(--orange-200)}
    .example-list{display:grid;gap:6px}.example{border-radius:12px;background:#f8fafc;padding:8px 10px;font-size:12px}.example .cn{font-size:15px;font-weight:900;color:#334155}.example small{display:block;color:#64748b;margin-top:2px}
    .exercise-shell{overflow:hidden}
    .exercise-head{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 11px;background:linear-gradient(135deg,#fff7ed,#ffedd5);border-bottom:1px solid var(--orange-200)}
    .pet-box{display:flex;align-items:center;gap:7px;border-radius:13px;background:#fff;padding:5px 8px;border:1px solid var(--orange-200);min-width:0}.pet-icon{font-size:27px}.pet-text{font-size:11px;font-weight:900;color:var(--orange-800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .progress{height:7px;border-radius:999px;background:#fed7aa;overflow:hidden}.progress>div{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--orange-500),var(--orange-700));transition:width .25s}.counter{border-radius:999px;background:#fff;color:var(--orange-700);padding:6px 9px;font-size:10px;font-weight:900}
    .exercise-stage{padding:12px}.question-card{max-width:880px;margin:0 auto;border:1px solid #e2e8f0;border-radius:19px;padding:15px;background:#fff;box-shadow:0 14px 28px rgba(15,23,42,.06)}
    .prompt{border-radius:15px;padding:11px 13px;background:#fff7ed;color:var(--orange-800);font-size:clamp(16px,2.6vw,25px);font-weight:900;line-height:1.35}.prompt-sub{margin-top:6px;color:#64748b;font-size:12px;font-style:italic}
    .options{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.option-btn{border:1px solid var(--orange-200);border-radius:14px;background:#fff;padding:9px 14px;color:#334155;font-size:14px;font-weight:900;transition:.15s}.option-btn:hover{transform:translateY(-2px);background:#fff7ed}.option-btn.correct{background:#10b981;color:#fff;border-color:#10b981}.option-btn.wrong{background:#ef4444;color:#fff;border-color:#ef4444}
    .input-row{display:flex;align-items:center;gap:8px;margin-top:12px;border:2px solid var(--orange-300);border-radius:15px;background:#fff;padding:6px 7px;box-shadow:0 0 12px rgba(251,146,60,.20)}.text-input{flex:1;min-width:0;border:0;outline:0;padding:8px 9px;font-size:15px;font-weight:800;color:#1e293b}.submit-btn{width:42px;height:42px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--orange-500),var(--orange-700));color:#fff}.result{min-height:37px;margin-top:9px;border-radius:12px;padding:8px 10px;font-size:12px;font-weight:900}.result.ok{background:#d1fae5;color:#047857}.result.bad{background:#fee2e2;color:#b91c1c}.next-btn{display:none;margin:10px auto 0;border:0;border-radius:999px;padding:9px 18px;background:linear-gradient(135deg,var(--orange-500),var(--orange-700));color:#fff;font-size:12px;font-weight:900}.next-btn.show{display:block}
    .arrange-zone{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;min-height:70px;padding:10px;border:2px dashed var(--orange-300);border-radius:16px;background:#fffaf5}.piece{border:0;border-radius:13px;padding:9px 13px;background:linear-gradient(135deg,var(--orange-400),var(--orange-700));color:#fff;font-size:15px;font-weight:900;box-shadow:0 8px 16px rgba(234,88,12,.18)}.piece.used{opacity:.25;pointer-events:none}.selected-piece{border-radius:13px;padding:9px 13px;background:#9a3412;color:#fff;font-size:15px;font-weight:900}.arrange-pool{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:11px}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:11px}
    .match-toolbar{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-bottom:9px}.match-mode{border:1px solid var(--orange-200);border-radius:999px;padding:7px 11px;background:#fff;color:#64748b;font-size:11px;font-weight:900}.match-mode.active{background:var(--orange-600);color:#fff;border-color:var(--orange-600)}.match-board{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:900px;margin:0 auto}.match-column{display:grid;gap:7px}.match-card{position:relative;min-height:50px;border:2px solid transparent;border-radius:14px;background:linear-gradient(135deg,#fff7ed,#fff);padding:9px 11px;color:#334155;font-size:13px;font-weight:900;transition:.15s}.match-card:hover{transform:scale(1.02);border-color:var(--orange-300)}.match-card.selected{border-color:var(--orange-600);box-shadow:0 0 0 4px rgba(249,115,22,.13)}.match-card.matched{background:#10b981;color:#fff;opacity:.58;pointer-events:none}.match-card.wrong{background:#ef4444;color:#fff}.match-status{text-align:center;margin-top:9px;border-radius:12px;padding:8px;background:#f8fafc;color:#64748b;font-size:11px;font-weight:900}
    .quiz-card{max-width:900px;margin:0 auto;padding:15px}.quiz-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.quiz-stats{display:flex;gap:7px}.quiz-pill{border-radius:999px;padding:7px 10px;background:#fff7ed;color:var(--orange-800);font-size:11px;font-weight:900}.quiz-question{font-size:20px;font-weight:900;color:#334155;margin-bottom:11px}.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quiz-option{border:1px solid var(--orange-200);border-radius:14px;background:#fff;padding:10px 12px;text-align:left;font-size:13px;font-weight:900;color:#475569}.quiz-option:hover{background:#fff7ed}.quiz-option.correct{background:#10b981;color:#fff}.quiz-option.wrong{background:#ef4444;color:#fff}
    .role-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:12px}.scenario-list{display:grid;gap:7px}.scenario-btn{border:1px solid var(--orange-200);border-radius:13px;background:#fff;padding:9px 10px;text-align:left;font-size:11px;font-weight:900;color:#475569}.scenario-btn.active{background:linear-gradient(135deg,var(--orange-500),var(--orange-700));color:#fff;border-color:transparent}.role-stage{border:1px solid var(--orange-200);border-radius:19px;background:#fff;padding:13px}.chat{display:grid;gap:8px}.bubble{max-width:82%;border-radius:16px;padding:9px 11px;font-size:13px}.bubble.a{justify-self:start;background:#fff7ed;border:1px solid var(--orange-200)}.bubble.b{justify-self:end;background:#ecfdf5;border:1px solid #a7f3d0}.bubble .cn{display:block;font-size:16px;font-weight:900}.bubble .py{font-size:11px;color:var(--orange-700);font-weight:800}.bubble .vi{font-size:11px;color:#64748b;margin-top:2px}.role-controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px}
    .footer{text-align:center;color:#64748b;font-size:11px;padding:20px}

function playFeedbackSound(correct){

    compressor.threshold.setValueAtTime(-18,now);
    compressor.knee.setValueAtTime(12,now);
    compressor.ratio.setValueAtTime(5,now);

    compressor.release.setValueAtTime(.18,now);

        osc.frequency.setValueAtTime(freq,now+delay);
        gain.gain.setValueAtTime(.0001,now+delay);
        gain.gain.exponentialRampToValueAtTime(index===3?.42:.50,now+delay+.018);
        gain.gain.exponentialRampToValueAtTime(.0001,now+delay+duration);
        osc.connect(gain);gain.connect(master);osc.start(now+delay);osc.stop(now+delay+duration+.04);
      });
    }else{
      [[220,115,0],[165,92,.13]].forEach(([startFreq,endFreq,delay],index)=>{
        const osc=ctx.createOscillator(),gain=ctx.createGain();
        osc.type=index?'sawtooth':'triangle';
        osc.frequency.setValueAtTime(startFreq,now+delay);
        osc.frequency.exponentialRampToValueAtTime(endFreq,now+delay+.38);
        gain.gain.setValueAtTime(.0001,now+delay);
        gain.gain.exponentialRampToValueAtTime(index?.34:.48,now+delay+.02);
        gain.gain.exponentialRampToValueAtTime(.0001,now+delay+.42);
        osc.connect(gain);gain.connect(master);osc.start(now+delay);osc.stop(now+delay+.45);
      });
    }
  }catch(_){/* Trình duyệt chặn Web Audio thì bỏ qua, không ảnh hưởng bài học */}
}
function fireworks(){
  const colors=['#f97316','#f59e0b','#10b981','#0ea5e9','#ec4899','#8b5cf6','#ef4444'];
  const centers=[
    [18+Math.random()*18,24+Math.random()*18],
    [44+Math.random()*14,16+Math.random()*18],
    [70+Math.random()*16,25+Math.random()*18]
  ];
  centers.forEach((center,burst)=>{
    for(let i=0;i<24;i++){
      const angle=(Math.PI*2*i/24)+(Math.random()-.5)*.16;
      const distance=70+Math.random()*105;
      const p=document.createElement('span');
      p.className='firework-particle';
      p.style.left=center[0]+'vw';p.style.top=center[1]+'vh';
      p.style.color=colors[(i+burst*2)%colors.length];
      p.style.background='currentColor';
      p.style.setProperty('--dx',Math.cos(angle)*distance+'px');
      p.style.setProperty('--dy',Math.sin(angle)*distance+'px');
      p.style.animationDelay=(burst*.10+Math.random()*.05)+'s';
      document.body.appendChild(p);setTimeout(()=>p.remove(),1450);
    }
  });
}

function levenshtein(a,b){const x=[...String(a)],y=[...String(b)],dp=Array(y.length+1).fill(0).map((_,j)=>j);for(let i=1;i<=x.length;i++){let prev=dp[0];dp[0]=i;for(let j=1;j<=y.length;j++){const tmp=dp[j];dp[j]=Math.min(dp[j]+1,dp[j-1]+1,prev+(x[i-1]===y[j-1]?0:1));prev=tmp}}return dp[y.length]}
function speechScore(expected,heard,confidence=0){const a=cleanZh(expected),b=cleanZh(heard);if(!a||!b)return 0;if(a===b)return 100;const sim=1-levenshtein(a,b)/Math.max(a.length,b.length);const contains=(a.includes(b)||b.includes(a))?0.82:0;return Math.max(0,Math.min(100,Math.round(Math.max(sim,contains)*92+Math.max(0,confidence)*8)))}
function stopRoleSession(silent=false){const s=activeRoleSession;if(!s)return;activeRoleSession=null;clearTimeout(s.timeout);try{s.recognition?.stop()}catch(_){}try{if(s.recorder&&s.recorder.state!=="inactive")s.recorder.stop()}catch(_){}try{s.stream?.getTracks().forEach(t=>t.stop())}catch(_){}const btn=document.querySelector(`[data-role-mic="${s.lineIndex}"]`);if(btn){btn.classList.remove("recording");btn.textContent="🎙 Ghi âm"}if(!silent){const out=document.getElementById(`speechResult-${s.lineIndex}`);if(out&&!s.gotResult)out.textContent="Đã dừng ghi âm. Hãy nói lại nếu chưa có kết quả."}}

function bindVocab(){
  const w=()=>LESSON.vocabulary[state.vocabIndex%LESSON.vocabulary.length];
  const next=(delta=1)=>{state.vocabIndex=(state.vocabIndex+delta+LESSON.vocabulary.length)%LESSON.vocabulary.length;state.vocabFlipped=false;state.vocabFeedback=null;render()};
  document.querySelectorAll('[data-vocab-mode]').forEach(b=>b.onclick=()=>{state.vocabMode=b.dataset.vocabMode;state.vocabIndex=0;state.vocabFlipped=false;state.vocabFeedback=null;render()});
  document.querySelectorAll('[data-vocab-back],#vocabStudyBack,#vocabSwitchMode').forEach(b=>b.onclick=()=>{state.vocabMode=null;state.vocabFeedback=null;render()});
  if(!state.vocabMode)return;
  document.getElementById('vocabPrev')?.addEventListener('click',()=>next(-1));
  document.getElementById('vocabNext')?.addEventListener('click',()=>next(1));
  document.getElementById('vocabFlip')?.addEventListener('click',()=>{state.vocabFlipped=true;render();setTimeout(()=>speak(w().han),80)});
  document.getElementById('vocabSpeak')?.addEventListener('click',()=>speak(w().han));
  if(state.vocabMode==='flashcard'){
    setEnterAction(()=>{if(!state.vocabFlipped){state.vocabFlipped=true;render()}else next(1)});
    return;
  }
  if(state.vocabFeedback){
    const btn=document.getElementById('vocabFeedbackNext');btn.onclick=()=>next(1);btn.focus();setEnterAction(()=>next(1));
    return;
  }
  const input=document.getElementById('vocabAnswerInput');
  let composing=false;
  const correct=(value)=>{const mode=state.vocabMode,item=w(),v=String(value||'').trim();if(mode==='vi-zh'||mode==='zh-zh')return cleanZh(v)===cleanZh(item.han);const meanings=item.vi.split(/[;,/]|hoặc/gi).map(cleanVi).filter(Boolean),user=cleanVi(v);const meaningOk=meanings.some(x=>x===user||x.includes(user)||user.includes(x));return mode==='zh-vi'?meaningOk:(cleanZh(v)===cleanZh(item.han)||meaningOk)};
  const submit=()=>{if(composing||!input?.value.trim())return;const value=input.value.trim(),ok=correct(value);state.vocabFeedback={value,correct:ok};if(ok)addScore(10);answerFeedback(ok);render()};
  input?.addEventListener('compositionstart',()=>composing=true);input?.addEventListener('compositionend',()=>composing=false);input?.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&!composing&&e.keyCode!==229){e.preventDefault();submit()}});document.getElementById('vocabSubmit').onclick=submit;input?.focus();
  document.getElementById('vocabListenOrb')?.addEventListener('click',()=>speak(w().han));document.getElementById('vocabSlow')?.addEventListener('click',()=>speak(w().han,.58));if(state.vocabMode==='listen')setTimeout(()=>speak(w().han),250);
}

  <div class="writing-layout"><aside class="char-sidebar"><h3 style="margin:0 0 8px">Chọn chữ</h3><div class="char-grid">${WRITING_WORDS.map((c,i)=>`<button class="char-btn ${i===currentWriting?'active':''}" data-char-index="${i}">${c.han}</button>`).join("")}</div></aside><div class="writer-main"><div><div id="writerBoard" class="writer-board"></div><div class="writer-actions"><button id="animateWriter" class="action-btn primary">▶ Xem thứ tự nét</button><button id="quizWriter" class="action-btn green">✍ Luyện viết</button><button id="resetWriter" class="action-btn secondary">↻ Làm lại</button></div></div><div class="writer-info"><div id="writingBig" class="big-char">${WRITING_WORDS[currentWriting].han}</div><h3 id="writingPinyin">${WRITING_WORDS[currentWriting].py}</h3><p id="writingMeaning">Nghĩa: ${WRITING_WORDS[currentWriting].vi}</p><div class="card orange-card"><h3>Quy tắc chung</h3><p>Viết từ trên xuống dưới, từ trái sang phải. Chú ý chữ trái - phải như <span class="cn">站、妹、阴</span>; chữ trên - dưới như <span class="cn">票、家</span>; chữ độc thể như <span class="cn">日、年、火、车、大、更</span>.</p></div></div></div></div>

    <div class="card"><h3>Nhóm thời gian & năm mới</h3><p>Luyện liên tiếp <span class="cn">日、新、年、更</span>, sau đó ghép thành <span class="cn">新年、明年更好</span>.</p></div>
    <div class="card"><h3>Nhóm đi lại & thời tiết</h3><p>Luyện nhóm <span class="cn">票、火、车、站、阴</span>, sau đó đọc thành <span class="cn">火车站、买票、天阴了</span>.</p></div>
  </div>
</div>`}
function grammarHTML(){return `<div class="panel section">
  <div class="section-title"><div><h2>📐 Ngữ pháp trọng tâm</h2><p>Hai cấu trúc chính của Bài 15: diễn tả một sự việc sắp xảy ra và nhấn mạnh bằng 都……了.</p></div><span class="badge">快要/就要……了 · 都……了</span></div>
  <div class="grammar-grid">
    <article class="grammar-card"><div class="grammar-head"><div class="grammar-no">1</div><h3>快要 / 快 / 就要 / 要……了</h3></div><p>Các cấu trúc này được dùng để diễn tả một sự việc sắp xảy ra. <span class="cn">了</span> đứng ở cuối câu để biểu thị trạng thái mới sắp xuất hiện.</p><div class="formula"><span>Chủ ngữ</span> + <span>快要 / 快 / 就要 / 要</span> + <span>Động từ (+ Tân ngữ)</span> + <span>了</span></div><div class="example-list"><div class="example"><span class="cn">火车快要来了。</span><small>Tàu hỏa sắp đến rồi.</small></div><div class="example"><span class="cn">要下雨了。</span><small>Sắp mưa rồi.</small></div><div class="example"><span class="cn">新的一年快要到了。</span><small>Một năm mới sắp đến rồi.</small></div></div></article>
    <article class="grammar-card"><div class="grammar-head"><div class="grammar-no">2</div><h3>Có trạng ngữ thời gian: chỉ dùng 就要……了</h3></div><p>Nếu trong câu có trạng ngữ chỉ thời gian như <span class="cn">明天、下个月、下个星期</span>, giáo trình yêu cầu dùng <b>就要……了</b>.</p><div class="formula"><span>Thời gian</span> + <span>Chủ ngữ</span> + <span>就要</span> + <span>Động từ (+ Tân ngữ)</span> + <span>了</span></div><div class="example-list"><div class="example"><span class="cn">下个月我们就要回国了。</span><small>Tháng sau chúng ta sắp về nước rồi.</small></div><div class="example"><span class="cn">明天姐姐就要走了。</span><small>Ngày mai chị gái sắp đi rồi.</small></div><div class="example"><span class="cn">下个星期我们就要考试了。</span><small>Tuần sau chúng ta sắp thi rồi.</small></div></div></article>
    <article class="grammar-card"><div class="grammar-head"><div class="grammar-no">3</div><h3>Cấu trúc 都……了</h3></div><p><b>都……了</b> có nghĩa “đã… rồi”, thường dùng để nhấn mạnh thời gian đã muộn, tuổi đã lớn hoặc một hành động đã kéo dài; đôi khi mang sắc thái nhắc nhở hoặc không hài lòng.</p><div class="formula"><span>都</span> + <span>Thời điểm / Tuổi / Khoảng thời gian</span> + <span>了</span></div><div class="example-list"><div class="example"><span class="cn">都八点了，快点儿起床吧。</span><small>Đã 8 giờ rồi, mau dậy đi.</small></div><div class="example"><span class="cn">你都十岁了，可以自己洗衣服了。</span><small>Bạn đã 10 tuổi rồi, có thể tự giặt quần áo rồi.</small></div><div class="example"><span class="cn">都等她半个小时了。</span><small>Đã đợi cô ấy nửa tiếng rồi.</small></div></div></article>
    <article class="grammar-card"><div class="grammar-head"><div class="grammar-no">4</div><h3>Đối chiếu mẫu câu trong bài</h3></div><p>Hãy phân biệt ý “sắp xảy ra” với ý “đã đến mức này rồi”. Hai cấu trúc đều có <span class="cn">了</span> nhưng diễn tả hai thời điểm hoàn toàn khác nhau.</p><div class="formula"><span>就要 / 快要……了 → sắp</span><span>都……了 → đã… rồi</span></div><div class="example-list"><div class="example"><span class="cn">新年就要到了。</span><small>Năm mới sắp đến rồi.</small></div><div class="example"><span class="cn">快要下雨了。</span><small>Trời sắp mưa rồi.</small></div><div class="example"><span class="cn">都八点四十分了。</span><small>Đã 8 giờ 40 phút rồi.</small></div></div></article>
  </div>
</div>`}
function exerciseShell(type,icon,text,total){return `<div class="panel exercise-shell"><div class="exercise-head"><div class="pet-box"><span class="pet-icon">${icon}</span><span class="pet-text" id="${type}Pet">${text}</span></div><div class="progress"><div id="${type}Progress" style="width:${progress(state[type]||0,total)}%"></div></div><div class="counter" id="${type}Counter">Câu ${(state[type]||0)+1}/${total}</div></div><div class="exercise-stage" id="${type}Stage"></div></div>`}

function renderFill(){
  const i=state.fill,q=LESSON.fill[i],stage=document.getElementById('fillStage');setEnterAction(null);
  if(!q){stage.innerHTML=finishCard('Hoàn thành phần Điền từ',LESSON.fill.length);return}
  stage.innerHTML=`<div class="question-card"><div class="prompt cn">${q.q}</div><div class="prompt-sub">${q.vi}</div><div class="options">${shuffle(q.options).map(o=>`<button class="option-btn" data-fill-option="${o}">${o}</button>`).join('')}</div><div id="fillResult" class="result"></div><button id="fillNext" class="next-btn">Câu tiếp theo →</button></div>`;
  const goNext=()=>nextExercise('fill',LESSON.fill.length,renderFill);
  document.querySelectorAll('[data-fill-option]').forEach(b=>b.onclick=()=>{if(document.querySelector('#fillNext.show'))return;const ok=b.dataset.fillOption===q.answer;b.classList.add(ok?'correct':'wrong');const result=document.getElementById('fillResult');result.className='result '+(ok?'ok':'bad');result.innerHTML=ok?'✅ Chính xác!':`❌ Chưa đúng. Đáp án: <b>${q.answer}</b>`;if(ok){addScore(10);answerFeedback(true);setTimeout(()=>speak(q.q.replace('___',q.answer)),430)}else{answerFeedback(false);[...document.querySelectorAll('[data-fill-option]')].find(x=>x.dataset.fillOption===q.answer)?.classList.add('correct')}const next=document.getElementById('fillNext');next.classList.add('show');next.onclick=goNext;next.focus();setEnterAction(goNext)});
}

function renderTyping(){
  const i=state.typing,q=LESSON.typing[i],stage=document.getElementById('typingStage');setEnterAction(null);
  if(!q){stage.innerHTML=finishCard('Hoàn thành phần Dịch & Gõ chữ',LESSON.typing.length);return}
  const label=q.dir==='vi-zh'?'Dịch Việt → Trung':'Dịch Trung → Việt';
  stage.innerHTML=`<div class="question-card"><span class="badge">${label}</span><div class="prompt ${q.dir==='zh-vi'?'cn':''}" style="margin-top:9px">${q.prompt}</div><div class="input-row"><input id="typingInput" class="text-input" autocomplete="off" placeholder="${q.dir==='vi-zh'?'Gõ câu tiếng Trung…':'Gõ nghĩa tiếng Việt…'}"><button id="typingSubmit" class="submit-btn">➤</button></div><div id="typingResult" class="result"></div><button id="typingNext" class="next-btn">Câu tiếp theo →</button></div>`;
  const input=document.getElementById('typingInput');let composing=false,answered=false;
  const goNext=()=>nextExercise('typing',LESSON.typing.length,renderTyping);
  const submit=()=>{if(answered){goNext();return}const value=input.value.trim();if(!value||composing)return;let ok=false;if(q.dir==='vi-zh')ok=[q.answer,...(q.alts||[])].some(a=>cleanZh(value)===cleanZh(a));else{const v=cleanVi(value);ok=[q.answer,...(q.alts||[])].some(a=>v===cleanVi(a)||v.includes(cleanVi(a))||cleanVi(a).includes(v))}answered=true;const result=document.getElementById('typingResult');result.className='result '+(ok?'ok':'bad');result.innerHTML=ok?`✅ Chính xác! ${q.show?`<span class="cn">${q.show}</span>`:''}`:`❌ Đáp án gợi ý: <b class="${q.dir==='vi-zh'?'cn':''}">${q.show||q.answer}</b>`;if(ok){addScore(12);answerFeedback(true);if(q.dir==='vi-zh')setTimeout(()=>speak(q.show||q.answer),430)}else answerFeedback(false);input.disabled=true;const next=document.getElementById('typingNext');next.classList.add('show');next.onclick=goNext;next.focus();setEnterAction(goNext)};
  input.addEventListener('compositionstart',()=>composing=true);input.addEventListener('compositionend',()=>composing=false);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&!composing&&e.keyCode!==229){e.preventDefault();submit()}});document.getElementById('typingSubmit').onclick=submit;input.focus();
}

let arrangeSelected=[];
function renderArrange(){
  const i=state.arrange,q=LESSON.arrange[i],stage=document.getElementById('arrangeStage');arrangeSelected=[];setEnterAction(null);
  if(!q){stage.innerHTML=finishCard('Hoàn thành phần Sắp xếp câu',LESSON.arrange.length);return}
  const pieces=shuffle(q.pieces.map((text,index)=>({text,index})));
  stage.innerHTML=`<div class="question-card"><div class="prompt-sub" style="font-style:normal;font-weight:650">${q.vi}</div><div id="arrangeZone" class="arrange-zone"><span style="color:#94a3b8;font-size:12px">Chạm các mảnh bên dưới</span></div><div id="arrangePool" class="arrange-pool">${pieces.map((p,i)=>`<button class="piece" data-piece-id="${i}" data-piece="${p.text}">${p.text}</button>`).join('')}</div><div class="actions"><button id="arrangeCheck" class="action-btn primary">Kiểm tra</button><button id="arrangeReset" class="action-btn secondary">Làm lại</button></div><div id="arrangeResult" class="result"></div><button id="arrangeNext" class="next-btn">Câu tiếp theo →</button></div>`;
  const draw=()=>{const zone=document.getElementById('arrangeZone');zone.innerHTML=arrangeSelected.length?arrangeSelected.map((x,j)=>`<button class="selected-piece" data-selected="${j}">${x.text}</button>`).join(''):'<span style="color:#94a3b8;font-size:12px">Chạm các mảnh bên dưới</span>';document.querySelectorAll('[data-selected]').forEach(b=>b.onclick=()=>{const x=arrangeSelected.splice(Number(b.dataset.selected),1)[0];document.querySelector(`[data-piece-id="${x.id}"]`)?.classList.remove('used');draw()})};
  document.querySelectorAll('[data-piece-id]').forEach(b=>b.onclick=()=>{if(b.classList.contains('used'))return;b.classList.add('used');arrangeSelected.push({text:b.dataset.piece,id:b.dataset.pieceId});draw()});
  const goNext=()=>nextExercise('arrange',LESSON.arrange.length,renderArrange);
  const check=()=>{const value=arrangeSelected.map(x=>x.text).join(''),ok=cleanZh(value)===cleanZh(q.answer),r=document.getElementById('arrangeResult');r.className='result '+(ok?'ok':'bad');r.innerHTML=ok?'✅ Trật tự chính xác!':`❌ Câu đúng: <b class="cn">${q.answer}。</b>`;if(ok){addScore(12);answerFeedback(true);setTimeout(()=>speak(q.answer),430)}else answerFeedback(false);const next=document.getElementById('arrangeNext');next.classList.add('show');next.onclick=goNext;next.focus();setEnterAction(goNext)};
  document.getElementById('arrangeReset').onclick=()=>{arrangeSelected=[];document.querySelectorAll('[data-piece-id]').forEach(b=>b.classList.remove('used'));draw();document.getElementById('arrangeResult').className='result';document.getElementById('arrangeResult').textContent='';document.getElementById('arrangeNext').classList.remove('show');setEnterAction(check)};
  document.getElementById('arrangeCheck').onclick=check;setEnterAction(check);
}

function finishCard(title,total){confetti();return `<div class="question-card" style="text-align:center"><div style="font-size:58px">🏆</div><h2 style="margin:4px 0;color:var(--orange-700)">${title}</h2><p>Bạn đã hoàn thành ${total} câu. Hãy chuyển sang mục tiếp theo để tiếp tục luyện tập.</p></div>`}
function updateExercise(type,total){const bar=document.getElementById(type+'Progress'),count=document.getElementById(type+'Counter');if(bar)bar.style.width=state[type]>=total?'100%':progress(state[type],total)+'%';if(count)count.textContent=`Câu ${Math.min(state[type]+1,total)}/${total}`}

function matchHTML(){return `<div class="panel section"><div class="section-title"><div><h2>🔗 Nối cặp</h2><p>Ghép từ/câu tiếng Trung với nghĩa đúng.</p></div><span id="matchCount" class="badge">0 cặp</span></div><div class="match-toolbar"><button class="match-mode ${state.matchMode==='vocab'?'active':''}" data-match-mode="vocab">${LESSON.vocabulary.length} từ mới</button><button class="match-mode ${state.matchMode==='sentences'?'active':''}" data-match-mode="sentences">Câu trong bài khóa</button></div><div id="matchStage"></div></div>`}
function matchData(){if(state.matchMode==='vocab')return LESSON.vocabulary.map(v=>({key:String(v.id),left:v.han,right:v.vi}));return LESSON.dialogues.flatMap((d,di)=>d.lines.map((l,li)=>({key:`${di}-${li}`,left:l.han,right:l.vi}))).slice(0,12)}
function bindMatch(){document.querySelectorAll('[data-match-mode]').forEach(b=>b.onclick=()=>{state.matchMode=b.dataset.matchMode;state.matchLeft=null;state.matchRight=null;state.matched=new Set();render()});const data=matchData();const rights=shuffle(data.map(x=>({key:x.key,text:x.right})));document.getElementById('matchStage').innerHTML=`<div class="match-board"><div class="match-column">${data.map(x=>`<button class="match-card" data-side="left" data-key="${x.key}"><span class="cn">${x.left}</span></button>`).join('')}</div><div class="match-column">${rights.map(x=>`<button class="match-card" data-side="right" data-key="${x.key}">${x.text}</button>`).join('')}</div></div><div id="matchStatus" class="match-status">Chọn một thẻ ở mỗi bên.</div>`;document.querySelectorAll('.match-card').forEach(b=>b.onclick=()=>{if(b.classList.contains('matched'))return;const side=b.dataset.side;document.querySelectorAll(`.match-card[data-side="${side}"]`).forEach(x=>x.classList.remove('selected'));b.classList.add('selected');state[side==='left'?'matchLeft':'matchRight']=b;if(state.matchLeft&&state.matchRight){const ok=state.matchLeft.dataset.key===state.matchRight.dataset.key;if(ok){state.matchLeft.classList.add('matched');state.matchRight.classList.add('matched');state.matched.add(state.matchLeft.dataset.key);addScore(8);answerFeedback(true);document.getElementById('matchStatus').textContent='✅ Chính xác!';if(side==='right'){const spoken=state.matchLeft.textContent.trim();setTimeout(()=>speak(spoken),430)}}else{state.matchLeft.classList.add('wrong');state.matchRight.classList.add('wrong');document.getElementById('matchStatus').textContent='❌ Hai thẻ chưa khớp.';answerFeedback(false);setTimeout(()=>{state.matchLeft?.classList.remove('wrong','selected');state.matchRight?.classList.remove('wrong','selected');state.matchLeft=null;state.matchRight=null},500)}if(ok){state.matchLeft.classList.remove('selected');state.matchRight.classList.remove('selected');state.matchLeft=null;state.matchRight=null;document.getElementById('matchCount').textContent=`${state.matched.size}/${data.length} cặp`;if(state.matched.size===data.length){confetti();document.getElementById('matchStatus').textContent='🏆 Hoàn thành toàn bộ cặp nối!'}}}})}

function quizHTML(){return `<div class="panel quiz-card"><div class="quiz-top"><div><div class="eyebrow">HSK 2 • BÀI 15</div><h2 style="margin:2px 0">❓ Trắc nghiệm 10 câu</h2></div><div class="quiz-stats"><span class="quiz-pill">Điểm <b id="quizScore">${state.quizScore}</b>/10</span><span class="quiz-pill">Câu <b id="quizNum">${Math.min(state.quiz+1,10)}</b>/10</span></div></div><div id="quizStage"></div></div>`}
function renderQuiz(){
  const q=LESSON.quiz[state.quiz],stage=document.getElementById('quizStage');setEnterAction(null);
  if(!q){stage.innerHTML=finishCard(`Hoàn thành trắc nghiệm: ${state.quizScore}/10`,10);return}
  stage.innerHTML=`<div class="quiz-question">${q.q}</div><div class="quiz-options">${q.opts.map((o,i)=>`<button class="quiz-option" data-quiz-option="${i}"><span class="quiz-letter">${String.fromCharCode(65+i)}</span><span class="quiz-answer">${o}</span></button>`).join('')}</div><div id="quizResult" class="result"></div><button id="quizNext" class="next-btn">Câu tiếp theo →</button>`;
  const goNext=()=>{state.quiz++;renderQuiz();const n=document.getElementById('quizNum');if(n)n.textContent=Math.min(state.quiz+1,10)};
  document.querySelectorAll('[data-quiz-option]').forEach(b=>b.onclick=()=>{if(document.querySelector('#quizNext.show'))return;const idx=Number(b.dataset.quizOption),ok=idx===q.a;b.classList.add(ok?'correct':'wrong');document.querySelector(`[data-quiz-option="${q.a}"]`)?.classList.add('correct');const result=document.getElementById('quizResult');result.className='result '+(ok?'ok':'bad');result.textContent=ok?'✅ Chính xác!':'❌ Chưa đúng.';if(ok){state.quizScore++;addScore(10);document.getElementById('quizScore').textContent=state.quizScore}answerFeedback(ok);const next=document.getElementById('quizNext');next.classList.add('show');next.onclick=goNext;next.focus();setEnterAction(goNext)});
}

function roleplayHTML(){return `<div class="panel section"><div class="section-title"><div><h2>🎭 Roleplay 4 tình huống</h2><p>Nghe mẫu, ghi âm từng câu của vai đã chọn và nhận điểm phát âm ngay sau khi nói.</p></div><span class="badge">🎙 Ghi âm + chấm điểm</span></div><div class="role-layout"><aside class="card"><h3>Chọn tình huống</h3><div class="scenario-list">${LESSON.dialogues.map((d,i)=>`<button class="scenario-btn ${i===state.scenario?'active':''}" data-scenario="${i}">${d.icon} ${d.title}</button>`).join('')}</div><h3 style="margin-top:12px">Chọn vai luyện nói</h3><div class="actions"><button class="action-btn ${state.role==='a'?'primary':'secondary'}" data-role="a">Vai A</button><button class="action-btn ${state.role==='b'?'primary':'secondary'}" data-role="b">Vai B</button></div><div class="role-help">Dùng Chrome hoặc Edge và cho phép quyền Micro. Hệ thống sẽ ghi lại giọng đọc, nhận dạng tiếng Trung và chấm theo độ khớp với câu mẫu.</div></aside><div id="roleStage" class="role-stage"></div></div></div>`}
function bindRoleplay(){
  document.querySelectorAll('[data-scenario]').forEach(b=>b.onclick=()=>{stopRoleSession(true);state.scenario=Number(b.dataset.scenario);render()});
  document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{stopRoleSession(true);state.role=b.dataset.role;render()});
  const d=LESSON.dialogues[state.scenario],roleUpper=state.role.toUpperCase();
  document.getElementById('roleStage').innerHTML=`<div class="dialogue-head"><span>${d.icon} ${d.title}</span><button class="speak-btn" data-speak="${d.lines.map(l=>l.han).join(' ')}">🔊</button></div><div class="chat">${d.lines.map((l,i)=>{const selected=l.who.toLowerCase()===state.role,key=`${state.scenario}-${state.role}-${i}`,saved=state.roleScores[key]||0,record=roleRecordings.get(key);return `<div class="role-line ${l.who.toLowerCase()}"><div class="bubble ${l.who.toLowerCase()}" style="${selected?'outline:3px solid rgba(249,115,22,.22)':''}"><span class="cn">${l.who}: ${l.han}</span><span class="py">${l.py}</span><span class="vi">${l.vi}</span></div><div class="speech-tools"><button class="speech-tool" data-speak="${l.han}">🔊 Nghe</button>${selected?`<button class="speech-tool mic" data-role-mic="${i}" data-expected="${l.han}">🎙 Ghi âm</button><button class="speech-tool" data-role-play="${i}" ${record?'':'disabled'}>▶ Nghe lại</button><span id="speechScore-${i}" class="speech-score ${saved>=80?'good':saved>=60?'mid':saved?'low':''}">${saved?saved+' điểm':'Chưa chấm'}</span>`:''}</div></div>${selected?`<div id="speechResult-${i}" class="speech-result">Bấm “Ghi âm”, đọc trọn câu rồi dừng. Điểm sẽ hiện sau mỗi lần nói.</div>`:''}`}).join('')}</div><div class="role-controls"><button class="action-btn primary" data-speak="${d.lines.filter(l=>l.who.toLowerCase()===state.role).map(l=>l.han).join(' ')}">🔊 Nghe toàn bộ vai ${roleUpper}</button></div>`;
  bindSpeak();
  document.querySelectorAll('[data-role-mic]').forEach(b=>b.onclick=()=>{const idx=Number(b.dataset.roleMic);if(activeRoleSession?.lineIndex===idx){stopRoleSession();return}startRoleRecording(idx,b.dataset.expected)});
  document.querySelectorAll('[data-role-play]').forEach(b=>b.onclick=()=>{const key=`${state.scenario}-${state.role}-${b.dataset.rolePlay}`,url=roleRecordings.get(key);if(url){const audio=new Audio(url);audio.play().catch(()=>{})}});
}
async function startRoleRecording(lineIndex,expected){
  stopRoleSession(true);
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const out=document.getElementById(`speechResult-${lineIndex}`),btn=document.querySelector(`[data-role-mic="${lineIndex}"]`);
  if(!SR){out.className='speech-result low';out.textContent='Trình duyệt chưa hỗ trợ chấm giọng nói. Hãy mở file bằng Chrome hoặc Edge phiên bản mới.';return}
  let stream=null,recorder=null,chunks=[];
  try{stream=await navigator.mediaDevices?.getUserMedia({audio:true});if(stream&&window.MediaRecorder){recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};recorder.onstop=()=>{if(chunks.length){const key=`${state.scenario}-${state.role}-${lineIndex}`,old=roleRecordings.get(key);if(old)URL.revokeObjectURL(old);const url=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType||'audio/webm'}));roleRecordings.set(key,url);const play=document.querySelector(`[data-role-play="${lineIndex}"]`);if(play)play.disabled=false}};recorder.start()}}catch(_){stream=null}
  const recognition=new SR();recognition.lang='zh-CN';recognition.interimResults=false;recognition.maxAlternatives=5;recognition.continuous=false;
  const session={lineIndex,expected,recognition,recorder,stream,chunks,gotResult:false,timeout:null};activeRoleSession=session;
  btn.classList.add('recording');btn.textContent='⏹ Dừng';out.className='speech-result';out.textContent='🎙 Đang ghi âm và nhận dạng... Hãy đọc rõ, đúng nhịp.';
  const finish=()=>{if(activeRoleSession===session)activeRoleSession=null;clearTimeout(session.timeout);try{if(recorder&&recorder.state!=="inactive")recorder.stop()}catch(_){}setTimeout(()=>{try{stream?.getTracks().forEach(t=>t.stop())}catch(_){}},120);btn.classList.remove('recording');btn.textContent='🎙 Ghi âm'};
  recognition.onresult=e=>{session.gotResult=true;const alts=[...e.results[0]];let best={text:'',score:0,confidence:0};alts.forEach(a=>{const s=speechScore(expected,a.transcript,a.confidence||0);if(s>best.score)best={text:a.transcript,score:s,confidence:a.confidence||0}});const key=`${state.scenario}-${state.role}-${lineIndex}`,old=state.roleScores[key]||0;state.roleScores[key]=Math.max(old,best.score);if(best.score>old)addScore(Math.max(1,Math.round((best.score-old)/10)));const scoreEl=document.getElementById(`speechScore-${lineIndex}`);scoreEl.textContent=`${best.score} điểm`;scoreEl.className='speech-score '+(best.score>=80?'good':best.score>=60?'mid':'low');out.className='speech-result '+(best.score>=80?'good':best.score>=60?'mid':'low');out.innerHTML=best.score>=90?`🌟 Rất tốt! Bạn nói: <b class="cn">${escapeHTML(best.text)}</b>`:best.score>=70?`👍 Khá tốt (${best.score}/100). Bạn nói: <b class="cn">${escapeHTML(best.text)}</b>. Hãy nghe mẫu và chỉnh nhẹ thanh điệu.`:`🔁 Điểm ${best.score}/100. Máy nghe được: <b class="cn">${escapeHTML(best.text)}</b>. Hãy nghe mẫu, nói chậm và thử lại.`;playFeedbackSound(best.score>=70);if(best.score>=80)fireworks();finish()};
  recognition.onerror=e=>{out.className='speech-result low';out.textContent=e.error==='not-allowed'?'Micro chưa được cấp quyền. Hãy cho phép Micro trong trình duyệt rồi thử lại.':'Không nhận được giọng nói rõ ràng. Hãy thử lại ở nơi yên tĩnh.';finish()};
  recognition.onend=()=>{if(!session.gotResult){out.className='speech-result mid';out.textContent='Chưa nhận được câu hoàn chỉnh. Hãy bấm ghi âm và đọc lại một lần nữa.'}finish()};
  session.timeout=setTimeout(()=>{try{recognition.stop()}catch(_){}},10000);
  try{recognition.start()}catch(_){out.className='speech-result low';out.textContent='Không thể khởi động Micro. Hãy tải lại trang và thử bằng Chrome/Edge.';finish()}
}

function bindCommon(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{stopRoleSession(true);currentTab=b.dataset.tab;renderTabs();render()});document.querySelectorAll('[data-mini]').forEach(b=>b.onclick=()=>{const id=b.dataset.mini;document.querySelectorAll('[data-mini]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('[data-subpage]').forEach(x=>x.classList.toggle('active',x.dataset.subpage===id))});bindSpeak();document.querySelectorAll('[data-char-index]').forEach(b=>b.onclick=()=>{currentWriting=Number(b.dataset.charIndex);render()})}

function bindSpeak(){document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=e=>{if(e.currentTarget.id==='roleDone')return;speak(b.dataset.speak)})}

function initWriter(){const item=WRITING_WORDS[currentWriting];const board=document.getElementById('writerBoard');if(!board)return;board.innerHTML='';if(window.HanziWriter){writer=HanziWriter.create('writerBoard',item.han,{width:board.clientWidth||300,height:board.clientHeight||300,padding:18,showOutline:true,strokeAnimationSpeed:1,delayBetweenStrokes:250,strokeColor:'#c2410c',radicalColor:'#0f766e',outlineColor:'#fed7aa'});document.getElementById('animateWriter').onclick=()=>writer.animateCharacter();document.getElementById('quizWriter').onclick=()=>writer.quiz({showHintAfterMisses:2,highlightOnComplete:true,onComplete:()=>{addScore(15);answerFeedback(true)}});document.getElementById('resetWriter').onclick=()=>{writer.cancelQuiz();writer.showCharacter({duration:0})}}else{board.innerHTML=`<div class="cn" style="font-size:180px;text-align:center;color:var(--orange-700);line-height:300px">${item.han}</div>`}}

document.addEventListener('keydown',e=>{
  if(e.defaultPrevented||e.isComposing||e.keyCode===229)return;
  const tag=document.activeElement?.tagName;
  if(currentTab==='vocab'&&state.vocabMode==='flashcard'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();state.vocabIndex=(state.vocabIndex+(e.key==='ArrowRight'?1:-1)+LESSON.vocabulary.length)%LESSON.vocabulary.length;state.vocabFlipped=false;state.vocabFeedback=null;render();return}
  if(e.key!=='Enter'||!enterAction)return;
  if(tag==='TEXTAREA'||(tag==='INPUT'&&!document.activeElement.disabled))return;
  e.preventDefault();const action=enterAction;setEnterAction(null);action();
});

renderTabs();render();
document.getElementById('soundToggle').onclick=()=>{soundOn=!soundOn;document.getElementById('soundToggle').textContent=soundOn?'🔊':'🔇'};
</script>
