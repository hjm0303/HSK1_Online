<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HSK 1 • Bài 1 • 你好，新同学！</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <style>
    :root{
      --orange-50:#fff7ed;
      --orange-100:#ffedd5;
      --orange-200:#fed7aa;
      --orange-300:#fdba74;
      --orange-400:#fb923c;
      --orange-500:#f97316;
      --orange-600:#ea580c;
      --orange-700:#c2410c;
      --orange-800:#9a3412;
      --amber:#f59e0b;
      --ink:#263241;
      --muted:#64748b;
      --line:#e5e7eb;
      --panel:#ffffff;
      --green:#0f766e;
      --shadow:0 16px 42px rgba(154,52,18,.10);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      color:var(--ink);
      font-family:"Inter","Be Vietnam Pro",system-ui,"Segoe UI",Arial,"Segoe UI Emoji","Noto Sans SC",sans-serif;

        radial-gradient(circle at 92% 8%,rgba(245,158,11,.12) 0 13%,transparent 14%),

    }
    .cn{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei","Noto Sans SC","Heiti SC",sans-serif}
    button,input{font:inherit}
    button{cursor:pointer}
    .app-shell{max-width:1480px;margin:0 auto;padding:12px 18px 34px}
    .panel{background:rgba(255,255,255,.96);border:1px solid rgba(253,186,116,.46);border-radius:24px;box-shadow:var(--shadow)}
    .header{
      min-height:68px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;

    }
    .header::after{content:"HSK 3";position:absolute;right:180px;bottom:-24px;font-weight:900;font-size:86px;color:rgba(217,154,0,.075);pointer-events:none}
    .brand{display:flex;align-items:center;gap:11px;min-width:0}
    .brand-badge{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;color:#fff;font-size:25px;font-weight:900;background:linear-gradient(145deg,var(--orange-500),var(--orange-700));box-shadow:0 9px 0 rgba(154,52,18,.16),0 16px 26px rgba(234,88,12,.20)}
    .eyebrow{font-size:11px;font-weight:900;letter-spacing:.08em;color:var(--orange-600);text-transform:uppercase}
    .main-title{font-size:clamp(17px,2.2vw,27px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.18}
    .header-tools{display:flex;align-items:center;gap:8px;z-index:1}
    .tool-btn,.score-pill{min-height:38px;border:1px solid var(--orange-200);border-radius:13px;background:#fff;padding:7px 11px;font-weight:900;color:var(--orange-700);box-shadow:0 7px 15px rgba(154,52,18,.08)}

    .tabs-wrap{position:sticky;top:6px;z-index:50;margin:10px 0;padding:6px;overflow:hidden;background:rgba(255,255,255,.96);backdrop-filter:blur(10px)}
    .tabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
    .tabs::-webkit-scrollbar{display:none}
    .tab-btn{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 10px;border:1px solid #e2e8f0;border-radius:11px;background:#f8fafc;color:#475569;font-size:12px;font-weight:900;transition:.18s}
    .tab-btn:hover{transform:translateY(-1px);border-color:var(--orange-300);color:var(--orange-700);background:var(--orange-50)}
    .tab-btn.active{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--orange-500),var(--orange-700));box-shadow:0 8px 18px rgba(234,88,12,.24)}
    .tab-icon{width:23px;height:23px;border-radius:8px;display:grid;place-items:center;background:#fff;color:var(--orange-600);box-shadow:0 4px 9px rgba(15,23,42,.08)}
    .tab-btn.active .tab-icon{color:var(--orange-700)}
    .tab-panel{display:none}.tab-panel.active{display:block}
    .section{padding:16px}
    .section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
    .section-title h2{margin:0;font-size:clamp(17px,2vw,24px);font-weight:900}
    .section-title p{margin:2px 0 0;color:var(--muted);font-size:12px}
    .badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:6px 10px;background:var(--orange-100);color:var(--orange-800);font-size:11px;font-weight:900}
    .mini-tabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;scrollbar-width:none}
    .mini-tab{flex:0 0 auto;border:1px solid var(--orange-200);border-radius:13px;background:#fff;padding:8px 12px;color:#64748b;font-size:12px;font-weight:900}
    .mini-tab.active{background:linear-gradient(135deg,#fb923c,#ea580c);color:#fff;border-color:transparent;box-shadow:0 8px 18px rgba(234,88,12,.22)}
    .subpage{display:none}.subpage.active{display:block}
    .grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
    .card{border:1px solid #e2e8f0;border-radius:18px;background:#fff;padding:13px;box-shadow:0 10px 24px rgba(15,23,42,.055)}
    .orange-card{background:linear-gradient(145deg,#fff7ed,#fff);border-color:var(--orange-200)}
    .card h3{margin:0 0 7px;font-size:14px;font-weight:900}
    .card p{margin:0;color:#475569;line-height:1.58;font-size:13px}
    .goal-item{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start}
    .goal-icon{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--orange-100),#fff);font-size:21px}
    .lesson-banner{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:16px;border-radius:21px;background:linear-gradient(135deg,#fff7ed,#ffedd5);border:1px solid var(--orange-200)}
    .lesson-banner .cn{font-size:clamp(25px,3.5vw,45px);font-weight:900;color:var(--orange-700);line-height:1.25}

    .fox{font-size:64px;filter:drop-shadow(0 10px 12px rgba(154,52,18,.16));animation:float 3s ease-in-out infinite}

    .line-han{font-size:16px;font-weight:900}.line-py{font-size:11px;color:var(--orange-700);font-weight:800;margin-top:1px}.line-vi{font-size:12px;color:#64748b;margin-top:2px}
    .speak-btn{width:32px;height:32px;border:0;border-radius:10px;background:#fff;color:var(--orange-600);box-shadow:0 6px 12px rgba(15,23,42,.08)}

    .pronunciation-group{display:grid;grid-template-columns:1fr 1fr;gap:12px}

    .stress-dot.medium{height:58px}.stress-dot.strong{height:82px}.stress-dot.light{height:38px;opacity:.68}
    .word-chip-wrap{display:flex;flex-wrap:wrap;gap:7px}
    .word-chip{border:1px solid var(--orange-200);border-radius:13px;background:#fff;padding:8px 10px;text-align:left;color:#334155}
    .word-chip:hover{transform:translateY(-2px);background:var(--orange-50)}
    .word-chip .cn{display:block;font-size:17px;font-weight:900;color:var(--orange-700)}
    .word-chip small{font-weight:800;color:#64748b}
    .vocab-controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
    .filter-btn{border:1px solid var(--orange-200);border-radius:999px;padding:7px 11px;background:#fff;color:#64748b;font-size:11px;font-weight:900}
    .filter-btn.active{background:var(--orange-600);color:#fff;border-color:var(--orange-600)}
    .vocab-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
    .vocab-card{position:relative;min-height:155px;border:1px solid var(--orange-200);border-radius:19px;padding:14px;background:linear-gradient(145deg,#fff,#fff9f4);overflow:hidden;transition:.18s}

    .vocab-index{position:absolute;right:10px;top:9px;width:28px;height:28px;border-radius:10px;display:grid;place-items:center;background:var(--orange-100);color:var(--orange-700);font-size:11px;font-weight:900}
    .vocab-han{font-size:28px;font-weight:900;color:var(--orange-700)}
    .vocab-py{font-size:13px;font-weight:900;color:#0f766e}.vocab-vi{margin-top:7px;font-size:13px;font-weight:800}.vocab-pos{margin-top:7px;display:inline-flex;border-radius:999px;background:#ecfdf5;color:#047857;padding:4px 7px;font-size:9px;font-weight:900}.vocab-example{margin-top:7px;color:#64748b;font-size:11px;line-height:1.45}
    .review-list{display:flex;flex-wrap:wrap;gap:7px}.review-chip{border-radius:999px;padding:6px 9px;background:#f8fafc;border:1px solid #e2e8f0;font-size:11px;font-weight:800;color:#475569}
    .writing-layout{display:grid;grid-template-columns:235px minmax(0,1fr);gap:12px}
    .char-sidebar{padding:10px;border:1px solid var(--orange-200);border-radius:18px;background:#fff}
    .char-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:420px;overflow:auto;padding-right:2px}
    .char-btn{aspect-ratio:1;border:1px solid var(--orange-200);border-radius:11px;background:#fff7ed;color:var(--orange-700);font-family:"Noto Sans SC","Noto Sans SC",sans-serif;font-size:20px;font-weight:900}
    .char-btn.active{background:linear-gradient(135deg,var(--orange-500),var(--orange-700));color:#fff;border-color:transparent}
    .writer-main{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:14px;align-items:center;border:1px solid #e2e8f0;border-radius:18px;background:#fff;padding:14px}
    .writer-board{width:min(310px,70vw);height:min(310px,70vw);margin:auto;border:2px solid var(--orange-200);border-radius:16px;background:
      linear-gradient(45deg,transparent 49.6%,rgba(249,115,22,.16) 49.8%,rgba(249,115,22,.16) 50.2%,transparent 50.4%),
      linear-gradient(-45deg,transparent 49.6%,rgba(249,115,22,.16) 49.8%,rgba(249,115,22,.16) 50.2%,transparent 50.4%),
      linear-gradient(90deg,transparent 49.6%,rgba(249,115,22,.18) 49.8%,rgba(249,115,22,.18) 50.2%,transparent 50.4%),
      linear-gradient(0deg,transparent 49.6%,rgba(249,115,22,.18) 49.8%,rgba(249,115,22,.18) 50.2%,transparent 50.4%),#fffdf9;
      box-shadow:inset 0 0 0 7px #fff,0 12px 25px rgba(15,23,42,.08);overflow:hidden}
    .writer-info .big-char{font-family:"Noto Sans SC","Noto Sans SC",sans-serif;font-size:58px;font-weight:900;color:var(--orange-700)}
    .writer-info h3{font-size:20px;margin:0}.writer-info p{font-size:12px;color:#64748b;line-height:1.55}
    .writer-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.action-btn{border:0;border-radius:12px;padding:8px 12px;font-size:11px;font-weight:900}.primary{background:linear-gradient(135deg,var(--orange-500),var(--orange-700));color:#fff}.secondary{background:#f1f5f9;color:#475569}.green{background:#0f766e;color:#fff}
    .note-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
    .grammar-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .grammar-card{border:1px solid var(--orange-200);border-radius:19px;background:#fff;padding:14px;box-shadow:0 10px 24px rgba(15,23,42,.05)}
    .grammar-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}.grammar-no{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--orange-500),var(--orange-700));color:#fff;font-weight:900}.grammar-card h3{margin:0;font-size:16px;font-weight:900;color:var(--orange-800)}
    .formula{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:15px;background:linear-gradient(135deg,#fff7ed,#ffedd5);font-weight:900;color:var(--orange-800);margin:8px 0}.formula span{border-radius:10px;background:#fff;padding:6px 8px;border:1px solid var(--orange-200)}
    .example-list{display:grid;gap:6px}.example{border-radius:12px;background:#f8fafc;padding:8px 10px;font-size:12px}.example .cn{font-size:15px;font-weight:900;color:#334155}.example small{display:block;color:#64748b;margin-top:2px}
    .exercise-shell{overflow:hidden}
    .exercise-head{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 11px;background:linear-gradient(135deg,#fff7ed,#ffedd5);border-bottom:1px solid var(--orange-200)}
    .pet-box{display:flex;align-items:center;gap:7px;border-radius:13px;background:#fff;padding:5px 8px;border:1px solid var(--orange-200);min-width:0}.pet-icon{font-size:27px}.pet-text{font-size:11px;font-weight:900;color:var(--orange-800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .progress{height:7px;border-radius:999px;background:#fed7aa;overflow:hidden}.progress>div{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--orange-500),var(--orange-700));transition:width .25s}.counter{border-radius:999px;background:#fff;color:var(--orange-700);padding:6px 9px;font-size:10px;font-weight:900}
    .exercise-stage{padding:12px}.question-card{max-width:880px;margin:0 auto;border:1px solid #e2e8f0;border-radius:19px;padding:15px;background:#fff;box-shadow:0 14px 28px rgba(15,23,42,.06)}
    .prompt{border-radius:15px;padding:11px 13px;background:#fff7ed;color:var(--orange-800);font-size:clamp(16px,2.6vw,25px);font-weight:900;line-height:1.35}.prompt-sub{margin-top:6px;color:#64748b;font-size:12px;font-style:italic}
    .options{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}.option-btn{border:2px solid var(--orange-200);border-radius:16px;background:#fff;padding:12px 20px;color:#334155;font-size:20px;font-weight:900;line-height:1.2;transition:.15s;min-width:86px;box-shadow:0 6px 14px rgba(148,101,0,.08)}.option-btn:hover{transform:translateY(-2px);background:#fff7ed}.option-btn.correct{background:#10b981;color:#fff;border-color:#10b981}.option-btn.wrong{background:#ef4444;color:#fff;border-color:#ef4444}
    .input-row{display:flex;align-items:center;gap:8px;margin-top:12px;border:2px solid var(--orange-300);border-radius:15px;background:#fff;padding:6px 7px;box-shadow:0 0 12px rgba(251,146,60,.20)}.text-input{flex:1;min-width:0;border:0;outline:0;padding:8px 9px;font-size:15px;font-weight:800;color:#1e293b}.submit-btn{width:42px;height:42px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--orange-500),var(--orange-700));color:#fff}.result{min-height:37px;margin-top:9px;border-radius:12px;padding:8px 10px;font-size:12px;font-weight:900}.result.ok{background:#d1fae5;color:#047857}.result.bad{background:#fee2e2;color:#b91c1c}.next-btn{display:none;margin:10px auto 0;border:0;border-radius:999px;padding:9px 18px;background:linear-gradient(135deg,var(--orange-500),var(--orange-700));color:#fff;font-size:12px;font-weight:900}.next-btn.show{display:block}
    .arrange-zone{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px;min-height:96px;padding:18px 16px;border:3px dashed #e7b75d;border-radius:20px;background:#fffaf0}.piece{border:2px solid #cf9300;border-radius:16px;padding:14px 22px;background:linear-gradient(180deg,#efb61a 0%,#b87400 100%);color:#ffffff;font-size:22px;font-weight:900;line-height:1.15;text-shadow:0 1px 1px rgba(0,0,0,.18);box-shadow:0 8px 18px rgba(148,101,0,.14);transition:transform .15s ease,box-shadow .15s ease,background .15s ease,border-color .15s ease}.piece:hover{transform:translateY(-1px);box-shadow:0 10px 20px rgba(148,101,0,.18);background:linear-gradient(180deg,#f3c53f 0%,#c17c00 100%);border-color:#b97d00}.piece.used{opacity:.20;pointer-events:none}.selected-piece{border:2px solid #cf9300;border-radius:16px;padding:14px 22px;background:linear-gradient(180deg,#f2c239 0%,#c17b00 100%);color:#ffffff;font-size:22px;font-weight:900;line-height:1.15;text-shadow:0 1px 1px rgba(0,0,0,.18);box-shadow:0 8px 18px rgba(165,108,5,.18)}.arrange-pool{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:16px}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:16px}
    .match-toolbar{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-bottom:9px}.match-mode{border:1px solid var(--orange-200);border-radius:999px;padding:7px 11px;background:#fff;color:#64748b;font-size:11px;font-weight:900}.match-mode.active{background:var(--orange-600);color:#fff;border-color:var(--orange-600)}.match-board{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:900px;margin:0 auto}.match-column{display:grid;gap:7px}.match-card{position:relative;min-height:50px;border:2px solid transparent;border-radius:14px;background:linear-gradient(135deg,#fff7ed,#fff);padding:9px 11px;color:#334155;font-size:13px;font-weight:900;transition:.15s}.match-card:hover{transform:scale(1.02);border-color:var(--orange-300)}.match-card.selected{border-color:var(--orange-600);box-shadow:0 0 0 4px rgba(249,115,22,.13)}.match-card.matched{background:#10b981;color:#fff;opacity:.58;pointer-events:none}.match-card.wrong{background:#ef4444;color:#fff}.match-status{text-align:center;margin-top:9px;border-radius:12px;padding:8px;background:#f8fafc;color:#64748b;font-size:11px;font-weight:900}
    .quiz-card{max-width:900px;margin:0 auto;padding:15px}.quiz-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.quiz-stats{display:flex;gap:7px}.quiz-pill{border-radius:999px;padding:7px 10px;background:#fff7ed;color:var(--orange-800);font-size:11px;font-weight:900}.quiz-question{font-size:20px;font-weight:900;color:#334155;margin-bottom:11px}.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quiz-option{border:1px solid var(--orange-200);border-radius:14px;background:#fff;padding:10px 12px;text-align:left;font-size:13px;font-weight:900;color:#475569}.quiz-option:hover{background:#fff7ed}.quiz-option.correct{background:#10b981;color:#fff}.quiz-option.wrong{background:#ef4444;color:#fff}

    /* ===== HSK 3: pháo hoa cánh quạt vàng, vòng sáng và lời chúc nổi ===== */
    .hsk3-firework{
      position:fixed;
      width:1px;
      height:1px;
      pointer-events:none;
      z-index:100000;
    }
    .hsk3-firework-ring{
      position:absolute;
      left:0;
      top:0;
      width:18px;
      height:18px;
      border:3px solid currentColor;
      border-radius:999px;
      opacity:0;
      transform:translate(-50%,-50%) scale(.15);
      box-shadow:0 0 18px currentColor;
      animation:hsk3FireworkRing 1.12s ease-out forwards;
    }
    .hsk3-firework-spark{
      position:absolute;
      left:-3px;
      top:-9px;
      width:6px;
      height:18px;
      border-radius:999px 999px 45% 45%;
      background:linear-gradient(to bottom,#fff 0 20%,currentColor 42% 100%);
      color:inherit;
      opacity:0;
      transform-origin:50% 9px;
      filter:drop-shadow(0 0 7px currentColor);
      animation:hsk3FireworkSpark 1.22s cubic-bezier(.16,.72,.24,1) forwards;
    }
    .hsk3-firework-star{
      position:absolute;
      left:0;
      top:0;
      color:inherit;
      font-size:16px;
      line-height:1;
      opacity:0;
      text-shadow:0 0 9px currentColor;
      animation:hsk3FireworkStar 1.35s ease-out forwards;
    }
    .hsk3-cheer{
      position:fixed;
      left:50%;
      top:27%;
      z-index:100001;
      pointer-events:none;
      transform:translate(-50%,-50%) scale(.65);
      border:2px solid rgba(255,255,255,.92);
      border-radius:999px;
      padding:9px 19px;
      color:#fff;
      background:linear-gradient(135deg,#d99a00,#8f5b00);
      box-shadow:0 14px 35px rgba(101,61,0,.25),inset 0 1px rgba(255,255,255,.55);
      font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;
      font-size:18px;
      font-weight:900;
      letter-spacing:.05em;
      opacity:0;
      animation:hsk3Cheer 1.45s ease-out forwards;
    }
    @keyframes hsk3FireworkRing{
      0%{opacity:.95;transform:translate(-50%,-50%) scale(.15)}
      65%{opacity:.65}
      100%{opacity:0;transform:translate(-50%,-50%) scale(8.5)}
    }
    @keyframes hsk3FireworkSpark{
      0%{opacity:0;transform:rotate(var(--angle)) translateY(0) scaleY(.2)}
      16%{opacity:1}
      72%{opacity:1;transform:rotate(var(--angle)) translateY(var(--distance)) scaleY(1)}
      100%{opacity:0;transform:rotate(var(--angle)) translateY(calc(var(--distance) + 24px)) scale(.25)}
    }
    @keyframes hsk3FireworkStar{
      0%{opacity:0;transform:translate(-50%,-50%) scale(.15) rotate(0)}
      24%{opacity:1}
      78%{opacity:1;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.15) rotate(170deg)}
      100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy) + 20px)) scale(.35) rotate(230deg)}
    }
    @keyframes hsk3Cheer{
      0%{opacity:0;transform:translate(-50%,-50%) scale(.65)}
      18%,70%{opacity:1;transform:translate(-50%,-50%) scale(1)}
      100%{opacity:0;transform:translate(-50%,-76%) scale(.92)}
    }

function mascot(className = "tiny-mascot", pose = "default") {
  const src = MASCOT_POSES[pose] || MASCOT_POSES.default;
  return `<img class="mascot-img ${className}" data-pose="${pose}" src="${src}" alt="啾啾 - linh vật HSK 3">`;
}

function highlightWords(text, words = LESSON.extraVocabulary) {
  let safe = escapeHTML(text);
  [...words]
    .sort((a, b) => b.han.length - a.han.length)
    .forEach((w) => {
      const tip = `${w.han}|${w.py}|${w.vi}`;
      safe = safe
        .split(w.han)
        .join(
          `<button type="button" class="extra-word inline-vocab cn" data-word-tip="${escapeHTML(tip)}" aria-label="Xem nghĩa của ${escapeHTML(w.han)}">${w.han}</button>`,
        );
    });
  return safe;
}

function highlightExtras(text) {
  return highlightWords(text, LESSON.extraVocabulary);
}

function bindInlineVocabulary(root = document) {
  root.querySelectorAll("[data-word-tip]").forEach((word) => {
    word.onclick = (event) => {
      event.preventDefault();
      event.stopPropagation();
      const [han, py, vi] = String(word.dataset.wordTip || "").split("|");
      document.getElementById("inlineWordPopover")?.remove();
      const popover = document.createElement("div");
      popover.id = "inlineWordPopover";
      popover.className = "inline-word-popover";
      popover.innerHTML = `<button class="inline-word-close" aria-label="Đóng">×</button><div class="cn inline-word-han">${escapeHTML(han)}</div><div class="inline-word-py">${escapeHTML(py)}</div><div class="inline-word-vi">${escapeHTML(vi)}</div><button class="inline-word-audio">🔊 Nghe từ</button>`;
      document.body.appendChild(popover);
      popover.querySelector(".inline-word-close").onclick = () => popover.remove();
      popover.querySelector(".inline-word-audio").onclick = () => speak(han, 0.72);
    };
    word.onkeydown = (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        word.click();
      }
    };
  });
}

function motivationHTML(index = 0) {
  const m = MOTIVATIONS[index % MOTIVATIONS.length];
  const poses = ["cheer", "teacher", "speaking", "cheer"];
  return `<div class="motivation-card">${mascot("tiny-mascot", poses[index % poses.length])}<div><div class="cn">${m.han}</div><p>${m.vi}</p></div></div>`;
}

  const u=new SpeechSynthesisUtterance(String(text));u.lang="zh-CN";u.rate=rate;u.pitch=1;
  const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>/^zh-CN$/i.test(v.lang))||voices.find(v=>/^zh/i.test(v.lang))||null;

function cleanZh(s){return String(s||"").replace(/[\s，。！？,.!?、；;：“”"'（）()]/g,"").toLowerCase()}

function confetti(){const colors=["#f97316","#fb923c","#f59e0b","#0f766e","#fdba74"];for(let i=0;i<60;i++){const e=document.createElement("div");e.className="confetti";e.style.left=Math.random()*100+"vw";e.style.background=colors[i%colors.length];e.style.animationDelay=Math.random()*.5+"s";document.body.appendChild(e);setTimeout(()=>e.remove(),2800)}}
let feedbackAudioContext=null;
function playFeedbackSound(correct){
  if(!soundOn)return;
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtx)return;
  try{
    feedbackAudioContext=feedbackAudioContext||new AudioCtx();
    const ctx=feedbackAudioContext;
    if(ctx.state==='suspended')ctx.resume();
    const now=ctx.currentTime;

    /* HSK 3 dùng tiếng chuông ngũ cung và tiếng gõ gỗ, khác bộ âm của HSK 2. */
    const master=ctx.createGain();
    const compressor=ctx.createDynamicsCompressor();
    master.gain.setValueAtTime(.78,now);
    compressor.threshold.setValueAtTime(-20,now);
    compressor.knee.setValueAtTime(16,now);
    compressor.ratio.setValueAtTime(4,now);
    compressor.attack.setValueAtTime(.005,now);
    compressor.release.setValueAtTime(.22,now);
    master.connect(compressor);compressor.connect(ctx.destination);

    if(correct){
      [[587.33,0,.24],[880,.12,.28],[987.77,.25,.3],[1174.66,.42,.42]].forEach(([freq,delay,duration],index)=>{
        const osc=ctx.createOscillator(),shimmer=ctx.createOscillator(),gain=ctx.createGain(),shimmerGain=ctx.createGain();
        osc.type='triangle';
        osc.frequency.setValueAtTime(freq,now+delay);
        shimmer.type='sine';
        shimmer.frequency.setValueAtTime(freq*2,now+delay);
        gain.gain.setValueAtTime(.0001,now+delay);
        gain.gain.exponentialRampToValueAtTime(index===3?.36:.30,now+delay+.012);
        gain.gain.exponentialRampToValueAtTime(.0001,now+delay+duration);
        shimmerGain.gain.setValueAtTime(.0001,now+delay);
        shimmerGain.gain.exponentialRampToValueAtTime(.08,now+delay+.01);
        shimmerGain.gain.exponentialRampToValueAtTime(.0001,now+delay+duration*.72);
        osc.connect(gain);gain.connect(master);
        shimmer.connect(shimmerGain);shimmerGain.connect(master);
        osc.start(now+delay);shimmer.start(now+delay);
        osc.stop(now+delay+duration+.04);shimmer.stop(now+delay+duration+.04);
      });
    }else{
      [[392,349.23,0],[311.13,277.18,.16],[233.08,220,.32]].forEach(([startFreq,endFreq,delay],index)=>{
        const osc=ctx.createOscillator(),gain=ctx.createGain();
        osc.type=index===1?'square':'triangle';
        osc.frequency.setValueAtTime(startFreq,now+delay);
        osc.frequency.exponentialRampToValueAtTime(endFreq,now+delay+.13);
        gain.gain.setValueAtTime(.0001,now+delay);
        gain.gain.exponentialRampToValueAtTime(index===1?.11:.18,now+delay+.008);
        gain.gain.exponentialRampToValueAtTime(.0001,now+delay+.17);
        osc.connect(gain);gain.connect(master);osc.start(now+delay);osc.stop(now+delay+.19);
      });
    }
  }catch(_){/* Trình duyệt chặn Web Audio thì bỏ qua, không ảnh hưởng bài học */}
}
function fireworks(){
  const colors=['#f6c945','#d99a00','#fff1a6','#14b8a6','#38bdf8','#f472b6'];
  const centers=[
    [22+Math.random()*17,28+Math.random()*15],
    [62+Math.random()*19,22+Math.random()*16]
  ];
  centers.forEach((center,burst)=>{
    const shell=document.createElement('div');
    shell.className='hsk3-firework';
    shell.style.left=center[0]+'vw';
    shell.style.top=center[1]+'vh';
    const ring=document.createElement('span');
    ring.className='hsk3-firework-ring';
    ring.style.color=colors[burst%colors.length];
    ring.style.animationDelay=(burst*.13)+'s';
    shell.appendChild(ring);
    for(let i=0;i<18;i++){
      const spark=document.createElement('span');
      spark.className='hsk3-firework-spark';
      spark.style.color=colors[(i+burst*2)%colors.length];
      spark.style.setProperty('--angle',(i*20+(burst?10:0))+'deg');
      spark.style.setProperty('--distance',(58+Math.random()*76)+'px');
      spark.style.animationDelay=(burst*.13+Math.random()*.07)+'s';
      shell.appendChild(spark);
    }
    for(let i=0;i<8;i++){
      const angle=Math.PI*2*i/8+burst*.24;
      const distance=78+Math.random()*72;
      const star=document.createElement('span');
      star.className='hsk3-firework-star';
      star.textContent=i%2?'✦':'◆';
      star.style.color=colors[(i*2+burst)%colors.length];
      star.style.setProperty('--dx',Math.cos(angle)*distance+'px');
      star.style.setProperty('--dy',Math.sin(angle)*distance+'px');
      star.style.animationDelay=(burst*.13+.16+Math.random()*.06)+'s';
      shell.appendChild(star);
    }
    document.body.appendChild(shell);
    setTimeout(()=>shell.remove(),1750);
  });
  const cheer=document.createElement('div');
  cheer.className='hsk3-cheer cn';
  cheer.textContent='太棒了！';
  document.body.appendChild(cheer);
  setTimeout(()=>cheer.remove(),1650);
}

function levenshtein(a,b){const x=[...String(a)],y=[...String(b)],dp=Array(y.length+1).fill(0).map((_,j)=>j);for(let i=1;i<=x.length;i++){let prev=dp[0];dp[0]=i;for(let j=1;j<=y.length;j++){const tmp=dp[j];dp[j]=Math.min(dp[j]+1,dp[j-1]+1,prev+(x[i-1]===y[j-1]?0:1));prev=tmp}}return dp[y.length]}
function speechScore(expected,heard,confidence=0){const a=cleanZh(expected),b=cleanZh(heard);if(!a||!b)return 0;if(a===b)return 100;const sim=1-levenshtein(a,b)/Math.max(a.length,b.length);const contains=(a.includes(b)||b.includes(a))?0.82:0;return Math.max(0,Math.min(100,Math.round(Math.max(sim,contains)*92+Math.max(0,confidence)*8)))}
function stopRoleSession(silent = false) {
  const session = activeRoleSession;
  if (!session) return;
  if (!silent && typeof session.finalize === "function") {
    session.finalize();
    return;
  }
  activeRoleSession = null;
  session.finalized = true;
  try {
    session.recognition?.stop();
  } catch (_) {}
  try {
    if (session.recorder && session.recorder.state !== "inactive")
      session.recorder.stop();
  } catch (_) {}
  try {
    session.stream?.getTracks().forEach((track) => track.stop());
  } catch (_) {}
  const btn = document.querySelector(
    `[data-role-mic="${session.lineIndex}"]`,
  );
  if (btn) {
    btn.classList.remove("recording");
    btn.textContent = "Bắt đầu ghi âm";
  }
}

  }
  const instruction=state.vocabMode==="vi-zh"?"Xem tiếng Việt và viết chữ Hán":state.vocabMode==="zh-vi"?"Xem chữ Hán và nhập nghĩa tiếng Việt":state.vocabMode==="zh-zh"?"Nhìn chữ Hán rồi viết lại chính xác":"Nghe từ và nhập chữ Hán hoặc nghĩa tiếng Việt";
  const question=state.vocabMode==="vi-zh"?w.vi:w.han;
  return head+`<div class="vocab-study-body"><div class="vocab-study-card"><span class="vocab-study-pos">${w.pos}</span>${state.vocabMode==="listen"?`<button id="vocabListenOrb" class="vocab-listen-orb cn">听</button><p style="margin:14px 0 0;color:#64748b">${instruction}</p><button id="vocabSlow" class="vocab-main-btn" style="margin-top:10px;background:#334155">Nghe chậm</button>`:`<p style="margin:15px 0 4px;color:#94a3b8;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase">${instruction}</p><div class="${state.vocabMode==='vi-zh'?'vocab-study-vi':'vocab-study-han cn'}">${question}</div>`}<div class="vocab-input-wrap"><span class="vocab-input-tag">${state.vocabMode==='zh-vi'?'VN':'字'}</span><input id="vocabAnswerInput" class="vocab-answer-input" autocomplete="off" placeholder="${instruction}"><button id="vocabSubmit" class="vocab-submit">→</button></div><p class="vocab-mode-foot" style="margin-top:9px">Nhấn Enter để kiểm tra</p></div></div>`;

function bindVocab(){
  const w=()=>LESSON.vocabulary[state.vocabIndex%LESSON.vocabulary.length];
  const next=(delta=1)=>{state.vocabIndex=(state.vocabIndex+delta+LESSON.vocabulary.length)%LESSON.vocabulary.length;state.vocabFlipped=false;state.vocabFeedback=null;render()};
  document.querySelectorAll('[data-vocab-mode]').forEach(b=>b.onclick=()=>{state.vocabMode=b.dataset.vocabMode;state.vocabIndex=0;state.vocabFlipped=false;state.vocabFeedback=null;render()});
  document.querySelectorAll('[data-vocab-back],#vocabStudyBack,#vocabSwitchMode').forEach(b=>b.onclick=()=>{state.vocabMode=null;state.vocabFeedback=null;render()});
  if(!state.vocabMode)return;
  document.getElementById('vocabPrev')?.addEventListener('click',()=>next(-1));
  document.getElementById('vocabNext')?.addEventListener('click',()=>next(1));
  document.getElementById('vocabFlip')?.addEventListener('click',()=>{state.vocabFlipped=true;render();setTimeout(()=>speak(w().han),80)});
  document.getElementById('vocabSpeak')?.addEventListener('click',()=>speak(w().han));
  if(state.vocabMode==='flashcard'){
    setEnterAction(()=>{if(!state.vocabFlipped){state.vocabFlipped=true;render()}else next(1)});
    return;
  }
  if(state.vocabFeedback){
    const btn=document.getElementById('vocabFeedbackNext');btn.onclick=()=>next(1);btn.focus();setEnterAction(()=>next(1));
    return;
  }
  const input=document.getElementById('vocabAnswerInput');
  let composing=false;
  const correct=(value)=>{const mode=state.vocabMode,item=w(),v=String(value||'').trim();if(mode==='vi-zh'||mode==='zh-zh')return cleanZh(v)===cleanZh(item.han);const meanings=item.vi.split(/[;,/]|hoặc/gi).map(cleanVi).filter(Boolean),user=cleanVi(v);const meaningOk=meanings.some(x=>x===user||x.includes(user)||user.includes(x));return mode==='zh-vi'?meaningOk:(cleanZh(v)===cleanZh(item.han)||meaningOk)};
  const submit=()=>{if(composing||!input?.value.trim())return;const value=input.value.trim(),ok=correct(value);state.vocabFeedback={value,correct:ok};if(ok)addScore(10);answerFeedback(ok);render()};
  input?.addEventListener('compositionstart',()=>composing=true);input?.addEventListener('compositionend',()=>composing=false);input?.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&!composing&&e.keyCode!==229){e.preventDefault();submit()}});document.getElementById('vocabSubmit').onclick=submit;input?.focus();
  document.getElementById('vocabListenOrb')?.addEventListener('click',()=>speak(w().han));document.getElementById('vocabSlow')?.addEventListener('click',()=>speak(w().han,.58));if(state.vocabMode==='listen')setTimeout(()=>speak(w().han),250);
}

function exerciseShell(type,text,total,motivationIndex=0){const m=MOTIVATIONS[motivationIndex%MOTIVATIONS.length];return `<div class="panel exercise-shell"><div class="exercise-head"><div class="pet-box"><span class="pet-icon">${mascot("tiny-mascot")}</span><span class="pet-text" id="${type}Pet"><span class="cn">${m.han}</span><br>${text}</span></div><div class="progress"><div id="${type}Progress" style="width:${progress(state[type]||0,total)}%"></div></div><div class="counter" id="${type}Counter">Câu ${(state[type]||0)+1}/${total}</div></div><div class="exercise-stage" id="${type}Stage"></div></div>`}

let arrangeSelected=[];
function renderArrange(){
  const i=state.arrange,q=LESSON.arrange[i],stage=document.getElementById('arrangeStage');arrangeSelected=[];setEnterAction(null);

  document.querySelectorAll('[data-piece-id]').forEach(b=>b.onclick=()=>{if(b.classList.contains('used'))return;b.classList.add('used');arrangeSelected.push({text:b.dataset.piece,id:b.dataset.pieceId});draw()});
  const goNext=()=>nextExercise('arrange',LESSON.arrange.length,renderArrange);
  const check=()=>{const value=arrangeSelected.map(x=>x.text).join(''),ok=cleanZh(value)===cleanZh(q.answer),r=document.getElementById('arrangeResult');r.className='result '+(ok?'ok':'bad');r.innerHTML=ok?'Trật tự chính xác!':`Câu đúng: <b class="cn">${q.answer}。</b>`;if(ok){addScore(12);answerFeedback(true);setTimeout(()=>speak(q.answer),430)}else answerFeedback(false);const next=document.getElementById('arrangeNext');next.classList.add('show');next.onclick=goNext;next.focus();setEnterAction(goNext)};
  document.getElementById('arrangeReset').onclick=()=>{arrangeSelected=[];document.querySelectorAll('[data-piece-id]').forEach(b=>b.classList.remove('used'));draw();document.getElementById('arrangeResult').className='result';document.getElementById('arrangeResult').textContent='';document.getElementById('arrangeNext').classList.remove('show');setEnterAction(check)};
  document.getElementById('arrangeCheck').onclick=check;setEnterAction(check);
}

t=null;document.getElementById('matchCount').textContent=`${state.matched.size}/${data.length} cặp`;if(state.matched.size===data.length){confetti();document.getElementById('matchStatus').textContent='Hoàn thành toàn bộ cặp nối!'}}}})}

function initYouTubePlayer(){
  const el=document.getElementById('youtubePlayer');
  if(!el||!window.YT?.Player)return;
  try{ytPlayer?.destroy?.()}catch(_){}
  try{
    ytPlayer=new YT.Player(el,{events:{onReady:()=>{},onStateChange:()=>{}}});

function videoTime(delta){
  if(!ytPlayer?.getCurrentTime)return;
  const now=Number(ytPlayer.getCurrentTime())||0;
  ytPlayer.seekTo(Math.max(0,now+delta),true);
}
function playVideoSegment(start,end,onEnd){
  if(!ytPlayer?.seekTo)return false;
  clearInterval(ytStopTimer);
  if(Number.isFinite(start))ytPlayer.seekTo(Math.max(0,start),true);
  ytPlayer.playVideo?.();
  if(Number.isFinite(end)&&end>start){
    ytStopTimer=setInterval(()=>{
      if((ytPlayer.getCurrentTime?.()||0)>=end){
        ytPlayer.pauseVideo?.();clearInterval(ytStopTimer);ytStopTimer=null;
        if(typeof onEnd==='function')onEnd();
      }
    },100);
  }
  return true;
}


function vttTimeToSeconds(value){
  const parts=String(value||'').trim().split(':').map(Number);
  if(parts.some(Number.isNaN))return 0;
  if(parts.length===3)return parts[0]*3600+parts[1]*60+parts[2];
  if(parts.length===2)return parts[0]*60+parts[1];
  return parts[0]||0;
}
function parseListeningVTT(text){
  const blocks=String(text||'').replace(/^\uFEFF/,'').replace(/\r/g,'').trim().split(/\n{2,}/);
  const cues=[];
  for(const block of blocks){
    const lines=block.split('\n').map(x=>x.trimEnd());
    if(!lines.length||lines[0].trim().startsWith('WEBVTT')||lines[0].trim().startsWith('NOTE'))continue;
    const timingIndex=lines.findIndex(x=>x.includes('-->'));
    if(timingIndex<0)continue;
    const timing=lines[timingIndex].split(/\s+-->\s+/);
    if(timing.length!==2)continue;
    const content=lines.slice(timingIndex+1).map(x=>x.trim()).filter(Boolean);
    if(!content.length)continue;
    cues.push({
      start:vttTimeToSeconds(timing[0]),
      end:vttTimeToSeconds(timing[1].split(/\s+/)[0]),
      han:content[0]||'',py:content[1]||'',vi:content.slice(2).join(' ')||''
    });
  }
  return cues.sort((a,b)=>a.start-b.start);
}
async function loadListeningCues(){
  for(const path of LISTENING_VTT_PATHS){
    try{
      const response=await fetch(path,{cache:'no-store'});
      if(!response.ok)continue;
      const cues=parseListeningVTT(await response.text());
      if(cues.length)return {cues,path,fallback:false};
    }catch(_){/* Thử đường dẫn tiếp theo. */}
  }
  return {cues:LISTENING_FALLBACK_CUES.map(x=>({...x})),path:'Dữ liệu dự phòng',fallback:true};
}
function formatListeningTime(seconds){
  const total=Math.max(0,Number(seconds)||0),minutes=Math.floor(total/60),secs=Math.floor(total%60);
  return `${String(minutes).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
}
function currentListeningCue(){return listeningCues[listeningIndex]||null}
function setListeningIndex(index,render=true){
  if(!listeningCues.length)return;
  if(activeRoleSession)stopRoleSession(true);
  listeningIndex=Math.max(0,Math.min(listeningCues.length-1,Number(index)||0));
  listeningRepeatToken++;
  if(render)renderListeningMode();
}
function playListeningCue(index=listeningIndex,rate=1,onEnd){
  const cue=listeningCues[index];if(!cue)return;
  listeningIndex=index;
  ytPlayer?.setPlaybackRate?.(rate);
  const ok=playVideoSegment(cue.start,Math.max(cue.start+.25,cue.end-.03),onEnd);
  if(!ok){const status=document.getElementById('listeningSourceStatus');if(status){status.classList.add('error');status.textContent='';}}
}
function repeatListeningCue(index,count=3,rate=.85){
  const token=++listeningRepeatToken;let remaining=Math.max(1,count);
  const run=()=>{if(token!==listeningRepeatToken||remaining<=0)return;remaining--;playListeningCue(index,rate,()=>{if(token===listeningRepeatToken&&remaining>0)setTimeout(run,900);});};
  run();
}

function bindListeningModeActions(){
  document.querySelectorAll('[data-listening-mode]').forEach(button=>button.onclick=()=>{stopRoleSession?.(true);listeningMode=button.dataset.listeningMode;listeningRepeatToken++;renderListeningMode();});
  document.querySelectorAll('[data-listening-toggle]').forEach(button=>button.onclick=()=>{if(button.dataset.listeningToggle==='pinyin')listeningPinyin=!listeningPinyin;else listeningMeaning=!listeningMeaning;renderListeningMode();});
  document.querySelectorAll('[data-listening-index]').forEach(button=>button.onclick=()=>{setListeningIndex(Number(button.dataset.listeningIndex));playListeningCue(listeningIndex,1);});
  document.querySelector('[data-listening-full]')?.addEventListener('click',()=>{listeningRepeatToken++;ytPlayer?.setPlaybackRate?.(1);ytPlayer?.playVideo?.();});
  document.querySelectorAll('[data-listening-play]').forEach(button=>button.onclick=()=>playListeningCue(listeningIndex,1));
  document.querySelectorAll('[data-listening-slow]').forEach(button=>button.onclick=()=>playListeningCue(listeningIndex,.75));
  document.querySelectorAll('[data-listening-nav]').forEach(button=>button.onclick=()=>setListeningIndex(listeningIndex+Number(button.dataset.listeningNav)));
  document.querySelectorAll('[data-shadow-repeat]').forEach(button=>button.onclick=()=>repeatListeningCue(listeningIndex,Number(button.dataset.shadowRepeat)||3,.85));
  document.querySelectorAll('[data-role-mic]').forEach(button=>button.onclick=()=>{const idx=Number(button.dataset.roleMic);if(activeRoleSession?.lineIndex===idx){stopRoleSession();return;}startRoleRecording(idx,button.dataset.expected);});
  document.querySelectorAll('[data-role-play]').forEach(button=>button.onclick=()=>{const url=roleRecordings.get(`0-${button.dataset.rolePlay}`);if(url)new Audio(url).play().catch(()=>{});});
  const input=document.getElementById('vttDictationInput');
  input?.addEventListener('input',()=>{
    listeningDictationAnswers.set(listeningIndex,input.value);
    if(listeningDictationCheckedValue.get(listeningIndex)!==input.value){
      listeningDictationStatus.delete(listeningIndex);
    }
  });
  const check=()=>{
    const cue=currentListeningCue(),value=String(input?.value||'').trim(),result=document.getElementById('vttDictationResult');
    if(!value){result.className='dictation-vtt-result bad';result.textContent='Hãy nghe và nhập câu trước khi kiểm tra.';input?.focus();return false;}
    const ok=cleanZh(value)===cleanZh(cue.han);
    const message=ok?'✓ Chính xác! Bạn đã chép đúng câu.':`Chưa khớp. Đáp án đúng: ${cue.han}`;
    listeningDictationStatus.set(listeningIndex,message);
    listeningDictationCheckedValue.set(listeningIndex,input.value);
    result.className=`dictation-vtt-result ${ok?'ok':'bad'}`;result.innerHTML=ok?'✓ Chính xác! Bạn đã chép đúng câu.':`Chưa khớp. Đáp án đúng: <b class="cn">${escapeHTML(cue.han)}</b>`;
    if(ok&&!listeningDictationAwarded.has(listeningIndex)){listeningDictationAwarded.add(listeningIndex);addScore(5);}answerFeedback(ok);
    return true;
  };
  document.querySelector('[data-vtt-check]')?.addEventListener('click',check);
  input?.addEventListener('keydown',event=>{
    if(event.key==='Enter'&&!event.isComposing&&event.keyCode!==229){
      event.preventDefault();
      const currentValue=String(input.value||'');
      const checkedValue=listeningDictationCheckedValue.get(listeningIndex);
      const hasChecked=listeningDictationStatus.has(listeningIndex) && checkedValue===currentValue;
      if(hasChecked && listeningIndex<listeningCues.length-1){
        setListeningIndex(listeningIndex+1);
        return;
      }
      check();
    }
  });
  document.querySelector('[data-vtt-hint]')?.addEventListener('click',()=>document.getElementById('vttDictationHint')?.classList.toggle('show'));
  document.querySelector('[data-vtt-reveal]')?.addEventListener('click',()=>{const cue=currentListeningCue(),result=document.getElementById('vttDictationResult');result.className='dictation-vtt-result';result.innerHTML=`Đáp án: <b class="cn">${escapeHTML(cue.han)}</b>`;});
}
function syncListeningSubtitle(){
  if(currentTab!=='speaking'||listeningMode!=='subtitle'||!listeningCues.length||!ytPlayer?.getCurrentTime)return;
  const time=Number(ytPlayer.getCurrentTime())||0;
  const index=listeningCues.findIndex(cue=>time>=cue.start&&time<cue.end);
  if(index<0||index===listeningIndex)return;
  listeningIndex=index;
  document.querySelectorAll('[data-listening-index]').forEach((row,i)=>row.classList.toggle('active',i===index));
  const cue=listeningCues[index],now=document.getElementById('listeningNow');
  if(now)now.innerHTML=`${cueTextHTML(cue,'now-playing')}`;
  const list=document.getElementById('vttTranscriptList');
  const activeRow=document.querySelector(`[data-listening-index="${index}"]`);
  if(list&&activeRow){
    const rowTop=activeRow.offsetTop;
    const rowBottom=rowTop+activeRow.offsetHeight;
    const viewTop=list.scrollTop;
    const viewBottom=viewTop+list.clientHeight;
    if(rowTop<viewTop+8){
      list.scrollTo({top:Math.max(0,rowTop-8),behavior:'smooth'});
    }else if(rowBottom>viewBottom-8){
      list.scrollTo({top:rowBottom-list.clientHeight+8,behavior:'smooth'});
    }
  }
}

async function bindSpeaking() {
  loadYouTubeAPI();
  clearInterval(listeningSyncTimer);listeningSyncTimer=null;
  listeningRepeatToken++;
  document.querySelectorAll('[data-video-action]').forEach(b=>b.onclick=()=>{
    const action=b.dataset.videoAction;
    if(action==='back')videoTime(-5);
    if(action==='forward')videoTime(5);
    if(action==='toggle'){
      const playing=ytPlayer?.getPlayerState?.()===1;
      playing?ytPlayer.pauseVideo?.():ytPlayer.playVideo?.();
    }
  });
  document.querySelectorAll('[data-video-rate]').forEach(b=>b.onclick=()=>{
    const rate=Number(b.dataset.videoRate);ytPlayer?.setPlaybackRate?.(rate);
    document.querySelectorAll('[data-video-rate]').forEach(x=>x.classList.toggle('active',x===b));
  });

  const loaded=await loadListeningCues();
  if(currentTab!=='speaking'||!document.getElementById('listeningStage'))return;
  listeningCues=loaded.cues;
  listeningIndex=Math.min(listeningIndex,Math.max(0,listeningCues.length-1));
  const status=document.getElementById('listeningSourceStatus');
  if(status){
    status.className=`listening-source-status ${loaded.fallback?'fallback':''}`;
    status.innerHTML='';
  }
  renderListeningMode();
  listeningSyncTimer=setInterval(syncListeningSubtitle,140);
}

async function startRoleRecording(lineIndex, expected) {
  stopRoleSession(true);
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const out = document.getElementById(`speechResult-${lineIndex}`);
  const btn = document.querySelector(`[data-role-mic="${lineIndex}"]`);
  if (!SR || !navigator.mediaDevices?.getUserMedia) {
    out.className = "speech-result low";
    out.textContent =
      "Trình duyệt chưa hỗ trợ ghi âm và chấm giọng. Hãy mở trang bằng Chrome hoặc Edge trên HTTPS.";
    return;
  }

  let stream;
  let recorder = null;
  const chunks = [];
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    if (window.MediaRecorder) {
      recorder = new MediaRecorder(stream);
      recorder.ondataavailable = (event) => {
        if (event.data?.size) chunks.push(event.data);
      };
      recorder.onstop = () => {
        if (!chunks.length) return;
        const recordingKey = `${state.scenario}-${lineIndex}`;
        const old = roleRecordings.get(recordingKey);
        if (old) URL.revokeObjectURL(old);
        const url = URL.createObjectURL(
          new Blob(chunks, { type: recorder.mimeType || "audio/webm" }),
        );
        roleRecordings.set(recordingKey, url);
        const play = document.querySelector(
          `[data-role-play="${lineIndex}"]`,
        );
        if (play) play.disabled = false;
      };
      recorder.start();
    }
  } catch (_) {
    out.className = "speech-result low";
    out.textContent =
      "Micro chưa được cấp quyền. Hãy cho phép Micro trong trình duyệt rồi thử lại.";
    return;
  }

  const session = {
    lineIndex,
    expected,
    recognition: null,
    recorder,
    stream,
    chunks,
    transcript: "",
    currentTranscript: "",
    confidenceTotal: 0,
    confidenceCount: 0,
    finalized: false,
    finalize: null,
  };
  activeRoleSession = session;
  btn.classList.add("recording");
  btn.textContent = "Dừng & chấm điểm";
  out.className = "speech-result";
  out.textContent =
    "Đang ghi âm liên tục... Hãy đọc hết đoạn; chỉ dừng khi bạn bấm “Dừng & chấm điểm”.";

  const heardText = () =>
    `${session.transcript}${session.currentTranscript}`.trim();

  const finish = () => {
    if (activeRoleSession === session) activeRoleSession = null;
    try {
      session.recognition?.stop();
    } catch (_) {}
    try {
      if (recorder && recorder.state !== "inactive") recorder.stop();
    } catch (_) {}
    setTimeout(() => {
      try {
        stream?.getTracks().forEach((track) => track.stop());
      } catch (_) {}
    }, 120);
    btn.classList.remove("recording");
    btn.textContent = "Bắt đầu ghi âm";
  };

  const grade = () => {
    if (session.finalized) return;
    session.finalized = true;
    const heard = heardText();
    if (!heard) {
      out.className = "speech-result mid";
      out.textContent =
        "Chưa nhận được lời nói rõ ràng. Bản ghi vẫn được lưu; hãy thử lại ở nơi yên tĩnh hơn.";
      finish();
      return;
    }
    const confidence = session.confidenceCount
      ? session.confidenceTotal / session.confidenceCount
      : 0;
    const result = speechScore(expected, heard, confidence);
    const recordingKey = `${state.scenario}-${lineIndex}`;
    const old = state.roleScores[recordingKey] || 0;
    state.roleScores[recordingKey] = Math.max(old, result);
    if (result > old) addScore(Math.max(1, Math.round((result - old) / 10)));
    const scoreEl = document.getElementById(`speechScore-${lineIndex}`);
    scoreEl.textContent = `${result} điểm`;
    scoreEl.className = `speech-score ${result >= 80 ? "good" : result >= 60 ? "mid" : "low"}`;
    out.className = `speech-result ${result >= 80 ? "good" : result >= 60 ? "mid" : "low"}`;
    out.innerHTML =
      result >= 90
        ? `Rất tốt! Bạn đã đọc liền mạch cả đoạn. Máy nghe được: <b class="cn">${escapeHTML(heard)}</b>`
        : result >= 70
          ? `Khá tốt (${result}/100). Máy nghe được: <b class="cn">${escapeHTML(heard)}</b>. Hãy nghe chậm và chỉnh thêm thanh điệu.`
          : `Điểm ${result}/100. Máy nghe được: <b class="cn">${escapeHTML(heard)}</b>. Hãy chia đoạn thành cụm ngắn rồi đọc liền lại.`;
    playFeedbackSound(result >= 70);
    if (result >= 80) fireworks();
    finish();
  };
  session.finalize = grade;

  const launchRecognition = () => {
    if (
      session.finalized ||
      activeRoleSession !== session ||
      !stream?.active
    )
      return;
    const recognition = new SR();
    session.recognition = recognition;
    recognition.lang = "zh-CN";
    recognition.interimResults = true;
    recognition.maxAlternatives = 3;
    recognition.continuous = true;
    session.currentTranscript = "";
    recognition.onresult = (event) => {
      const parts = [];
      for (let i = 0; i < event.results.length; i++) {
        const alt = event.results[i][0];
        if (!alt) continue;
        parts.push(alt.transcript);
        if (alt.confidence) {
          session.confidenceTotal += alt.confidence;
          session.confidenceCount += 1;
        }
      }
      session.currentTranscript = parts.join("");
      const live = heardText();
      if (live) {
        out.className = "speech-result";
        out.innerHTML = `Đang nghe: <b class="cn">${escapeHTML(live)}</b><br>Hệ thống vẫn ghi âm; đọc xong hãy tự bấm “Dừng & chấm điểm”.`;
      }
    };
    recognition.onerror = (event) => {
      if (session.finalized) return;
      if (event.error === "not-allowed" || event.error === "service-not-allowed") {
        session.finalized = true;
        out.className = "speech-result low";
        out.textContent =
          "Trình duyệt chưa được phép nhận dạng giọng nói. Hãy kiểm tra quyền Micro rồi thử lại.";
        finish();
      } else if (event.error !== "no-speech" && event.error !== "aborted") {
        out.className = "speech-result mid";
        out.textContent =
          "Nhận dạng vừa bị ngắt, nhưng bản ghi vẫn đang tiếp tục. Hệ thống sẽ tự nối lại; bạn cứ đọc tiếp.";
      }
    };
    recognition.onend = () => {
      if (session.finalized || activeRoleSession !== session) return;
      if (session.currentTranscript.trim()) {
        session.transcript += session.currentTranscript;
        session.currentTranscript = "";
      }
      setTimeout(launchRecognition, 160);
    };
    try {
      recognition.start();
    } catch (_) {
      setTimeout(launchRecognition, 260);
    }
  };

  launchRecognition();
}

function bindCommon(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{stopRoleSession(true);currentTab=b.dataset.tab;renderTabs();render()});
  document.querySelectorAll('[data-mini]').forEach(b=>b.onclick=()=>{const id=b.dataset.mini;document.querySelectorAll('[data-mini]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('[data-subpage]').forEach(x=>x.classList.toggle('active',x.dataset.subpage===id))});
  document.querySelector('[data-pinyin-toggle]')?.addEventListener('click',e=>{const area=document.getElementById('readingArea'),hidden=area.classList.toggle('pinyin-hidden');e.currentTarget.classList.toggle('active',!hidden);e.currentTarget.textContent=hidden?'Hiện Pinyin':'Ẩn Pinyin'});
  document.querySelector('[data-meaning-toggle]')?.addEventListener('click',e=>{const area=document.getElementById('readingArea'),hidden=area.classList.toggle('meaning-hidden');e.currentTarget.classList.toggle('active',!hidden);e.currentTarget.textContent=hidden?'Hiện nghĩa':'Ẩn nghĩa'});
  bindSpeak();
  document.querySelectorAll('[data-char-index]').forEach(b=>b.onclick=()=>{const index=Number(b.dataset.charIndex);currentWriting=index;speak(WRITING_WORDS[index].han,.72);render()});
}

function bindSpeak() {
  document.querySelectorAll("[data-speak]").forEach((element) => {
    element.onclick = (event) => {
      if (event.currentTarget.id === "roleDone") return;
      if (event.target.closest?.("[data-word-tip]")) return;
      speak(
        element.dataset.speak,
        Number(element.dataset.speakRate) || 0.88,
      );
    };
    if (element.getAttribute("role") === "button") {
      element.onkeydown = (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          element.click();
        }
      };
    }
  });
  bindInlineVocabulary(document);
}

function initWriter(){const item=WRITING_WORDS[currentWriting];const board=document.getElementById('writerBoard');if(!board)return;board.innerHTML='';if(window.HanziWriter){writer=HanziWriter.create('writerBoard',item.han,{width:board.clientWidth||300,height:board.clientHeight||300,padding:18,showOutline:true,strokeAnimationSpeed:1,delayBetweenStrokes:250,strokeColor:'#9b6200',radicalColor:'#0f766e',outlineColor:'#f8dc82'});document.getElementById('animateWriter').onclick=()=>writer.animateCharacter();document.getElementById('quizWriter').onclick=()=>writer.quiz({showHintAfterMisses:2,highlightOnComplete:true,onComplete:()=>{addScore(15);answerFeedback(true)}});document.getElementById('resetWriter').onclick=()=>{writer.cancelQuiz();writer.showCharacter({duration:0})}}else{board.innerHTML=`<div class="cn" style="font-size:180px;text-align:center;color:var(--orange-700);line-height:300px">${item.han}</div>`}}

document.addEventListener('keydown',e=>{
  if(e.defaultPrevented||e.isComposing||e.keyCode===229)return;
  const tag=document.activeElement?.tagName;
  if(currentTab==='vocab'&&state.vocabMode==='flashcard'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();state.vocabIndex=(state.vocabIndex+(e.key==='ArrowRight'?1:-1)+LESSON.vocabulary.length)%LESSON.vocabulary.length;state.vocabFlipped=false;state.vocabFeedback=null;render();return}
  if(e.key!=='Enter'||!enterAction)return;
  if(tag==='TEXTAREA'||(tag==='INPUT'&&!document.activeElement.disabled))return;
  e.preventDefault();const action=enterAction;setEnterAction(null);action();
});

renderTabs();render();
document.getElementById('soundToggle').onclick=()=>{soundOn=!soundOn;document.getElementById('soundToggle').textContent=soundOn?'音':'静'};
</script>
