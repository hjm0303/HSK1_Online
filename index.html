<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HSK Standard Course • 课程平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    :root {
      --brand: #47b89f;
      --brand-2: #79d4bd;
      --ink: #2d4052;
      --muted: #718494;
      --line: #dfece7;
      --surface: rgba(255, 255, 255, .91);
      --shadow: 0 20px 55px rgba(74, 119, 106, .12);
      --mint-50: #f1fcf7;
      --mint-100: #dcf7ec;
      --peach-50: #fff4ef;
      --peach-100: #ffe3d9;
      --yellow-50: #fffbe7;
      --lavender-50: #f6f2ff;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: "Baloo 2", system-ui, sans-serif;
      color: var(--ink);
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 8% 9%, rgba(126, 218, 190, .24), transparent 25%),
        radial-gradient(circle at 92% 12%, rgba(255, 190, 169, .25), transparent 24%),
        radial-gradient(circle at 78% 84%, rgba(255, 226, 119, .19), transparent 28%),
        linear-gradient(180deg, #fffdf7 0%, #f4fbf8 52%, #fffaf6 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .48;
      background-image:
        radial-gradient(circle at center, rgba(86, 174, 148, .22) 1.25px, transparent 1.4px),
        radial-gradient(circle at center, rgba(244, 164, 140, .18) 1px, transparent 1.2px);
      background-position: 0 0, 18px 18px;
      background-size: 36px 36px;
      mask-image: linear-gradient(to bottom, #000 0%, rgba(0,0,0,.6) 48%, transparent 100%);
      z-index: -2;
    }

    body::after {
      content: "";
      position: fixed;
      left: -90px;
      bottom: -95px;
      width: 290px;
      height: 290px;
      border-radius: 50%;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 62% 20%, rgba(102, 185, 131, .20) 0 18%, transparent 19%),
        radial-gradient(ellipse at 42% 43%, rgba(102, 185, 131, .15) 0 17%, transparent 18%),
        radial-gradient(ellipse at 72% 60%, rgba(102, 185, 131, .12) 0 16%, transparent 17%);
      transform: rotate(-24deg);
      z-index: -1;
    }

    button, select, input { font: inherit; }
    .cn { font-family: "Noto Sans SC", sans-serif; }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      min-height: 72px;
      padding: 10px clamp(14px, 2vw, 32px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: rgba(255, 255, 250, .86);
      border-bottom: 1px solid rgba(209, 232, 222, .88);
      box-shadow: 0 8px 28px rgba(73, 117, 103, .07);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .brand-button {
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      border: 0;
      border-radius: 17px;
      color: #fff;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 18px;
      background: linear-gradient(145deg, #55c3a8, #7ed5bd);
      box-shadow: 0 10px 22px rgba(71, 184, 159, .25), inset 0 1px 0 rgba(255,255,255,.35);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .brand-button:hover {
      transform: translateY(-2px) rotate(-2deg) scale(1.02);
      box-shadow: 0 14px 28px rgba(71, 184, 159, .31);
    }

    .brand-button:active { transform: scale(.96); }

    .header-eyebrow {
      margin: 0 0 3px;
      color: #3da78f;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .13em;
      text-transform: uppercase;
      line-height: 1;
    }

    .header-title {
      margin: 0;
      color: #304658;
      font-size: clamp(16px, 1.35vw, 21px);
      font-weight: 900;
      line-height: 1.15;
    }

    .select-shell {
      position: relative;
      min-width: min(310px, 34vw);
    }

    .select-shell::after {
      content: "\f078";
      font-family: "Font Awesome 6 Free";
      font-weight: 900;
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: #679385;
      font-size: 12px;
    }

    #lessonSelect {
      width: 100%;
      appearance: none;
      border: 1px solid #d8ebe3;
      border-radius: 17px;
      padding: 11px 42px 11px 16px;
      color: #3c5a62;
      background: rgba(246, 253, 249, .95);
      outline: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }

    #lessonSelect:hover { background: #fff; border-color: #bfe2d4; }
    #lessonSelect:focus { border-color: #79cfb8; box-shadow: 0 0 0 4px rgba(71,184,159,.13); }

    .page-wrap {
      width: min(1500px, 100%);
      margin: 0 auto;
      padding: clamp(14px, 1.8vw, 26px);
    }

    .level-page {
      position: relative;
      isolation: isolate;
      padding-top: clamp(12px, 1.25vw, 18px);
    }

    .nature-decor {
      position: absolute;
      z-index: -1;
      pointer-events: none;
      user-select: none;
      filter: drop-shadow(0 8px 12px rgba(76, 132, 111, .10));
      animation: floatNature 5s ease-in-out infinite;
    }

    .nature-decor.leaf-left {
      left: clamp(5px, 1.3vw, 22px);
      top: 105px;
      font-size: clamp(38px, 5vw, 70px);
      transform: rotate(-24deg);
      opacity: .62;
    }

    .nature-decor.flower-right {
      right: clamp(4px, 1vw, 18px);
      top: 80px;
      font-size: clamp(30px, 4vw, 54px);
      animation-delay: -1.8s;
      opacity: .68;
    }

    .nature-decor.sprout-bottom {
      right: 4%;
      bottom: 5px;
      font-size: clamp(34px, 4vw, 58px);
      animation-delay: -3s;
      opacity: .46;
    }

    @keyframes floatNature {
      0%, 100% { translate: 0 0; rotate: -2deg; }
      50% { translate: 0 -9px; rotate: 3deg; }
    }

    .level-heading-shell {
      position: relative;
      width: 100%;
      margin: 0 auto 16px;
    }

    .compact-level-header {
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 11px 13px 11px 15px;
      border: 2px solid #bfe7d8;
      border-radius: 25px;
      background: rgba(255, 255, 255, .89);
      box-shadow: 5px 5px 0 rgba(57, 139, 115, .22);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .compact-title-block {
      min-width: 0;
      flex: 0 1 auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .compact-title-icon {
      width: 52px;
      height: 52px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 2px solid #12896b;
      border-radius: 18px;
      color: #fff;
      background: linear-gradient(145deg, #18ad86, #66d6b4);
      box-shadow: 4px 4px 0 #08664f;
      font-size: 21px;
    }

    .compact-eyebrow {
      display: block;
      margin-bottom: 2px;
      color: #3f9f89;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .10em;
      text-transform: uppercase;
      line-height: 1;
    }

    .section-title {
      margin: 0;
      color: #2c4652;
      font-size: clamp(27px, 2.6vw, 39px);
      font-weight: 900;
      line-height: 1.02;
      letter-spacing: -.035em;
      white-space: nowrap;
    }

    .section-title .cn {
      color: #50b89f;
      font-size: .65em;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .motivation-card {
      position: relative;
      overflow: hidden;
      min-width: 390px;
      max-width: 660px;
      min-height: 58px;
      flex: 1 1 560px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 48px 8px 10px;
      border: 2px solid #efb5a1;
      border-radius: 20px;
      background:
        radial-gradient(circle at 89% 16%, rgba(255, 222, 132, .34), transparent 24%),
        linear-gradient(110deg, rgba(255,249,240,.98), rgba(255,237,232,.94) 52%, rgba(237,250,244,.96));
      box-shadow: 4px 4px 0 #c57862;
    }

    .motivation-card::after {
      content: "❀";
      position: absolute;
      right: 15px;
      top: 50%;
      translate: 0 -50%;
      color: rgba(214, 108, 82, .46);
      font-size: 26px;
      animation: flowerSpin 8s linear infinite;
    }

    @keyframes flowerSpin { to { transform: rotate(360deg); } }

    .motivation-mascot {
      width: 48px;
      height: 48px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      border: 2px solid #6fbda4;
      border-radius: 17px 17px 17px 8px;
      background: linear-gradient(145deg, #ffffff, #dff6ec);
      box-shadow: 3px 3px 0 #3e8f77;
      transform: rotate(1.5deg);
    }

    .motivation-mascot span {
      font-size: 25px;
      line-height: .92;
      animation: pandaHello 2.6s ease-in-out infinite;
      transform-origin: bottom center;
    }

    .motivation-mascot small {
      margin-top: 2px;
      color: #4d9985;
      font-size: 8px;
      font-weight: 900;
      line-height: 1;
    }

    @keyframes pandaHello {
      0%, 100% { transform: rotate(0) translateY(0); }
      45% { transform: rotate(-5deg) translateY(-2px); }
      65% { transform: rotate(5deg) translateY(-2px); }
    }

    .motivation-copy {
      min-width: 0;
    }

    .motivation-copy span {
      display: block;
      margin-bottom: 1px;
      color: #ad6755;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .11em;
      text-transform: uppercase;
      line-height: 1.1;
    }

    #motivationText {
      margin: 0;
      color: #48636c;
      font-size: clamp(13px, 1.2vw, 16px);
      font-weight: 900;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .grid-levels {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(16px, 1.6vw, 24px);
    }

    .surface-card {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(218, 235, 227, .93);
      background: rgba(255,255,255,.90);
      box-shadow: 0 16px 38px rgba(60, 97, 86, .09);
      backdrop-filter: blur(10px);
    }

    .level-card {
      min-height: 326px;
      padding: 19px;
      border-radius: 31px;
      background:
        radial-gradient(circle at 89% 11%, rgba(255,255,255,.68), transparent 23%),
        linear-gradient(155deg, rgba(255,255,255,.95), var(--card-bg));
      transition: transform .28s ease, box-shadow .28s ease, border-color .28s ease;
      isolation: isolate;
      outline: none;
      animation: levelCardIn .52s both;
      animation-delay: var(--card-delay, 0ms);
    }

    @keyframes levelCardIn {
      from { opacity: 0; transform: translateY(16px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .level-card::before {
      content: "";
      position: absolute;
      left: 19px;
      right: 19px;
      top: 0;
      height: 5px;
      border-radius: 0 0 999px 999px;
      background: var(--accent-gradient);
      opacity: .82;
    }

    .level-card::after {
      content: "";
      position: absolute;
      width: 165px;
      height: 165px;
      right: -72px;
      top: -68px;
      border-radius: 50%;
      background: var(--accent-soft);
      z-index: -1;
      transition: transform .35s ease;
    }

    .level-card.available { cursor: pointer; }

    .level-card.available:hover,
    .level-card.available:focus-visible {
      transform: translateY(-9px) rotate(-.35deg);
      border-color: color-mix(in srgb, var(--accent), white 60%);
      box-shadow: 0 27px 55px rgba(65, 106, 94, .16);
    }

    .level-card.available:hover::after,
    .level-card.available:focus-visible::after { transform: scale(1.13); }

    .level-card.unavailable {
      cursor: not-allowed;
      filter: saturate(.76);
    }

    .level-card.unavailable::before { opacity: .43; }

    .level-card.unavailable .level-mascot { filter: grayscale(.18); }

    .level-watermark {
      position: absolute;
      right: 17px;
      bottom: -17px;
      color: var(--accent-soft);
      font-size: 110px;
      font-weight: 900;
      line-height: 1;
      user-select: none;
      z-index: -1;
      transform: rotate(-8deg);
    }

    .card-flower {
      position: absolute;
      right: 28px;
      bottom: 72px;
      color: color-mix(in srgb, var(--accent), transparent 67%);
      font-size: 22px;
      z-index: -1;
      transform: rotate(12deg);
    }

    .level-top {
      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .mascot-wrap {
      position: relative;
      width: 88px;
      height: 88px;
      flex: 0 0 auto;
    }

    .level-mascot {
      width: 80px;
      height: 80px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.78);
      border-radius: 31px 31px 31px 13px;
      background: var(--mascot-bg);
      box-shadow: 0 14px 26px color-mix(in srgb, var(--accent), transparent 82%), inset 0 1px 0 rgba(255,255,255,.8);
      font-size: 44px;
      line-height: 1;
      transition: transform .28s ease;
    }

    .level-card.available:hover .level-mascot,
    .level-card.available:focus-visible .level-mascot { transform: translateY(-4px) rotate(-5deg) scale(1.04); }

    .level-icon {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 3px solid rgba(255,255,255,.92);
      border-radius: 13px;
      color: #fff;
      background: var(--accent-gradient);
      box-shadow: 0 8px 16px color-mix(in srgb, var(--accent), transparent 74%);
      font-size: 14px;
      font-weight: 900;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border: 1px solid color-mix(in srgb, var(--accent), white 73%);
      border-radius: 999px;
      color: color-mix(in srgb, var(--accent), #345 18%);
      background: rgba(255,255,255,.66);
      font-size: 10px;
      font-weight: 900;
      white-space: nowrap;
    }

    .level-label {
      margin: 14px 0 0;
      color: var(--accent);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .level-name {
      margin: 2px 0 0;
      color: #304856;
      font-size: 33px;
      font-weight: 900;
      letter-spacing: -.025em;
      line-height: 1.08;
    }

    .level-desc {
      min-height: 43px;
      margin: 6px 0 0;
      color: #71858e;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.48;
    }

    .mascot-name {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 6px;
      padding: 4px 9px;
      border-radius: 999px;
      color: color-mix(in srgb, var(--accent), #3f5360 25%);
      background: rgba(255,255,255,.66);
      font-size: 11px;
      font-weight: 800;
    }

    .level-footer {
      position: absolute;
      left: 19px;
      right: 19px;
      bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 12px;
      border-top: 1px dashed color-mix(in srgb, var(--accent), white 75%);
      color: color-mix(in srgb, var(--accent), #40545e 14%);
      font-size: 13px;
      font-weight: 900;
    }

    .level-footer i {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 12px;
      background: rgba(255,255,255,.68);
      transition: transform .22s ease, background .22s ease;
    }

    .level-card.available:hover .level-footer i,
    .level-card.available:focus-visible .level-footer i {
      transform: translateX(5px);
      background: #fff;
    }

    #catalogPage {
      padding-top: clamp(12px, 1.25vw, 18px);
    }

    .catalog-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 0 0 16px;
      padding: 13px 15px;
      border: 2px solid #bedfd5;
      border-radius: 24px;
      background: rgba(255, 255, 255, .91);
      box-shadow: 5px 5px 0 rgba(57, 139, 115, .20);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .catalog-title-wrap {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .back-link {
      width: 43px;
      height: 43px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 2px solid #12896b;
      border-radius: 15px;
      color: #fff;
      background: linear-gradient(145deg, #18ad86, #66d6b4);
      box-shadow: 3px 3px 0 #08664f;
      cursor: pointer;
      font-size: 15px;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .back-link:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 #08664f;
    }

    .back-link:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #08664f;
    }

    .catalog-copy {
      min-width: 0;
    }

    .catalog-kicker {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 2px;
    }

    .catalog-title {
      margin: 0;
      color: #3f9f89;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .09em;
      text-transform: uppercase;
      line-height: 1.1;
    }

    .catalog-description {
      display: none;
    }

    .lesson-count-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border: 1px solid #c5e8dc;
      border-radius: 999px;
      color: #397e6c;
      background: #eaf9f3;
      font-size: 10px;
      font-weight: 900;
      line-height: 1.25;
      white-space: nowrap;
    }

    .catalog-heading {
      margin: 0;
      color: #304856;
      font-size: clamp(24px, 2.15vw, 31px);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -.025em;
      white-space: nowrap;
    }

    .catalog-heading .cn {
      color: #50b89f;
      font-size: .72em;
    }

    .catalog-summary {
      margin: 3px 0 0;
      color: #7c9298;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
    }

    .search-box {
      position:relative;
      width:min(390px, 100%);
    }

    .search-box i {
      position:absolute;
      left:15px;
      top:50%;
      transform:translateY(-50%);
      color:#8ca49c;
      font-size:14px;
      pointer-events:none;
    }

    #lessonSearch {
      width:100%;
      border:1px solid #d8e9e2;
      border-radius:17px;
      padding:12px 15px 12px 42px;
      outline:none;
      color:#39555e;
      background:rgba(255,255,255,.90);
      box-shadow:0 9px 24px rgba(70, 108, 96, .07);
      font-size:14px;
      font-weight:700;
      transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }

    #lessonSearch:focus { background:#fff; border-color:#7acdb7; box-shadow:0 0 0 4px rgba(71,184,159,.12), 0 12px 28px rgba(68,108,95,.08); }

    .lesson-grid {
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:18px;
    }

    .catalog-card {
      --lesson-accent:#55bfa5;
      min-height:250px;
      padding:20px;
      border-radius:26px;
      cursor:pointer;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      transition:transform .24s ease, box-shadow .24s ease, border-color .24s ease;
      animation:cardIn .45s both;
      outline:none;
    }

    @keyframes cardIn {
      from { opacity:0; transform:translateY(12px); }
      to { opacity:1; transform:translateY(0); }
    }

    .catalog-card::before {
      content:"";
      position:absolute;
      left:0;
      top:0;
      width:100%;
      height:5px;
      background:linear-gradient(90deg,var(--lesson-accent),color-mix(in srgb,var(--lesson-accent),white 46%));
    }

    .catalog-card::after {
      content:"";
      position:absolute;
      width:105px;
      height:105px;
      right:-43px;
      top:-43px;
      border-radius:50%;
      background:color-mix(in srgb,var(--lesson-accent),transparent 89%);
      transition:transform .25s ease;
    }

    .catalog-card:hover,
    .catalog-card:focus-visible {
      transform:translateY(-7px);
      border-color:color-mix(in srgb,var(--lesson-accent),white 58%);
      box-shadow:0 23px 48px rgba(61, 99, 87, .13);
    }

    .catalog-card:hover::after { transform:scale(1.18); }

    .lesson-card-top { display:flex; align-items:center; justify-content:space-between; gap:12px; position:relative; z-index:1; }

    .lesson-number {
      width:43px;
      height:43px;
      display:grid;
      place-items:center;
      flex:0 0 auto;
      border-radius:14px;
      color:#fff;
      background:var(--lesson-accent);
      box-shadow:0 10px 20px color-mix(in srgb,var(--lesson-accent),transparent 70%);
      font-size:14px;
      font-weight:900;
    }

    .lesson-level {
      padding:5px 9px;
      border-radius:999px;
      color:var(--lesson-accent);
      background:color-mix(in srgb,var(--lesson-accent),white 91%);
      font-size:11px;
      font-weight:900;
    }

    .lesson-title {
      margin:23px 0 3px;
      color:#304856;
      font-size:clamp(24px,1.9vw,31px);
      font-weight:900;
      line-height:1.18;
      letter-spacing:-.025em;
    }

    .lesson-pinyin { margin:0; color:#84999f; font-size:14px; font-weight:800; line-height:1.45; }

    .lesson-footer {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-top:28px;
      padding-top:14px;
      border-top:1px solid #e8f0ed;
      color:var(--lesson-accent);
      font-size:13px;
      font-weight:900;
    }

    .lesson-footer .arrow {
      width:34px;
      height:34px;
      display:grid;
      place-items:center;
      border-radius:11px;
      background:color-mix(in srgb,var(--lesson-accent),white 91%);
      transition:transform .22s ease, background .22s ease;
    }

    .catalog-card:hover .lesson-footer .arrow { transform:translateX(4px); background:color-mix(in srgb,var(--lesson-accent),white 86%); }

    .empty-state {
      grid-column:1/-1;
      padding:55px 20px;
      text-align:center;
      border:1px dashed #c8ded5;
      border-radius:24px;
      color:#718b87;
      background:rgba(255,255,255,.65);
      font-weight:800;
    }

    #lessonIframe {
      width:100%;
      height:calc(100vh - 72px);
      border:0;
      display:block;
      background:#fff;
    }


    /* =========================================================
       HSK LEVEL CARDS — SHARP, VIVID & HARD-SHADOW OVERRIDE
       Chỉ tác động đến 4 thẻ cấp độ trong #levelGrid.
       Không ảnh hưởng thẻ bài học .catalog-card hoặc JavaScript.
    ========================================================== */

    #levelGrid .level-card:nth-child(1) {
      --sharp-border: #078b69;
      --sharp-shadow: #055f49;
      --sharp-card-bg: #d9fff2;
      --sharp-mascot-start: #04b98c;
      --sharp-mascot-end: #55e0b9;
      --sharp-badge-bg: #caffeb;
      --sharp-text: #056f57;
    }

    #levelGrid .level-card:nth-child(2) {
      --sharp-border: #e66736;
      --sharp-shadow: #a63d1d;
      --sharp-card-bg: #ffe8dc;
      --sharp-mascot-start: #ff6c3b;
      --sharp-mascot-end: #ffad61;
      --sharp-badge-bg: #ffe0d1;
      --sharp-text: #b94720;
    }

    #levelGrid .level-card:nth-child(3) {
      --sharp-border: #d29a00;
      --sharp-shadow: #956800;
      --sharp-card-bg: #fff3b8;
      --sharp-mascot-start: #f5b900;
      --sharp-mascot-end: #ffda4f;
      --sharp-badge-bg: #ffed9c;
      --sharp-text: #8b6200;
    }

    #levelGrid .level-card:nth-child(4) {
      --sharp-border: #7354cf;
      --sharp-shadow: #493494;
      --sharp-card-bg: #eae3ff;
      --sharp-mascot-start: #8061e8;
      --sharp-mascot-end: #b59aff;
      --sharp-badge-bg: #dfd4ff;
      --sharp-text: #563aa8;
    }

    #levelGrid .level-card {
      border: 2px solid var(--sharp-border);
      background:
        radial-gradient(circle at 88% 10%, rgba(255,255,255,.58), transparent 22%),
        linear-gradient(155deg, #ffffff 0%, #ffffff 38%, var(--sharp-card-bg) 100%);
      box-shadow: 7px 7px 0 var(--sharp-shadow);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      transition:
        transform .20s ease,
        box-shadow .20s ease,
        border-color .20s ease;
    }

    #levelGrid .level-card::before {
      left: 20px;
      right: 20px;
      height: 8px;
      opacity: 1;
      background: linear-gradient(
        90deg,
        var(--sharp-border),
        var(--sharp-mascot-start),
        var(--sharp-mascot-end)
      );
      border: 1px solid rgba(255,255,255,.65);
      border-top: 0;
      box-shadow: 0 3px 0 color-mix(in srgb, var(--sharp-border), black 10%);
    }

    #levelGrid .level-card::after {
      background: color-mix(in srgb, var(--sharp-mascot-end), transparent 62%);
      border: 2px solid color-mix(in srgb, var(--sharp-border), transparent 48%);
    }

    #levelGrid .level-card.available:hover,
    #levelGrid .level-card.available:focus-visible {
      transform: translate(-3px, -3px);
      border-color: var(--sharp-border);
      box-shadow:
        10px 10px 0 var(--sharp-shadow),
        0 0 0 3px #ffffff,
        0 0 0 5px var(--sharp-border);
    }

    #levelGrid .level-card.available:active {
      transform: translate(4px, 4px);
      box-shadow: 3px 3px 0 var(--sharp-shadow);
    }

    #levelGrid .level-card.unavailable {
      filter: none;
      opacity: .94;
      box-shadow: 6px 6px 0 color-mix(in srgb, var(--sharp-shadow), #7b8790 26%);
    }

    #levelGrid .level-card.unavailable::before {
      opacity: .82;
    }

    #levelGrid .level-card.unavailable .level-mascot {
      filter: saturate(.88);
    }

    #levelGrid .level-mascot {
      border: 2px solid var(--sharp-border);
      background: linear-gradient(
        145deg,
        var(--sharp-mascot-start),
        var(--sharp-mascot-end)
      );
      box-shadow: 4px 4px 0 var(--sharp-shadow);
      filter: saturate(1.18) contrast(1.03);
    }

    #levelGrid .level-icon {
      border: 2px solid #ffffff;
      background: var(--sharp-border);
      box-shadow: 3px 3px 0 var(--sharp-shadow);
    }

    #levelGrid .status-badge {
      border: 2px solid var(--sharp-border);
      color: var(--sharp-text);
      background: var(--sharp-badge-bg);
      box-shadow: 3px 3px 0 var(--sharp-shadow);
    }

    #levelGrid .level-label,
    #levelGrid .level-footer {
      color: var(--sharp-text);
    }

    #levelGrid .level-name {
      color: color-mix(in srgb, var(--sharp-text), #243746 48%);
    }

    #levelGrid .level-desc {
      color: #4f6871;
    }

    #levelGrid .mascot-name {
      border: 1px solid var(--sharp-border);
      color: var(--sharp-text);
      background: var(--sharp-badge-bg);
      box-shadow: 2px 2px 0 var(--sharp-shadow);
    }

    #levelGrid .level-footer {
      border-top: 2px dashed color-mix(in srgb, var(--sharp-border), white 24%);
    }

    #levelGrid .level-footer i {
      border: 2px solid var(--sharp-border);
      color: var(--sharp-text);
      background: var(--sharp-badge-bg);
      box-shadow: 3px 3px 0 var(--sharp-shadow);
    }

    #levelGrid .level-card.available:hover .level-footer i,
    #levelGrid .level-card.available:focus-visible .level-footer i {
      color: #ffffff;
      background: var(--sharp-border);
      transform: translateX(4px);
    }

    #levelGrid .level-watermark {
      color: color-mix(in srgb, var(--sharp-border), transparent 78%);
    }

    #levelGrid .card-flower {
      color: color-mix(in srgb, var(--sharp-border), transparent 35%);
    }


    @media (max-width: 1120px) {
      .compact-level-header { gap: 12px; }
      .motivation-card { min-width: 340px; }
      .section-title { font-size: 31px; }
    }

    @media (max-width: 980px) {
      .grid-levels, .lesson-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .compact-level-header { align-items: stretch; }
      .motivation-card { min-width: 0; }
      .catalog-tools { align-items: stretch; flex-direction: column; }
      .search-box { width: 100%; }
    }

    @media (max-width: 760px) {
      .app-header { align-items: flex-start; flex-wrap: wrap; }
      .select-shell { width: 100%; min-width: 0; }
      .header-title { max-width: calc(100vw - 92px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .page-wrap { padding: 12px; }
      .level-page, #catalogPage { padding-top: 12px; }
      .compact-level-header { flex-direction: column; gap: 10px; padding: 11px; }
      .compact-title-block { width: 100%; }
      .section-title { font-size: 30px; }
      .motivation-card { width: 100%; max-width: none; min-height: 56px; }
      .catalog-heading { white-space: normal; }
      .grid-levels, .lesson-grid { grid-template-columns: 1fr; }
      .level-card { min-height: 330px; }
      .nature-decor.leaf-left { display: none; }
      .nature-decor.flower-right { right: 1px; top: 67px; font-size: 30px; }
      .nature-decor.sprout-bottom { display: none; }
      #lessonIframe { height: calc(100vh - 125px); }
    }

    @media (max-width: 430px) {
      .compact-title-icon { width: 46px; height: 46px; border-radius: 15px; }
      .section-title { font-size: 27px; }
      .section-title .cn { display: block; margin-top: 3px; font-size: .60em; }
      #motivationText { white-space: normal; }
      .motivation-card { padding-right: 41px; }
      .motivation-card::after { right: 11px; font-size: 22px; }
      .status-badge { padding: 6px 8px; font-size: 9px; }
      .level-card { padding: 18px; border-radius: 29px; }
      .level-footer { left: 18px; right: 18px; }
      .catalog-title-wrap { align-items: flex-start; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior:auto !important;
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
      }
    }

/* Ẩn thanh công cụ trùng với tiêu đề phía trên */
#catalogPage > .catalog-tools {
  display: none !important;
}

body.catalog-active .app-header > * {
  position: relative;
  z-index: 2;
}

body.catalog-active .brand-button {
  width: 56px;
  height: 56px;
  border: 1px solid #199f87;
  border-radius: 18px;
  background: linear-gradient(145deg,#39bea4,#22aa91);
  box-shadow: 0 7px 0 #168774, 0 12px 24px rgba(33,155,132,.20);
  font-size: 22px;
}

body.catalog-active .header-eyebrow {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
  color: #168f78;
  font-size: 12px;
  letter-spacing: .05em;
}

body.catalog-active .header-eyebrow .catalog-pill {
  padding: 3px 8px;
  border: 1px solid #a8dfd1;
  border-radius: 999px;
  background: #ecfaf5;
  line-height: 1;
}

body.catalog-active .header-eyebrow .catalog-dot {
  color: #29b299;
  font-size: 15px;
}

body.catalog-active .header-title {
  color: #173746;
  font-size: clamp(23px, 2.2vw, 34px);
  line-height: 1.05;
  letter-spacing: -.025em;
}

body.catalog-active .select-shell {
  min-width: min(320px, 30vw);
}

body.catalog-active #lessonSelect {
  min-height: 56px;
  border: 1.5px solid #b4e2d8;
  border-radius: 18px;
  padding-left: 20px;
  background: rgba(255,255,255,.96);
  box-shadow: 0 7px 0 rgba(85,166,147,.14), 0 12px 26px rgba(67,111,98,.08);
}

#catalogPage .lesson-grid {
  position: relative;
  z-index: 2;
  width: min(1360px, calc(100% - 8px));
  margin: 0 auto;
  padding: clamp(22px, 2vw, 30px);
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: clamp(17px, 1.45vw, 22px);
  border: 2px solid #b8e5d9;
  border-radius: 34px;
  background: rgba(252,255,253,.93);
  box-shadow: 0 18px 42px rgba(61,106,91,.10);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
}

#catalogPage .catalog-card {
  --lesson-accent:#42b79f;
  position: relative;
  min-height: 242px;
  padding: 16px 16px 66px;
  border: 1.8px solid color-mix(in srgb,var(--lesson-accent),white 18%);
  border-radius: 20px;
  background:
    radial-gradient(circle at 82% 24%,rgba(255,255,255,.36),transparent 25%),
    linear-gradient(145deg,
      color-mix(in srgb,var(--lesson-accent),white 88%) 0%,
      color-mix(in srgb,var(--lesson-accent),white 95%) 58%,
      color-mix(in srgb,var(--lesson-accent),white 91%) 100%);
  box-shadow:
    0 7px 0 color-mix(in srgb,var(--lesson-accent),white 57%),
    0 12px 24px rgba(70,102,92,.10);
  overflow: hidden;
  isolation: isolate;
  transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
}

#catalogPage .catalog-card::before {
  content:"";
  position:absolute;
  inset:5px;
  z-index:0;
  border:1px solid rgba(255,255,255,.84);
  border-radius:15px;
  background:
    radial-gradient(circle at 22% 31%,rgba(255,255,255,.62) 0 2px,transparent 2.7px),
    radial-gradient(circle at 35% 18%,rgba(255,255,255,.58) 0 1.7px,transparent 2.3px);
  background-size:42px 42px,56px 56px;
  pointer-events:none;
}

#catalogPage .catalog-card::after {
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:auto;
  bottom:58px;
  width:auto;
  height:1px;
  border-radius:0;
  background:color-mix(in srgb,var(--lesson-accent),white 52%);
  opacity:.52;
  z-index:3;
}

#catalogPage .catalog-card:hover,
#catalogPage .catalog-card:focus-visible {
  transform: translateY(-5px);
  border-color: var(--lesson-accent);
  box-shadow:
    0 9px 0 color-mix(in srgb,var(--lesson-accent),white 48%),
    0 18px 34px rgba(58,96,84,.15);
}

#catalogPage .catalog-card:active {
  transform: translateY(-1px);
}

#catalogPage .catalog-card > div:first-child {
  position: relative;
  z-index: 4;
}

#catalogPage .lesson-art {
  position: absolute;
  z-index: 2;
  right: 4px;
  top: 37px;
  width: 54%;
  height: 145px;
  object-fit: cover;
  object-position: center;
  border-radius: 12px 16px 12px 18px;
  pointer-events: none;
  opacity: .98;
  -webkit-mask-image: linear-gradient(90deg,transparent 0%,rgba(0,0,0,.28) 17%,#000 37%);
  mask-image: linear-gradient(90deg,transparent 0%,rgba(0,0,0,.28) 17%,#000 37%);
}

#catalogPage .lesson-card-top {
  position: relative;
  z-index: 6;
  align-items: flex-start;
}

#catalogPage .lesson-number {
  width: 46px;
  height: 46px;
  border: 1.5px solid color-mix(in srgb,var(--lesson-accent),#153f36 10%);
  border-radius: 13px;
  color: #fff;
  background: linear-gradient(145deg,
    color-mix(in srgb,var(--lesson-accent),white 12%),
    var(--lesson-accent));
  box-shadow: 0 5px 0 color-mix(in srgb,var(--lesson-accent),#274c42 34%),
              0 9px 16px color-mix(in srgb,var(--lesson-accent),transparent 73%);
  font-size: 16px;
}

#catalogPage .lesson-level {
  position: relative;
  z-index: 7;
  padding: 6px 11px;
  border: 1.6px solid var(--lesson-accent);
  border-radius: 999px;
  color: color-mix(in srgb,var(--lesson-accent),#173e35 22%);
  background: rgba(255,255,255,.90);
  box-shadow: 0 4px 10px rgba(62,94,84,.07);
  font-size: 11px;
}

#catalogPage .lesson-title {
  position: relative;
  z-index: 5;
  width: 62%;
  min-height: 66px;
  margin: 20px 0 4px;
  display: flex;
  align-items: center;
  color: #173847;
  font-size: clamp(22px,1.55vw,28px);
  font-weight: 900;
  line-height: 1.16;
  letter-spacing: -.025em;
  text-wrap: balance;
  text-shadow: 0 1px 0 rgba(255,255,255,.86);
}

#catalogPage .lesson-title.is-medium {
  font-size: clamp(20px,1.38vw,25px);
}

#catalogPage .lesson-title.is-long {
  width: 66%;
  font-size: clamp(18px,1.18vw,22px);
  line-height: 1.14;
}

#catalogPage .lesson-pinyin {
  position: relative;
  z-index: 5;
  width: 60%;
  margin: 0;
  color: #4e6973;
  background: rgba(255,255,255,.66);
  border: 0;
  border-radius: 8px;
  padding: 5px 7px;
  font-size: 12px;
  font-weight: 800;
  line-height: 1.3;
}

#catalogPage .lesson-footer {
  position: absolute;
  z-index: 8;
  left: 7px;
  right: 7px;
  bottom: 7px;
  min-height: 47px;
  margin: 0;
  padding: 7px 10px 7px 13px;
  border: 1px solid color-mix(in srgb,var(--lesson-accent),white 42%);
  border-radius: 13px;
  color: color-mix(in srgb,var(--lesson-accent),#203f37 20%);
  background: rgba(255,255,255,.91);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.9);
  font-size: 13px;
}

#catalogPage .lesson-footer .arrow {
  width: 31px;
  height: 31px;
  border-radius: 50%;
  color: #fff;
  background: var(--lesson-accent);
  box-shadow: 0 4px 0 color-mix(in srgb,var(--lesson-accent),#31574d 28%);
}

#catalogPage .catalog-card:hover .lesson-footer .arrow,
#catalogPage .catalog-card:focus-visible .lesson-footer .arrow {
  color: #fff;
  background: var(--lesson-accent);
  transform: translateX(3px);
}

#catalogPage .empty-state {
  border: 2px dashed #8ecdbb;
  color: #41685b;
  background: rgba(255,255,255,.95);
  box-shadow: 0 12px 26px rgba(61,95,82,.08);
}

@media (max-width: 1240px) {
  body.catalog-active .app-header::after {
    left: 59%;
    width: 210px;
  }

  #catalogPage .lesson-grid {
    grid-template-columns: repeat(3,minmax(0,1fr));
    max-width: 1040px;
  }
}

@media (max-width: 980px) {
  body.catalog-active .app-header::after {
    display:none;
  }

  body.catalog-active .app-header {
    min-height: 88px;
  }

  #catalogPage.page-wrap {
    min-height: calc(100vh - 88px);
    padding: 20px 18px 55px;
    background-size: auto 900px;
    background-position: center -60px;
  }

  #catalogPage .lesson-grid {
    grid-template-columns: repeat(2,minmax(0,1fr));
    width: min(760px,100%);
    padding: 20px;
  }
}

@media (max-width: 680px) {
  body.catalog-active .app-header {
    min-height: 120px;
    padding: 10px 14px;
  }

  body.catalog-active .header-title {
    font-size: 21px;
  }

  body.catalog-active .brand-button {
    width: 48px;
    height: 48px;
  }

  #catalogPage.page-wrap {
    min-height: calc(100vh - 120px);
    padding: 16px 11px 40px;
    background-image: linear-gradient(180deg,#f7fffb,#effaf6);
  }

  #catalogPage .lesson-grid {
    grid-template-columns: 1fr;
    width: min(420px,100%);
    padding: 13px;
    gap: 16px;
    border-radius: 24px;
  }

  #catalogPage .catalog-card {
    min-height: 236px;
  }

  #catalogPage .lesson-title {
    font-size: 24px;
  }

  #catalogPage .lesson-title.is-long {
    font-size: 20px;
  }
}

  </style>
</head>

      levelPage: document.getElementById("levelPage"),
      catalogPage: document.getElementById("catalogPage"),

    function hideAllViews() {
      elements.levelPage.classList.add("hidden");
      elements.catalogPage.classList.add("hidden");
      elements.lessonContainer.classList.add("hidden");
    }

    function scrollPageTop() {
      requestAnimationFrame(() => window.scrollTo({ top: 0, left: 0, behavior: "auto" }));
    }

    function getExternalCourses() {
      try {
        if (typeof HSK_COURSES !== "undefined" && Array.isArray(HSK_COURSES)) {
          return HSK_COURSES;
        }
      } catch (error) {
        console.warn("Không thể đọc lessons-index.js, đang dùng dữ liệu dự phòng.", error);
      }
      return [];
    }

    function getCourses() {
      const externalCourses = getExternalCourses();

      return FALLBACK_HSK_COURSES.map(fallbackCourse => {
        const externalCourse = externalCourses.find(course =>
          Number(course.level) === Number(fallbackCourse.level) ||
          String(course.id).toLowerCase() === String(fallbackCourse.id).toLowerCase()
        );

        if (!externalCourse) return fallbackCourse;

        return Object.assign({}, fallbackCourse, externalCourse, {
          level: Number(externalCourse.level ?? fallbackCourse.level),
          lessons: Array.isArray(externalCourse.lessons)
            ? externalCourse.lessons
            : fallbackCourse.lessons
        });
      });
    }

    function isCourseAvailable(course) {
      return course?.available === true && Array.isArray(course?.lessons) && course.lessons.length > 0;
    }

    function findCourse(courseId) {
      return getCourses().find(course => String(course.id) === String(courseId));
    }

    function findLesson(courseId, lessonId) {
      const course = findCourse(courseId);
      if (!course) return null;
      return course.lessons.find(lesson => lesson.id === Number(lessonId)) || null;
    }

    function lessonValue(courseId, lessonId) {
      return `lesson:${courseId}:${lessonId}`;
    }

    function setMotivationQuote() {
      if (!elements.motivationText) return;
      const randomIndex = Math.floor(Math.random() * MOTIVATION_QUOTES.length);
      elements.motivationText.textContent = MOTIVATION_QUOTES[randomIndex];
    }

    function renderLevelCards() {
      elements.levelGrid.innerHTML = getCourses().map((course, index) => {
        const isAvailable = isCourseAvailable(course);
        const palette = LEVEL_PALETTES[index % LEVEL_PALETTES.length];
        const mascot = LEVEL_MASCOTS[index % LEVEL_MASCOTS.length];
        const status = isAvailable ? "Đã mở · 已开放" : "Sắp ra mắt · 即将开放";
        const actionText = isAvailable ? `${course.lessons.length} bài học · 查看课程` : "Nội dung đang chuẩn bị · 准备中";
        const icon = isAvailable ? "fa-arrow-right" : "fa-clock";

        return `
          <article
            class="level-card surface-card ${isAvailable ? "available" : "unavailable"}"
            style="--accent:${palette.accent};--accent-gradient:${palette.gradient};--accent-soft:${palette.soft};--card-bg:${palette.cardBg};--mascot-bg:${palette.mascotBg};--card-delay:${Math.min(index * 85, 255)}ms"
            ${isAvailable ? `onclick="showCourse('${course.id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();showCourse('${course.id}')}"` : ""}
            aria-disabled="${!isAvailable}"
          >
            <div class="level-watermark">${course.level}</div>
            <div class="card-flower" aria-hidden="true">✿</div>
            <div class="level-top">
              <div class="mascot-wrap" aria-hidden="true">
                <div class="level-mascot">${mascot.emoji}</div>
                <div class="level-icon">${course.level}</div>
              </div>
              <span class="status-badge"><i class="fa-solid ${isAvailable ? "fa-circle-check" : "fa-clock"}"></i>${status}</span>
            </div>
            <p class="level-label">HSK Level ${course.level}</p>
            <h3 class="level-name">${course.label}</h3>
            <p class="level-desc cn">${course.description}</p>
            <span class="mascot-name"><i class="fa-solid fa-paw"></i>${mascot.name}</span>
            <div class="level-footer">
              <span>${actionText}</span>
              <i class="fa-solid ${icon}"></i>
            </div>
          </article>`;
      }).join("");
    }

    function renderQuickSelect() {
      elements.lessonSelect.innerHTML = '<option value="levels">🎓 Chọn cấp độ (选择等级)</option>';

      getCourses().forEach(course => {
        const group = document.createElement("optgroup");
        group.label = `${course.label}${isCourseAvailable(course) ? "" : " · 即将开放"}`;

        if (isCourseAvailable(course)) {
          const catalogOption = document.createElement("option");
          catalogOption.value = `course:${course.id}`;
          catalogOption.textContent = `📚 ${course.label} · Danh sách bài học`;
          group.appendChild(catalogOption);

          course.lessons.forEach(lesson => {
            const option = document.createElement("option");
            option.value = lessonValue(course.id, lesson.id);
            option.textContent = `Bài ${lesson.id} • ${lesson.title}${lesson.locked ? " 🔒" : ""}`;
            group.appendChild(option);
          });
        } else {
          const option = document.createElement("option");
          option.disabled = true;
          option.textContent = `${course.label} · Sắp ra mắt`;
          group.appendChild(option);
        }

        elements.lessonSelect.appendChild(group);
      });
    }

    function renderLessons(course, keyword = "") {
      state.currentCourse = course;
      elements.catalogTitle.textContent = `${course.label} Standard Course`;
      elements.catalogDescription.textContent = `${course.title} · Chọn một bài học để bắt đầu (选择课程开始学习)`;
      elements.lessonCount.innerHTML = `<i class="fa-solid fa-book-open"></i> ${course.lessons.length} bài học · ${course.lessons.length}课`;

      const normalized = keyword.trim().toLocaleLowerCase();
      const filteredLessons = course.lessons.filter(lesson => {
        const haystack = `${lesson.id} ${lesson.title} ${lesson.pinyin}`.toLocaleLowerCase();
        return haystack.includes(normalized);
      });

      elements.searchResultCount.textContent = normalized
        ? `Tìm thấy ${filteredLessons.length}/${course.lessons.length} bài · 找到 ${filteredLessons.length} 课`
        : `Hiển thị ${course.lessons.length} bài học · 共 ${course.lessons.length} 课`;

      if (filteredLessons.length === 0) {
        elements.catalogGrid.innerHTML = `<div class="empty-state"><i class="fa-regular fa-face-frown-open text-2xl mb-3"></i><br>Không tìm thấy bài phù hợp · 没有找到相关课程</div>`;
        return;
      }

      elements.catalogGrid.innerHTML = filteredLessons.map((lesson, index) => {
        const lockBadge = lesson.locked
          ? '<i class="fa-solid fa-lock ml-1" title="Cần mật khẩu"></i>'
          : '';
        const accent = LESSON_COLORS[(lesson.id - 1) % LESSON_COLORS.length];
        const lessonArt = LESSON_ARTS[(lesson.id - 1) % LESSON_ARTS.length];
        const titleClass = lesson.title.length >= 10
          ? "is-long"
          : (lesson.title.length >= 7 ? "is-medium" : "");
        const lessonNo = String(lesson.id).padStart(2, "0");

        return `
          <article
            onclick="switchLesson('${course.id}', ${lesson.id})"
            onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();switchLesson('${course.id}',${lesson.id})}"
            class="catalog-card surface-card"
            style="--lesson-accent:${accent};animation-delay:${Math.min(index * 35, 280)}ms"
            role="button"
            tabindex="0"
            data-title="${lesson.title}"
            data-pinyin="${lesson.pinyin}"
          >
            <div>
              <div class="lesson-card-top">
                <div class="lesson-number">${lessonNo}</div>
                <span class="lesson-level">${course.label}${lockBadge}</span>
              </div>
              <img class="lesson-art" src="${lessonArt}" alt="" aria-hidden="true" />
              <h3 class="lesson-title cn ${titleClass}">${lesson.title}</h3>
              <p class="lesson-pinyin">${lesson.pinyin}</p>
            </div>
            <div class="lesson-footer">
              <span>${lesson.locked ? "Nhập mật khẩu · 解锁访问" : "Học ngay · 开始学习"}</span>
              <span class="arrow"><i class="fa-solid ${lesson.locked ? "fa-key" : "fa-arrow-right"}"></i></span>
            </div>
          </article>`;
      }).join("");
    }

    function showLevels() {
      document.body.classList.remove("catalog-active");
      state.view = "levels";
      state.courseId = null;
      state.lessonId = null;
      state.currentCourse = null;

      hideAllViews();
      elements.levelPage.classList.remove("hidden");
      elements.lessonIframe.removeAttribute("srcdoc");
      elements.lessonIframe.src = "about:blank";
      elements.headerSubtitle.textContent = "HSK STANDARD COURSE";
      elements.headerTitle.textContent = "Chọn cấp độ (选择HSK等级)";
      elements.lessonSelect.value = "levels";
      elements.homeIcon.className = "fa-solid fa-house";
      elements.lessonSearch.value = "";
      scrollPageTop();
    }

    function showCourse(courseId) {
      const course = findCourse(courseId);
      if (!course || !isCourseAvailable(course)) return;

      document.body.classList.add("catalog-active");
      state.view = "catalog";
      state.courseId = course.id;
      state.lessonId = null;

      elements.lessonSearch.value = "";
      renderLessons(course);
      hideAllViews();
      elements.catalogPage.classList.remove("hidden");
      elements.lessonIframe.removeAttribute("srcdoc");
      elements.lessonIframe.src = "about:blank";
      elements.headerSubtitle.innerHTML = `<span class="catalog-pill">${course.label}</span><span class="catalog-dot">•</span><span class="catalog-pill">STANDARD COURSE</span>`;
      elements.headerTitle.textContent = `Danh sách bài học ${course.label} (${course.label}课程目录)`;
      elements.lessonSelect.value = `course:${course.id}`;
      elements.homeIcon.className = "fa-solid fa-arrow-left";
      scrollPageTop();
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function createFallbackLessonPage(course, lesson) {
      const safeCourse = escapeHtml(course.label);
      const safeLessonId = escapeHtml(lesson.id);
      const safeTitle = escapeHtml(lesson.title);
      const safePinyin = escapeHtml(lesson.pinyin);

      return `<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${safeCourse} · Bài ${safeLessonId}</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#304856;background:linear-gradient(145deg,#f1fcf7,#fff5ef)}
    .card{width:min(680px,100%);padding:42px 28px;text-align:center;border:1px solid #d9ece4;border-radius:32px;background:rgba(255,255,255,.92);box-shadow:0 22px 60px rgba(64,110,95,.13)}
    .mascot{font-size:58px}.label{margin:16px 0 5px;color:#45a98f;font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.title{margin:0;font-size:clamp(38px,8vw,70px);line-height:1.1}.pinyin{margin:10px 0 24px;color:#738993;font-size:22px;font-weight:700}.notice{margin:0 auto;max-width:520px;padding:14px 16px;border-radius:18px;color:#7a6659;background:#fff4e9;font-size:15px;line-height:1.55}
  </style>
</head>
<body>
  <main class="card">
    <div class="mascot">🐰🌱</div>
    <p class="label">${safeCourse} · Bài ${safeLessonId}</p>
    <h1 class="title">${safeTitle}</h1>
    <p class="pinyin">${safePinyin}</p>
    <p class="notice">Giao diện đang sử dụng dữ liệu dự phòng vì chưa tìm thấy <strong>lessons-index.js</strong>. Hãy đặt file dữ liệu bài học gốc cùng thư mục với file HTML này để mở đúng nội dung bài học của bạn.</p>
  </main>
</body>
</html>`;
    }

    function switchLesson(courseId, lessonId) {
      const course = findCourse(courseId);
      const lesson = findLesson(courseId, lessonId);
      if (!course || !lesson) return;

      if (lesson.locked) {
        const userInput = prompt(`Mời nhập mật khẩu để học ${course.label} - Bài ${lesson.id} (请输入访问密码):`);
        if (userInput !== lesson.password) {
          if (userInput !== null) alert("Mật khẩu không đúng! (密码错误，无法访问)");
          elements.lessonSelect.value = state.view === "lesson"
            ? lessonValue(state.courseId, state.lessonId)
            : `course:${course.id}`;
          return;
        }
      }

      document.body.classList.remove("catalog-active");
      state.view = "lesson";
      state.courseId = course.id;
      state.lessonId = lesson.id;

      hideAllViews();
      elements.lessonContainer.classList.remove("hidden");
      elements.headerSubtitle.textContent = `${course.label} • BÀI ${lesson.id}`;
      elements.headerTitle.innerHTML = `${course.label} · Bài ${lesson.id}: <span class="cn">${lesson.title}</span>`;
      elements.lessonSelect.value = lessonValue(course.id, lesson.id);
      elements.homeIcon.className = "fa-solid fa-arrow-left";

      if (lesson.file) {
        elements.lessonIframe.removeAttribute("srcdoc");
        elements.lessonIframe.src = lesson.file;
      } else {
        elements.lessonIframe.src = "about:blank";
        elements.lessonIframe.srcdoc = createFallbackLessonPage(course, lesson);
      }

      scrollPageTop();
    }

    function goBack() {
      if (state.view === "lesson" && state.courseId) showCourse(state.courseId);
      else showLevels();
    }

    function handleQuickSelect(event) {
      const value = event.target.value;

      if (value === "levels") return showLevels();
      if (value.startsWith("course:")) return showCourse(value.split(":")[1]);
      if (value.startsWith("lesson:")) {
        const [, courseId, lessonId] = value.split(":");
        switchLesson(courseId, Number(lessonId));
      }
    }

    function initApp() {
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";
      renderLevelCards();
      renderQuickSelect();
      setMotivationQuote();
      showLevels();
    }

    document.getElementById("btnHome").addEventListener("click", goBack);
    document.getElementById("btnBackLevels").addEventListener("click", showLevels);
    elements.lessonSelect.addEventListener("change", handleQuickSelect);
    elements.lessonSearch.addEventListener("input", event => {
      if (state.currentCourse) renderLessons(state.currentCourse, event.target.value);
    });
    window.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
</html>
