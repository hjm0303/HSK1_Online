<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="documentTitle">HSK 1 • Bài 1 你好</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root{
      --pink:#ff9dcf; --purple:#a98bff; --blue:#8fd8ff; --mint:#9cf2d2; --yellow:#ffe88e;
      --ink:#3f3d56; --panel:rgba(255,255,255,.72); --shadow:0 18px 45px rgba(95,75,150,.18);
    }
    *{box-sizing:border-box}
    body{font-family:"Baloo 2",system-ui,sans-serif;color:var(--ink);background:
      radial-gradient(circle at 10% 10%,#ffd9ef 0 16%,transparent 17%),
      radial-gradient(circle at 90% 0%,#d9f4ff 0 16%,transparent 17%),
      linear-gradient(135deg,#fff7fb,#f4f7ff 52%,#f7fff9);min-height:100vh}
    .cn{font-family:"Noto Sans SC",sans-serif}
    .glass{background:var(--panel);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.75);box-shadow:var(--shadow)}
    .soft{box-shadow:10px 10px 24px rgba(150,130,190,.18),-8px -8px 20px rgba(255,255,255,.9)}
    .btn3d{transform:translateY(0);box-shadow:0 7px 0 rgba(73,61,105,.18);transition:.18s}
    .btn3d:hover{transform:translateY(-2px)}
    .btn3d:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(73,61,105,.18)}
    .tab-btn.active{background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;box-shadow:0 12px 24px rgba(169,139,255,.35)}
    .tab-panel{display:none}.tab-panel.active{display:block}
    .flip-card{perspective:1000px}
    .flip-inner{position:relative;transition:transform .7s;transform-style:preserve-3d}
    .flip-card.flipped .flip-inner{transform:rotateY(180deg)}
    .flip-face{backface-visibility:hidden}
    .flip-back{position:absolute;inset:0;transform:rotateY(180deg)}
    .pulse-ring{animation:pulse 1.2s infinite}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,111,172,.45)}70%{box-shadow:0 0 0 18px rgba(255,111,172,0)}100%{box-shadow:0 0 0 0 rgba(255,111,172,0)}}
    .floaty{animation:floaty 3s ease-in-out infinite}
    @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    .confetti{position:fixed;width:10px;height:16px;top:-20px;z-index:9999;animation:fall 2.2s linear forwards}
    @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
    .chip.selected{outline:4px solid rgba(169,139,255,.28);transform:scale(1.03)}
    .match-item.done{opacity:.45;pointer-events:none;text-decoration:line-through}
    .tone-line{height:90px;background:linear-gradient(#fff,#f8f7ff);border-radius:24px;position:relative;overflow:hidden}
    .tone-line svg{width:100%;height:100%}
    .sticky-nav{position:sticky;top:8px;z-index:30}
    .pastel-card{position:relative;border:2px solid rgba(169,139,255,.20);border-radius:20px;overflow:hidden}
    .pastel-card::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.26),transparent 45%)}
    .subtab-btn{display:inline-flex;align-items:center;gap:.45rem;min-height:42px;border-radius:16px;padding:.65rem 1rem;font-weight:800;background:rgba(255,255,255,.8);border:2px solid rgba(143,216,255,.24);transition:.2s}
    .subtab-btn.active{color:#fff;background:linear-gradient(135deg,#7c6cff,#ff7eb6);box-shadow:0 10px 24px rgba(124,108,255,.28);border-color:transparent;transform:translateY(-1px)}
    .warmup-subpage{display:none}.warmup-subpage.active{display:block}
    .mascot-corner{position:absolute;right:14px;top:10px;font-size:2.2rem;filter:drop-shadow(0 8px 10px rgba(80,60,120,.16));z-index:2}
    .mascot-bounce{animation:mascotBounce .8s ease}
    @keyframes mascotBounce{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-18px) rotate(-8deg)}60%{transform:translateY(-7px) rotate(8deg)}}
    .game-message-pop{animation:gamePop .35s ease}
    @keyframes gamePop{0%{transform:scale(.88);opacity:.2}100%{transform:scale(1);opacity:1}}
    @media(max-width:768px){.sticky-nav{position:static}.desktop-title{display:none}.mascot-corner{font-size:1.8rem}}
  
    /* ===== Modern EdTech Color Palette Override ===== */
    :root{
      --ink:#334155;
      --panel:#FFFFFF;
      --shadow:0 10px 25px -5px rgba(0,0,0,.05);
    }

    body{
      background:#F4F6FB !important;
      color:#334155;
    }

    .glass,
    .pastel-card{
      background:#FFFFFF !important;
      border:1px solid #E2E8F0 !important;
      border-radius:20px !important;
      box-shadow:0 10px 25px -5px rgba(0,0,0,.05) !important;
      backdrop-filter:none !important;
    }

    .pastel-card::after{
      display:none !important;
    }

    header.glass,
    nav.glass{
      background:#FFFFFF !important;
      border:1px solid #E2E8F0 !important;
    }

    .soft{
      box-shadow:0 10px 25px -5px rgba(0,0,0,.05) !important;
    }

    /* Main tabs */
    .tab-btn{
      background:#F1F5F9 !important;
      color:#475569 !important;
      border:1px solid #E2E8F0;
      box-shadow:none !important;
      transition:transform .18s ease, box-shadow .18s ease, background .18s ease, color .18s ease;
    }

    .tab-btn:hover{
      transform:translateY(-2px) scale(1.02);
      background:#E2E8F0 !important;
      box-shadow:0 8px 18px rgba(15,23,42,.08) !important;
    }

    .tab-btn.active{
      background:linear-gradient(135deg,#6366F1,#8B5CF6) !important;
      color:#FFFFFF !important;
      border-color:transparent !important;
      box-shadow:0 10px 22px rgba(99,102,241,.25) !important;
    }

    /* Warm-up subtabs */
    .subtab-btn{
      background:#F1F5F9 !important;
      color:#475569 !important;
      border:1px solid #E2E8F0 !important;
      box-shadow:none !important;
    }

    .subtab-btn:hover{
      transform:translateY(-2px) scale(1.02);
      background:#E2E8F0 !important;
    }

    .subtab-btn.active{
      background:linear-gradient(135deg,#06B6D4,#0EA5E9) !important;
      color:#FFFFFF !important;
      border-color:transparent !important;
      box-shadow:0 10px 22px rgba(14,165,233,.25) !important;
    }

    /* Initial cards */
    button[aria-label^="Phát MP3 thanh mẫu"]{
      background:#FFF1F2 !important;
      border:2px solid #FECDD3 !important;
      color:#9F1239 !important;
      font-weight:700 !important;
      box-shadow:0 8px 18px rgba(159,18,57,.06) !important;
      transition:transform .16s ease, box-shadow .16s ease, background .16s ease, color .16s ease;
    }

    button[aria-label^="Phát MP3 thanh mẫu"] span{
      color:#E11D48 !important;
      font-weight:700;
    }

    button[aria-label^="Phát MP3 thanh mẫu"]:hover{
      background:#FB7185 !important;
      color:#FFFFFF !important;
      box-shadow:0 0 0 4px rgba(251,113,133,.18),0 12px 24px rgba(225,29,72,.20) !important;
      transform:translateY(-2px) scale(1.03);
    }

    button[aria-label^="Phát MP3 thanh mẫu"]:hover span{
      color:#FFFFFF !important;
    }

    button[aria-label^="Phát MP3 thanh mẫu"]:active{
      transform:scale(.95) !important;
      background:#FB7185 !important;
      color:#FFFFFF !important;
      box-shadow:0 0 0 5px rgba(251,113,133,.30),0 0 24px rgba(251,113,133,.45) !important;
    }

    button[aria-label^="Phát MP3 thanh mẫu"]:active span{
      color:#FFFFFF !important;
    }

    /* Final cards */
    button[aria-label^="Phát MP3 vận mẫu"]{
      background:#ECFDF5 !important;
      border:2px solid #A7F3D0 !important;
      color:#065F46 !important;
      font-weight:700 !important;
      box-shadow:0 8px 18px rgba(5,150,105,.06) !important;
      transition:transform .16s ease, box-shadow .16s ease, background .16s ease, color .16s ease;
    }

    button[aria-label^="Phát MP3 vận mẫu"] span{
      color:#059669 !important;
      font-weight:700;
    }

    button[aria-label^="Phát MP3 vận mẫu"]:hover{
      background:#34D399 !important;
      color:#FFFFFF !important;
      box-shadow:0 0 0 4px rgba(52,211,153,.18),0 12px 24px rgba(5,150,105,.20) !important;
      transform:translateY(-2px) scale(1.03);
    }

    button[aria-label^="Phát MP3 vận mẫu"]:hover span{
      color:#FFFFFF !important;
    }

    button[aria-label^="Phát MP3 vận mẫu"]:active{
      transform:scale(.95) !important;
      background:#34D399 !important;
      color:#FFFFFF !important;
      box-shadow:0 0 0 5px rgba(52,211,153,.30),0 0 24px rgba(52,211,153,.45) !important;
    }

    button[aria-label^="Phát MP3 vận mẫu"]:active span{
      color:#FFFFFF !important;
    }

    /* Click glow also applies while JS ring classes are active */
    button[aria-label^="Phát MP3 thanh mẫu"].ring-4{
      background:#FB7185 !important;
      color:#FFFFFF !important;
      box-shadow:0 0 0 5px rgba(251,113,133,.28),0 0 24px rgba(251,113,133,.42) !important;
      transform:scale(.97);
    }

    button[aria-label^="Phát MP3 thanh mẫu"].ring-4 span{
      color:#FFFFFF !important;
    }

    button[aria-label^="Phát MP3 vận mẫu"].ring-4{
      background:#34D399 !important;
      color:#FFFFFF !important;
      box-shadow:0 0 0 5px rgba(52,211,153,.28),0 0 24px rgba(52,211,153,.42) !important;
      transform:scale(.97);
    }

    button[aria-label^="Phát MP3 vận mẫu"].ring-4 span{
      color:#FFFFFF !important;
    }

    /* Cleaner controls and game option buttons */
    select,
    #soundToggle,
    #globalScore,
    .sound-opt{
      border-color:#E2E8F0 !important;
    }

    .sound-opt{
      background:#F8FAFC !important;
      color:#334155 !important;
    }

    .sound-opt:hover{
      background:#EEF2FF !important;
      border-color:#C7D2FE !important;
    }

  
    /* ===== Tab Icon System Upgrade ===== */
    .tab-btn,
    .subtab-btn{
      overflow:hidden;
    }

    .tab-icon-badge,
    .subtab-icon-badge{
      width:30px;
      height:30px;
      min-width:30px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:10px;
      background:rgba(255,255,255,.82);
      border:1px solid rgba(255,255,255,.85);
      box-shadow:0 6px 14px rgba(15,23,42,.10);
      transition:transform .2s ease, box-shadow .2s ease, background .2s ease;
    }

    .tab-icon-badge i,
    .subtab-icon-badge i{
      font-size:20px;
      line-height:1;
      transition:transform .22s cubic-bezier(.2,.9,.2,1.2), filter .22s ease;
    }

    .tab-btn:hover .tab-icon-badge,
    .subtab-btn:hover .subtab-icon-badge{
      transform:translateY(-1px) scale(1.05);
      box-shadow:0 9px 18px rgba(15,23,42,.14);
    }

    .tab-btn.active .tab-icon-badge,
    .subtab-btn.active .subtab-icon-badge{
      background:rgba(255,255,255,.96);
      box-shadow:0 8px 20px rgba(255,255,255,.28),0 6px 16px rgba(15,23,42,.14);
    }

    .tab-btn.active .tab-icon-badge i,
    .subtab-btn.active .subtab-icon-badge i{
      transform:scale(1.15) rotate(-5deg);
      filter:drop-shadow(0 4px 6px rgba(15,23,42,.18));
    }

    .icon-warmup{color:#F97316;filter:drop-shadow(0 3px 4px rgba(249,115,22,.28))}
    .icon-vocab{color:#2563EB;filter:drop-shadow(0 3px 4px rgba(37,99,235,.25))}
    .icon-flash{color:#A855F7;filter:drop-shadow(0 3px 4px rgba(168,85,247,.25))}
    .icon-grammar{color:#14B8A6;filter:drop-shadow(0 3px 4px rgba(20,184,166,.25))}
    .icon-fill{color:#F59E0B;filter:drop-shadow(0 3px 4px rgba(245,158,11,.25))}
    .icon-arrange{color:#EC4899;filter:drop-shadow(0 3px 4px rgba(236,72,153,.25))}
    .icon-match{color:#0EA5E9;filter:drop-shadow(0 3px 4px rgba(14,165,233,.25))}
    .icon-quiz{color:#EAB308;filter:drop-shadow(0 3px 4px rgba(234,179,8,.25))}
    .icon-roleplay{color:#EF4444;filter:drop-shadow(0 3px 4px rgba(239,68,68,.25))}

    .icon-goals{color:#F43F5E;filter:drop-shadow(0 3px 4px rgba(244,63,94,.25))}
    .icon-sounds{color:#8B5CF6;filter:drop-shadow(0 3px 4px rgba(139,92,246,.25))}
    .icon-tones{color:#06B6D4;filter:drop-shadow(0 3px 4px rgba(6,182,212,.25))}
    .icon-game{color:#22C55E;filter:drop-shadow(0 3px 4px rgba(34,197,94,.25))}

    @media(max-width:640px){
      .tab-icon-badge,
      .subtab-icon-badge{
        width:28px;
        height:28px;
        min-width:28px;
      }
      .tab-icon-badge i,
      .subtab-icon-badge i{
        font-size:18px;
      }
    }

  
    /* ===== Workbook Pronunciation Sub-tab ===== */
    .icon-practice{color:#7C3AED;filter:drop-shadow(0 3px 4px rgba(124,58,237,.25))}
    .practice-chip{
      border:1px solid #E2E8F0;
      background:#FFFFFF;
      color:#334155;
      border-radius:14px;
      padding:.7rem .9rem;
      font-weight:800;
      box-shadow:0 6px 16px rgba(15,23,42,.05);
      transition:transform .16s ease,box-shadow .16s ease,background .16s ease,color .16s ease;
    }
    .practice-chip:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(99,102,241,.12);background:#EEF2FF;color:#4F46E5}
    .practice-chip:active{transform:scale(.95);box-shadow:0 0 0 4px rgba(99,102,241,.16)}
    .picture-choice.selected{outline:4px solid rgba(99,102,241,.18);transform:scale(1.02)}
    .picture-choice.done{background:#DCFCE7!important;border-color:#86EFAC!important;color:#166534!important;pointer-events:none}
    .fill-token.correct{background:#D1FAE5!important;border-color:#6EE7B7!important;color:#065F46!important}
    .fill-token.wrong{background:#FFE4E6!important;border-color:#FDA4AF!important;color:#9F1239!important}

  
    /* ===== Pinyin Drill ===== */
    .drill-shell{border:1px solid #E2E8F0;border-radius:20px;background:#FFFFFF;box-shadow:0 10px 25px -5px rgba(0,0,0,.05);overflow:hidden}
    .drill-progress-track{height:10px;border-radius:999px;background:#E2E8F0;overflow:hidden}
    .drill-progress-bar{height:100%;border-radius:999px;background:linear-gradient(90deg,#10B981,#22C55E);transition:width .3s ease}
    .drill-audio-card{min-height:360px;border-radius:20px;background:linear-gradient(145deg,#0EA5E9,#2563EB);color:#FFFFFF;box-shadow:0 18px 35px rgba(37,99,235,.22)}
    .drill-headphone{width:112px;height:112px;border-radius:32px;display:grid;place-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 15px 30px rgba(15,23,42,.18)}
    .drill-play{width:74px;height:74px;border-radius:999px;background:#FFFFFF;color:#2563EB;box-shadow:0 14px 28px rgba(15,23,42,.22);transition:transform .16s ease,box-shadow .16s ease}
    .drill-play:hover{transform:translateY(-2px) scale(1.04)} .drill-play:active{transform:scale(.94);box-shadow:0 0 0 6px rgba(255,255,255,.2)}
    .drill-option{min-height:84px;border-radius:18px;border:2px solid #E2E8F0;background:#FFFFFF;color:#334155;padding:1rem;text-align:left;display:flex;align-items:center;gap:1rem;font-weight:800;transition:transform .16s ease,border-color .16s ease,background .16s ease,box-shadow .16s ease}
    .drill-option:hover{transform:translateY(-2px);border-color:#A5B4FC;box-shadow:0 10px 20px rgba(99,102,241,.10)}
    .drill-option.selected{border-color:#6366F1;background:#EEF2FF;box-shadow:0 0 0 4px rgba(99,102,241,.12)}
    .drill-option.correct{border-color:#22C55E;background:#DCFCE7;color:#166534}
    .drill-option.wrong{border-color:#F43F5E;background:#FFE4E6;color:#9F1239}
    .drill-number{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#F1F5F9;color:#475569;font-weight:900;flex:0 0 auto}
    .drill-option.selected .drill-number{background:#6366F1;color:#FFFFFF}
    .drill-option.correct .drill-number{background:#22C55E;color:#FFFFFF}
    .drill-option.wrong .drill-number{background:#F43F5E;color:#FFFFFF}

  
    /* ===== Vocab Learning Studio: scoped to #vocab only ===== */
    #vocab .vocab-shell{background:#FFFDF5;color:#1E293B;border:1px solid #DDF4EF;border-radius:24px;overflow:hidden;box-shadow:0 18px 45px rgba(15,23,42,.08)}
    #vocab .vocab-topbar{background:linear-gradient(135deg,#FFFDF5,#E6F9F6);border-bottom:1px solid #CFF3EC}
    #vocab .vocab-back,#vocab .vocab-switch{background:#fff;border:1px solid #BFEDE5;color:#0F766E;border-radius:14px;padding:.65rem .9rem;font-weight:900;box-shadow:0 8px 18px rgba(13,148,136,.08)}
    #vocab .vocab-mode-grid{display:grid;grid-template-columns:repeat(1,minmax(0,1fr));gap:16px}
    @media(min-width:720px){#vocab .vocab-mode-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(min-width:1100px){#vocab .vocab-mode-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
    #vocab .vocab-mode-card{position:relative;min-height:220px;border-radius:24px;padding:20px;color:#fff;text-align:left;overflow:hidden;box-shadow:0 18px 34px rgba(15,23,42,.15);transition:transform .18s ease,box-shadow .18s ease}
    #vocab .vocab-mode-card:hover{transform:translateY(-7px) scale(1.02);box-shadow:0 26px 46px rgba(15,23,42,.20)}
    #vocab .vocab-mode-card:active{transform:scale(.97)}
    #vocab .vocab-watermark{position:absolute;right:-6px;bottom:-26px;font-family:"Noto Sans SC";font-size:112px;font-weight:900;opacity:.12}
    #vocab .mode-icon{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);font-size:22px;box-shadow:inset 0 1px rgba(255,255,255,.35)}
    #vocab .panda-stage{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border:1px solid #BFEDE5;border-radius:18px;box-shadow:0 10px 24px rgba(13,148,136,.08)}
    #vocab .panda-avatar{font-size:44px;display:inline-block;filter:drop-shadow(0 8px 10px rgba(15,23,42,.15))}
    #vocab .panda-wave{animation:pandaWave 1.2s ease-in-out infinite}
    #vocab .panda-happy{animation:pandaHappy .75s ease}
    #vocab .panda-oops{animation:pandaOops .7s ease}
    @keyframes pandaWave{0%,100%{transform:rotate(0)}35%{transform:rotate(-10deg) translateY(-4px)}70%{transform:rotate(8deg)}}
    @keyframes pandaHappy{0%,100%{transform:translateY(0) scale(1)}35%{transform:translateY(-18px) rotate(-8deg) scale(1.12)}70%{transform:translateY(-6px) rotate(8deg)}}
    @keyframes pandaOops{0%,100%{transform:rotate(0)}35%{transform:rotate(-9deg)}70%{transform:rotate(9deg)}}
    #vocab .vocab-progress{height:8px;background:#DFF7F2;border-radius:999px;overflow:hidden}
    #vocab .vocab-progress>div{height:100%;background:linear-gradient(90deg,#00B57A,#00D7B0);transition:width .25s ease}
    #vocab .study-card{position:relative;max-width:720px;margin:auto;background:#fff;border:1px solid #CBEFE8;border-radius:28px;box-shadow:0 24px 55px rgba(15,23,42,.11);padding:28px}
    #vocab .study-card::before,#vocab .study-card::after{content:"";position:absolute;inset:10px -10px -10px 10px;border-radius:28px;background:#DDF9F3;z-index:-1}
    #vocab .study-card::after{inset:20px -20px -20px 20px;background:#C8F2EA;z-index:-2}
    #vocab .vocab-input-wrap{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #00E5FF;border-radius:20px;padding:8px 10px;box-shadow:0 0 12px rgba(0,229,255,.6);animation:vocabGlow 1.8s ease-in-out infinite}
    @keyframes vocabGlow{0%,100%{box-shadow:0 0 8px rgba(0,229,255,.35)}50%{box-shadow:0 0 20px rgba(0,229,255,.78)}}
    #vocab .vocab-input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:10px;font-size:18px;font-weight:800;color:#1E293B}
    #vocab .input-tag{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#E6F9F6;color:#0F766E;font-weight:900}
    #vocab .send-answer{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#06B6D4,#0099FF);color:#fff;box-shadow:0 10px 20px rgba(0,153,255,.24)}

    /* ===== Hanzi pronunciation affordance ===== */
    .hanzi-pronounce{
      position:relative;
      cursor:pointer;
    }
    button.hanzi-pronounce::after{
      content:"🔊";
      position:absolute;
      top:4px;
      right:6px;
      font-size:.68rem;
      line-height:1;
      opacity:.72;
      filter:drop-shadow(0 2px 3px rgba(15,23,42,.12));
      pointer-events:none;
    }
    .hanzi-pronounce:hover::after{opacity:1}
    #fill .fill-line.hanzi-pronounce,
    #typing .typing-line.hanzi-pronounce{
      cursor:pointer;
    }

  
    /* ===== Interactive Grammar Hub ===== */

      display:grid;

      padding:10px;
      border-radius:22px;

      gap:7px;
      margin-bottom:8px;

function pinyinAudioUrls(soundName){
  const safeName = encodeURIComponent(soundName);
  return [
    `https://cdn.jsdelivr.net/gh/hugolpz/audio-cmn@master/64k/syllabs/cmn-${safeName}.mp3`,
    `https://cdn.jsdelivr.net/gh/davinfifield/mp3-chinese-pinyin-sound@master/mp3/${safeName}.mp3`,
    `https://raw.githubusercontent.com/davinfifield/mp3-chinese-pinyin-sound/master/mp3/${safeName}.mp3`
  ];
}

function playPinyinAudio(soundName, statusElement=null){
  if(!soundName) return Promise.reject(new Error("Thiếu tên âm thanh."));

  if(currentPinyinAudio){
    currentPinyinAudio.pause();
    currentPinyinAudio.currentTime = 0;
  }

  const urls = pinyinAudioUrls(soundName);
  let sourceIndex = 0;

  return new Promise((resolve,reject)=>{
    const trySource = ()=>{
      if(sourceIndex >= urls.length){
        if(statusElement) statusElement.textContent = "Không tải được MP3. Hãy kiểm tra kết nối Internet.";
        reject(new Error(`Không phát được âm ${soundName}`));
        return;
      }

      const audio = new Audio();
      currentPinyinAudio = audio;
      audio.preload = "auto";
      audio.crossOrigin = "anonymous";
      audio.src = urls[sourceIndex++];

      audio.oncanplaythrough = ()=>{
        if(statusElement) statusElement.textContent = "🔊 Đang phát âm mẫu...";
      };
      audio.onended = ()=>{
        if(statusElement) statusElement.textContent = "";
        resolve();
      };
      audio.onerror = trySource;

      const playPromise = audio.play();
      if(playPromise){
        playPromise.catch(err=>{
          // Lỗi tải nguồn thì thử CDN tiếp theo; lỗi chặn autoplay được báo rõ.
          if(audio.error) trySource();
          else {
            if(statusElement) statusElement.textContent = "Hãy chạm lại nút để cho phép trình duyệt phát âm thanh.";
            reject(err);
          }
        });
      }
    };
    trySource();
  });
}

function getZhVoice(){
  const voices = speechSynthesis.getVoices();

  const preferredNames = [
    "Google 普通话",
    "Microsoft Xiaoxiao Online (Natural) - Chinese (Mainland)",
    "Microsoft Huihui Desktop - Chinese (Simplified)",
    "Ting-Ting",
    "Xiaoxiao",
    "Huihui",
    "Meijia"
  ];

  for(const preferred of preferredNames){
    const match = voices.find(v =>
      String(v.name || "").toLowerCase().includes(preferred.toLowerCase())
    );
    if(match) return match;
  }

  return voices.find(v => /^zh-CN$/i.test(v.lang))
      || voices.find(v => /^zh-TW$/i.test(v.lang))
      || voices.find(v => /^zh/i.test(v.lang))
      || null;
}

  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(String(text));
  utterance.lang = "zh-CN";
  utterance.rate = rate;
  utterance.pitch = 1;

  if(voice) utterance.voice = voice;
  speechSynthesis.speak(utterance);
}

function pronounceHanzi(text){
  if(!("speechSynthesis" in window)) return;

  const hanzi=(String(text||"").match(/[\u3400-\u9FFF]+/g)||[]).join("");
  if(!hanzi) return;

  speechSynthesis.cancel();
  const utterance=new SpeechSynthesisUtterance(hanzi);
  utterance.lang="zh-CN";
  utterance.rate=.9;
  utterance.pitch=1;
  utterance.volume=1;

  const voice=getZhVoice();
  if(voice) utterance.voice=voice;
  speechSynthesis.speak(utterance);
}

  if(document.documentElement.dataset.hanziPronunciationBound==="1") return;
  document.documentElement.dataset.hanziPronunciationBound="1";

  document.addEventListener("click",event=>{
    const target=event.target.closest("[data-hanzi-pronounce]");
    if(!target) return;
    pronounceHanzi(target.dataset.hanziPronounce||target.textContent);
  });
}

function audioTone(type){
  if(!soundOn) return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  const ctx=new AC();
  const now=ctx.currentTime;

  if(type==="ok"){
    [1046.5,1318.5,1568].forEach((freq,index)=>{
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.type="sine";
      osc.frequency.setValueAtTime(freq,now+index*.11);
      gain.gain.setValueAtTime(.0001,now+index*.11);
      gain.gain.exponentialRampToValueAtTime(.18,now+index*.11+.02);
      gain.gain.exponentialRampToValueAtTime(.0001,now+index*.11+.42);
      osc.connect(gain);gain.connect(ctx.destination);
      osc.start(now+index*.11);osc.stop(now+index*.11+.45);
    });
  }else{
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.type="triangle";
    osc.frequency.setValueAtTime(520,now);
    osc.frequency.exponentialRampToValueAtTime(120,now+.34);
    gain.gain.setValueAtTime(.2,now);
    gain.gain.exponentialRampToValueAtTime(.0001,now+.42);
    osc.connect(gain);gain.connect(ctx.destination);
    osc.start(now);osc.stop(now+.44);
  }
}

function toneChartSVG(index){
  const charts = [
    {points:"58,18 282,18", color:"#8b5cf6", caption:"Mức 5 → Mức 5"},
    {points:"58,50 282,18", color:"#ec4899", caption:"Mức 3 → Mức 5"},
    {points:"58,62 156,76 282,34", color:"#06b6d4", caption:"Mức 2 → Mức 1 → Mức 4"},
    {points:"58,18 282,76", color:"#f59e0b", caption:"Mức 5 → Mức 1"}
  ];
  const c = charts[index];
  const grid = [1,2,3,4,5].map((level,i)=>{
    const y = 76 - i*14.5;
    return `<line x1="44" y1="${y}" x2="296" y2="${y}" stroke="#ddd8eb" stroke-width="1" stroke-dasharray="4 5"/>
            <text x="25" y="${y+4}" font-size="12" fill="#756e89">${level}</text>`;
  }).join("");
  const pts = c.points.split(" ");
  const first = pts[0].split(",");
  const last = pts[pts.length-1].split(",");
  return `<svg viewBox="0 0 320 100" class="w-full h-28" role="img" aria-label="${c.caption}">
    <rect x="1" y="1" width="318" height="98" rx="18" fill="rgba(255,255,255,.82)" stroke="rgba(139,92,246,.14)"/>
    ${grid}
    <polyline points="${c.points}" fill="none" stroke="${c.color}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${first[0]}" cy="${first[1]}" r="5" fill="${c.color}"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="5" fill="${c.color}"/>
    <text x="170" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#5f5873">${c.caption}</text>
  </svg>`;
}

function pronunciationEscapeHTML(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function pronunciationToneSVG(contour){
  const values=Array.isArray(contour)&&contour.length?contour:[3];
  const width=240;
  const height=78;
  const paddingX=18;
  const paddingY=10;
  const usableWidth=width-paddingX*2;
  const usableHeight=height-paddingY*2;
  const points=values.map((value,index)=>{
    const x=values.length===1?width/2:paddingX+(usableWidth*index)/(values.length-1);
    const y=paddingY+((5-Number(value))/4)*usableHeight;
    return `${x},${y}`;
  }).join(" ");
  const guides=[1,2,3,4,5].map(level=>{
    const y=paddingY+((5-level)/4)*usableHeight;
    return `<line x1="${paddingX}" y1="${y}" x2="${width-paddingX}" y2="${y}" stroke="#E2E8F0" stroke-width="1"/>`;
  }).join("");
  const shape=values.length===1
    ? `<circle cx="${width/2}" cy="${paddingY+((5-Number(values[0]))/4)*usableHeight}" r="6" fill="#6366F1"/>
       <line x1="${width/2-30}" y1="${paddingY+((5-Number(values[0]))/4)*usableHeight}" x2="${width/2+30}" y2="${paddingY+((5-Number(values[0]))/4)*usableHeight}" stroke="#6366F1" stroke-width="4" stroke-dasharray="6 5" stroke-linecap="round"/>`
    : `<polyline points="${points}" fill="none" stroke="#6366F1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
       ${values.map((value,index)=>{
         const x=values.length===1?width/2:paddingX+(usableWidth*index)/(values.length-1);
         const y=paddingY+((5-Number(value))/4)*usableHeight;
         return `<circle cx="${x}" cy="${y}" r="5" fill="#4F46E5"/>`;
       }).join("")}`;
  return `<svg class="pronunciation-tone-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="Sơ đồ cao độ">
    ${guides}
    ${shape}
  </svg>`;
}

function pronunciationAudioButton(item,kind){
  const tooltip=pronunciationEscapeHTML(item.tooltip);
  const label=pronunciationEscapeHTML(item.pinyin);
  const teachingSound=pronunciationEscapeHTML(item.teachingSound||item.pinyin);
  const meta=kind==="initial"
    ? `<span class="pronunciation-card-meta">${pronunciationEscapeHTML(item.group)}</span><span class="pronunciation-card-note">${pronunciationEscapeHTML(item.aspiration)}</span>`
    : item.nasal
      ? `<span class="pronunciation-card-meta">${pronunciationEscapeHTML(item.nasal)}</span>`
      : "";
  return `<button type="button"
    class="pinyin-audio pronunciation-hover pronunciation-data-card pronunciation-data-card-${kind}"
    data-audio="${pronunciationEscapeHTML(item.audio)}"
    data-hover-tip="${tooltip}"
    aria-label="Phát âm ${label}">
      <span class="pronunciation-card-main">${label}</span>
      <span class="pronunciation-card-sound">${teachingSound}</span>
      ${meta}
    </button>`;
}

function pronunciationRuleExampleButton(example){
  const tooltip=pronunciationEscapeHTML(example.tooltip);
  const label=pronunciationEscapeHTML(example.label||example.hanzi||example.pinyin||"Nghe ví dụ");
  const pinyin=pronunciationEscapeHTML(example.pinyin||example.spokenPinyin||example.writtenPinyin||"");
  if(example.audioType==="pinyin"){
    return `<button type="button"
      class="pinyin-audio pronunciation-hover pronunciation-rule-example"
      data-audio="${pronunciationEscapeHTML(example.audio)}"
      data-hover-tip="${tooltip}">
        <span>${label}</span>
        ${pinyin?`<small>${pinyin}</small>`:""}
      </button>`;
  }
  return `<button type="button"
    class="hanzi-pronounce pronunciation-hover pronunciation-rule-example"
    data-hanzi-pronounce="${pronunciationEscapeHTML(example.audio||example.hanzi||"")}"
    data-hover-tip="${tooltip}">
      ${example.hanzi?`<span class="cn">${pronunciationEscapeHTML(example.hanzi)}</span>`:`<span>${label}</span>`}
      ${example.writtenPinyin&&example.spokenPinyin
        ? `<small>${pronunciationEscapeHTML(example.writtenPinyin)} → ${pronunciationEscapeHTML(example.spokenPinyin)}</small>`
        : pinyin?`<small>${pinyin}</small>`:""}
    </button>`;
}

let STROKE_WRITING_DATA = LESSON_ASSETS[1].STROKE_WRITING_DATA;

function bindStrokeWriting(){
  const root=document.getElementById("flash");
  const board=document.getElementById("strokeBoard");
  if(!root||!board)return;

  const grid=document.getElementById("strokeCharGrid");
  const status=document.getElementById("strokeStatus");
  const mascotIcon=document.getElementById("strokeMascotIcon");
  const mascotText=document.getElementById("strokeMascotText");

  let index=0;
  let writer=null;
  let quizMode=false;

  function playStrokeSFX(type){
    if(!soundOn)return;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    const ctx=new AC(),now=ctx.currentTime,master=ctx.createGain();
    master.gain.setValueAtTime(.58,now);
    master.connect(ctx.destination);

    function note(freq,start,duration,volume=.06,type="sine",endFreq=null){
      const osc=ctx.createOscillator(),gain=ctx.createGain();
      osc.type=type;
      osc.frequency.setValueAtTime(freq,now+start);
      if(endFreq)osc.frequency.exponentialRampToValueAtTime(endFreq,now+start+duration);
      gain.gain.setValueAtTime(.0001,now+start);
      gain.gain.exponentialRampToValueAtTime(volume,now+start+.012);
      gain.gain.exponentialRampToValueAtTime(.0001,now+start+duration);
      osc.connect(gain);gain.connect(master);
      osc.start(now+start);osc.stop(now+start+duration+.02);
    }

    if(type==="ok"){
      [[880,0,.13,.055],[1175,.08,.18,.06],[1568,.17,.22,.055]].forEach(x=>note(x[0],x[1],x[2],x[3]));
    }else if(type==="pop"){
      note(430,0,.09,.045,"sine",760);
    }else{
      note(310,0,.24,.05,"triangle",150);
      note(180,.08,.18,.03,"sine",105);
    }

    setTimeout(()=>{if(ctx.state!=="closed")ctx.close().catch(()=>{})},700);
  }

  function setMascot(state,message){
    if(state==="happy"){
      mascotIcon.textContent="🐼✨";
      mascotText.textContent=message;
    }else if(state==="oops"){
      mascotIcon.textContent="🐼💦";
      mascotText.textContent=message;
    }else{
      mascotIcon.textContent="🐼";
      mascotText.textContent=message;
    }
  }

  function renderButtons(){
    grid.innerHTML=STROKE_WRITING_DATA.map((item,i)=>`
      <button class="stroke-char-btn cn hanzi-pronounce ${i===index?"active":""}" data-stroke-index="${i}" data-hanzi-pronounce="${item.han}" aria-label="Xem và nghe chữ ${item.han}">${item.han}</button>
    `).join("");

    grid.querySelectorAll("[data-stroke-index]").forEach(button=>{
      button.onclick=()=>{
        index=Number(button.dataset.strokeIndex);
        playStrokeSFX("pop");
        loadCharacter();
      };
    });
  }

  function updateInfo(){
    const item=STROKE_WRITING_DATA[index];
    document.getElementById("strokeBigChar").textContent=item.han;
    document.getElementById("strokePinyin").textContent=item.py;
    document.getElementById("strokeMeaning").textContent=item.meaning;
    document.getElementById("strokeHanViet").textContent=item.hanViet;
    document.getElementById("strokeCount").textContent=`${item.strokes} nét`;
    document.getElementById("strokeRadical").textContent=item.radical;
    document.getElementById("strokeMode").textContent=quizMode?"Tập viết":"Xem hoạt họa";
  }

  function createWriter(){
    const item=STROKE_WRITING_DATA[index];
    board.innerHTML="";

    if(!window.HanziWriter){
      status.className="stroke-status bad";
      status.textContent="Không tải được thư viện HanziWriter. Hãy kiểm tra kết nối Internet.";
      setMascot("oops","Panda chưa tải được dữ liệu nét bút.");
      return;
    }

    const size=Math.max(220,Math.min(board.clientWidth||270,board.clientHeight||270));
    writer=HanziWriter.create("strokeBoard",item.han,{
      width:size,
      height:size,
      padding:18,
      strokeColor:"#334155",
      radicalColor:"#EF4444",
      highlightColor:"#6366F1",
      outlineColor:"#CBD5E1",
      drawingColor:"#10B981",
      drawingWidth:5,
      strokeAnimationSpeed:1,
      delayBetweenStrokes:260,
      showOutline:true,
      showCharacter:false
    });

    status.className="stroke-status";
    status.textContent="Bấm “▶️ Xem viết” để chạy thứ tự nét bút.";
  }

  function loadCharacter(){
    quizMode=false;
    renderButtons();
    updateInfo();
    createWriter();
    setMascot("idle",`Panda đã mở chữ ${STROKE_WRITING_DATA[index].han}. Hãy xem đúng thứ tự nét nhé!`);
  }

  document.getElementById("strokeAnimate").onclick=()=>{
    if(!writer)return;
    quizMode=false;
    updateInfo();
    status.className="stroke-status";
    status.textContent="Đang chạy hoạt họa thứ tự nét...";
    setMascot("happy","Panda chỉ nét: Nhìn kỹ hướng đi của từng nét nhé! ✨");
    writer.cancelQuiz();
    writer.animateCharacter({
      onComplete:()=>{
        playStrokeSFX("ok");
        status.className="stroke-status ok";
        status.textContent="✅ Đã hoàn thành thứ tự nét bút.";
      }
    });
  };

  document.getElementById("strokeReset").onclick=()=>{
    if(!writer)return;
    quizMode=false;
    updateInfo();
    writer.cancelQuiz();
    writer.hideCharacter({
      duration:180,
      onComplete:()=>writer.showOutline()
    });
    status.className="stroke-status";
    status.textContent="Đã đặt lại. Bấm “Xem viết” hoặc “Tập viết”.";
    setMascot("idle","Panda đã xóa bảng để bạn bắt đầu lại.");
    playStrokeSFX("pop");
  };

  document.getElementById("strokeQuiz").onclick=()=>{
    if(!writer)return;
    quizMode=true;
    updateInfo();
    status.className="stroke-status";
    status.textContent="✍️ Dùng chuột hoặc ngón tay tô theo đúng thứ tự nét.";
    setMascot("happy","Panda cổ vũ: Bình tĩnh viết từng nét một nhé! 🐾");
    writer.quiz({
      showHintAfterMisses:2,
      highlightOnComplete:true,
      onMistake:()=>{
        playStrokeSFX("bad");
        status.className="stroke-status bad";
        status.textContent="Chưa đúng thứ tự nét, thử lại nhé!";
        setMascot("oops","Panda nhắc: Xem hướng nét gợi ý rồi thử lại nha.");
      },
      onCorrectStroke:()=>{
        playStrokeSFX("pop");
        status.className="stroke-status";
        status.textContent="Đúng nét rồi, tiếp tục nhé!";
      },
      onComplete:()=>{
        playStrokeSFX("ok");
        status.className="stroke-status ok";
        status.textContent="🎉 Hoàn thành bài tập viết!";
        setMascot("happy","Panda reo: Viết chuẩn rồi! Tuyệt vời! 🐼✨");
        lightConfetti();
      }
    });
  };

  window.addEventListener("resize",()=>{
    if(!root.classList.contains("active"))return;
    clearTimeout(bindStrokeWriting.resizeTimer);
    bindStrokeWriting.resizeTimer=setTimeout(createWriter,180);
  });

  renderButtons();
  updateInfo();
  createWriter();
}

let VOCAB_LEARNING_DATA = LESSON_ASSETS[1].VOCAB_LEARNING_DATA;

function bindVocabLearning(){
  const root=document.getElementById("vocab");
  if(!root) return;
  const modeScreen=document.getElementById("vocabModeScreen");
  const studyScreen=document.getElementById("vocabStudyScreen");
  const content=document.getElementById("vocabStudyContent");
  const timerEl=document.getElementById("vocabTimer");
  const progress=document.getElementById("vocabProgressBar");
  const pandaSelect=document.getElementById("vocabPandaSelect");

  let mode=null,index=0,flipped=false,feedback=false,timer=20,timerId=null;
  const isComposingRef={current:false};
  const inputRef={current:null};

  function active(){return root.classList.contains("active")}
  function word(){return VOCAB_LEARNING_DATA[index]}
  function speakWord(rate=.8){speak(word().han,rate)}

  function setPanda(state,text){
    const panda=document.getElementById("vocabHeaderPanda");
    if(!panda) return;
    panda.className="panda-avatar "+(state==="happy"?"panda-happy":state==="oops"?"panda-oops":"panda-wave");
    panda.textContent=state==="oops"?"🐼💦":state==="happy"?"🐼💖":"🐼";
    panda.title=text;
  }

  function heartStars(){
    lightConfetti();
    for(let i=0;i<12;i++){
      const h=document.createElement("div");
      h.className="heart-burst";
      h.textContent=i%2?"💖":"✨";
      h.style.left=(35+Math.random()*30)+"vw";
      h.style.top=(45+Math.random()*20)+"vh";
      h.style.fontSize=(18+Math.random()*16)+"px";
      document.body.appendChild(h);
      setTimeout(()=>h.remove(),1500);
    }
  }

  function resetTimer(){
    clearInterval(timerId);timer=20;if(timerEl)timerEl.textContent=timer;
    timerId=setInterval(()=>{timer=Math.max(0,timer-1);if(timerEl)timerEl.textContent=timer;if(timer===0)clearInterval(timerId)},1000);
  }

  function showModes(){
    clearInterval(timerId);mode=null;modeScreen.classList.remove("hidden");studyScreen.classList.add("hidden");
    if(pandaSelect){pandaSelect.classList.remove("panda-wave");void pandaSelect.offsetWidth;pandaSelect.classList.add("panda-wave")}
  }

  function startMode(nextMode){
    mode=nextMode;index=0;flipped=false;feedback=false;
    modeScreen.classList.add("hidden");studyScreen.classList.remove("hidden");
    renderStudy();resetTimer();
  }

  function nav(delta){
    if(inputRef.current){
      inputRef.current.value="";
    }

    index=(index+delta+VOCAB_LEARNING_DATA.length)%VOCAB_LEARNING_DATA.length;
    flipped=false;
    feedback=false;
    renderStudy();
    resetTimer();

    if(inputRef.current){
      inputRef.current.value="";
      inputRef.current.focus();
    }
  }

  function headerLine(){
    progress.style.width=`${((index+1)/VOCAB_LEARNING_DATA.length)*100}%`;
    const counter=document.getElementById("vocabHeaderCounter");
    const panda=document.getElementById("vocabHeaderPanda");
    if(counter) counter.textContent=`Câu ${index+1}/${VOCAB_LEARNING_DATA.length}`;
    if(panda){
      panda.className="panda-avatar panda-wave";
      panda.textContent="🐼";
    }
    return "";
  }

  function renderStudy(){
    const w=word();
    if(mode==="flashcard"){
      content.innerHTML=headerLine()+`
        <div class="study-card text-center">
          <span class="inline-flex rounded-full bg-emerald-100 px-3 py-1 text-xs font-black text-emerald-700">• ${w.pos}</span>
          ${!flipped?`
            <div class="cn text-5xl md:text-6xl font-black my-3 text-slate-800">${w.han}</div>
            <button id="vocabFlip" class="btn3d rounded-2xl bg-emerald-500 px-6 py-3 text-white font-black"><i class="fa-solid fa-eye"></i> Xem nghĩa</button>
          `:`
            <div class="cn text-5xl font-black mt-3">${w.han}</div><div class="text-xl font-black text-cyan-700 mt-2">${w.py}</div>
            <div class="text-xl mt-2">${w.vi}</div><div class="mt-2 rounded-2xl bg-cyan-50 p-3 cn text-lg">${w.example}</div>
            <button id="vocabSpeak" class="mt-3 rounded-full bg-sky-500 w-12 h-12 text-white text-lg"><i class="fa-solid fa-volume-high"></i></button>
          `}
          <div class="flex items-center justify-center gap-4 mt-4"><button id="vocabPrev" class="vocab-back text-2xl">‹</button><span class="font-black">Câu ${index+1}/${VOCAB_LEARNING_DATA.length}</span><button id="vocabNext" class="vocab-back text-2xl">›</button></div>
        </div>`;
      document.getElementById("vocabFlip")?.addEventListener("click",()=>{flipped=true;renderStudy();speakWord()});
      document.getElementById("vocabSpeak")?.addEventListener("click",()=>speakWord());
      document.getElementById("vocabPrev").onclick=()=>nav(-1);
      document.getElementById("vocabNext").onclick=()=>nav(1);
      return;
    }

    if(feedback){renderFeedback();return}

    const question=mode==="vi-zh"?w.vi:w.han;
    const tag=mode==="zh-vi"?"VN":"字";
    const instruction=mode==="vi-zh"?"Viết chữ Hán tương ứng":mode==="zh-vi"?"Nhập nghĩa tiếng Việt":mode==="zh-zh"?"Viết lại chữ Hán":"Nhập chữ nghe được hoặc nghĩa tiếng Việt";
    content.innerHTML=headerLine()+`
      <div class="study-card text-center">
        <span class="inline-flex rounded-full bg-cyan-100 px-3 py-1 text-xs font-black text-cyan-700">• ${w.pos}</span>
        ${mode==="listen"?`
          <button id="vocabListenOrb" class="listen-orb my-8"><i class="fa-solid fa-volume-high"></i></button>
          <button id="vocabSlow" class="rounded-full bg-slate-100 px-4 py-2 font-black">🐢 Chậm</button>
          <p class="mt-4 text-slate-500">${instruction}</p>
        `:`
          <p class="mt-3 text-xs font-black tracking-widest text-slate-400">${instruction.toUpperCase()}</p>
          <div class="${mode==="vi-zh"?"text-3xl":"cn text-5xl"} font-black my-3">${question}</div>
        `}
        <div class="vocab-input-wrap mt-3">
          <span class="input-tag">${tag}</span>
          <input id="vocabAnswerInput" class="vocab-input" type="text" autocomplete="off" placeholder="${instruction}" data-default-value="">
          <button id="vocabSubmit" class="send-answer"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
        <p class="mt-2 text-xs text-slate-500">Nhấn Enter để kiểm tra</p>
      </div>`;
    inputRef.current=document.getElementById("vocabAnswerInput");
    const submitButton=document.getElementById("vocabSubmit");

    isComposingRef.current=false;

    // Uncontrolled input: không có value binding, không có onChange/state update.
    inputRef.current.addEventListener("compositionstart",()=>{
      isComposingRef.current=true;
    });

    inputRef.current.addEventListener("compositionend",()=>{
      isComposingRef.current=false;
    });

    inputRef.current.addEventListener("keydown",event=>{
      if(event.key!=="Enter") return;

      // Enter dùng để hoàn tất dấu của Unikey/EVKey không được tính là nộp bài.
      if(event.isComposing || event.nativeEvent?.isComposing || isComposingRef.current || event.keyCode===229){
        return;
      }

      event.preventDefault();
      checkAnswer();
    });

    submitButton.onclick=()=>{
      if(!isComposingRef.current){
        checkAnswer();
      }
    };

    inputRef.current.value="";
    inputRef.current.focus();
    document.getElementById("vocabListenOrb")?.addEventListener("click",()=>speakWord());
    document.getElementById("vocabSlow")?.addEventListener("click",()=>speakWord(.58));
    if(mode==="listen")setTimeout(()=>speakWord(),250);
  }

  function normalize(s){return String(s||"").trim().toLowerCase().normalize("NFC").replace(/[.,!?！。]/g,"")}
  function isCorrectAnswer(input){
    const w=word();
    const userClean=normalize(input);

    if(!userClean) return false;

    if(mode==="vi-zh" || mode==="zh-zh"){
      return userClean===normalize(w.han);
    }

    const targetMeaning=String(w.vi||"");
    const targetClean=normalize(targetMeaning);

    const validAnswers=targetMeaning
      .split(/[,;/]|hoặc/gi)
      .map(item=>normalize(item))
      .filter(Boolean);

    const matchesVietnameseMeaning=
      validAnswers.some(answer=>userClean===answer)
      || targetClean.includes(userClean);

    if(mode==="zh-vi"){
      return matchesVietnameseMeaning;
    }

    if(mode==="listen"){
      return userClean===normalize(w.han) || matchesVietnameseMeaning;
    }

    return false;
  }

  function checkAnswer(){
    if(isComposingRef.current) return;
    if(!inputRef.current || feedback) return;

    // Chỉ đọc trực tiếp giá trị DOM khi người dùng chủ động nộp.
    const userText=inputRef.current ? inputRef.current.value : "";
    const correct=isCorrectAnswer(userText);
    feedback={value:userText,correct};

    if(correct){
      audioTone("ok");
      heartStars();
    }else{
      audioTone("bad");
    }

    renderFeedback();
  }

  function renderFeedback(){
    const w=word();
    const entered=feedback.value?.trim()||"{trống}";

              <p class="mt-5 text-xs font-black tracking-widest text-white/75">BẠN ĐÃ NHẬP</p>
              <div class="text-2xl font-black mt-1">${entered}</div>
            </div>
            <span id="vocabPanda" class="panda-avatar panda-happy">🐼💖</span>
          </div>
          <p id="vocabPandaMsg" class="mt-3 font-bold">Đúng rồi! Panda bắn tim cho bạn 💖</p>
          <div class="feedback-divider"></div>
          <div class="grid md:grid-cols-[1fr_auto] items-center gap-5">
            <div>
              <div class="cn text-6xl font-black">${w.han}</div>
              <div class="text-2xl font-black mt-2">${w.py}</div>
              <div class="text-xl mt-2">${w.vi}</div>
            </div>
            <button id="vocabFeedbackSpeak" class="rounded-full bg-white w-16 h-16 text-emerald-600 text-2xl"><i class="fa-solid fa-volume-high"></i></button>
          </div>
          <p class="mt-5 text-white/80">Nhấn Space để phát âm</p>
        </div>
        <div class="feedback-actions text-center mt-3">
          <button id="vocabFeedbackNext" class="vocab-next">Tiếp theo →</button>
          <p class="mt-2 text-sm text-slate-500">hoặc nhấn Enter ↵</p>
        </div>`;
    }else{
      content.innerHTML=headerLine()+`
        <div class="feedback-red">
          <div class="flex items-start justify-between gap-4">
            <div>
              <span class="inline-flex rounded-full bg-white/16 px-3 py-1 text-sm font-black">⊗ CHƯA ĐÚNG</span>
              <p class="mt-5 text-xs font-black tracking-widest text-white/75">BẠN ĐÃ NHẬP</p>
              <div class="text-2xl font-black mt-1">${entered}</div>
            </div>
            <span id="vocabPanda" class="panda-avatar panda-oops">🐼💦</span>
          </div>
          <p id="vocabPandaMsg" class="mt-2 font-bold">Panda hơi ngơ ngác 😅, mình xem đáp án nhé!</p>
          <div class="feedback-divider"></div>

            </div>
            <button id="vocabFeedbackSpeak" class="rounded-full bg-white w-16 h-16 text-rose-600 text-2xl"><i class="fa-solid fa-volume-high"></i></button>
          </div>
          <p class="mt-5 text-white/80">Nhấn Space để phát âm</p>
        </div>
        <div class="feedback-actions text-center mt-3">
          <button id="vocabFeedbackNext" class="vocab-next">Tiếp theo →</button>
          <p class="mt-2 text-sm text-slate-500">hoặc nhấn Enter ↵</p>
        </div>`;
    }

    document.getElementById("vocabFeedbackSpeak").onclick=()=>speakWord();
    document.getElementById("vocabFeedbackNext").onclick=()=>nav(1);
  }

  root.querySelectorAll("[data-vocab-mode]").forEach(b=>b.onclick=()=>startMode(b.dataset.vocabMode));
  root.querySelectorAll("[data-vocab-back]").forEach(b=>b.onclick=()=>showModes());
  document.getElementById("vocabStudyBack").onclick=showModes;
  document.getElementById("vocabSwitchMode").onclick=showModes;

  document.addEventListener("keydown",e=>{
    const activeTag=document.activeElement?.tagName;
    if(activeTag==="INPUT" || activeTag==="TEXTAREA"){
      return; // Không can thiệp Space, Enter hoặc Arrow khi người dùng đang gõ.
    }

    if(!active() || studyScreen.classList.contains("hidden")) return;

    if(e.code==="Space"){
      e.preventDefault();
      speakWord();
      return;
    }

    if(mode==="flashcard"){
      if(e.key==="ArrowLeft"){
        e.preventDefault();
        nav(-1);
      }else if(e.key==="ArrowRight"){
        e.preventDefault();
        nav(1);
      }
      return;
    }

    if(e.key==="Enter"){
      // Khi đang ở màn hình kết quả, Enter lần hai mới chuyển câu.
      // Việc nộp câu đầu tiên được xử lý cục bộ ngay trên input để tương thích IME.
      if(feedback){
        e.preventDefault();
        nav(1);
      }
    }
  });
}


let WORKBOOK_CHINESE_AUDIO_MAP = LESSON_ASSETS[1].WORKBOOK_CHINESE_AUDIO_MAP;

function playWorkbookChineseAudio(pinyinText){
  if(!("speechSynthesis" in window)) return;

  const normalized = String(pinyinText).trim().normalize("NFC");
  const chineseText = WORKBOOK_CHINESE_AUDIO_MAP[normalized] || normalized;

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(chineseText);
  utterance.lang = "zh-CN";
  utterance.rate = 0.9;
  utterance.pitch = 1;
  utterance.volume = 1;

  const voice = getZhVoice();
  if(voice) utterance.voice = voice;

  speechSynthesis.speak(utterance);
}


let PINYIN_DRILL_QUESTIONS = LESSON_ASSETS[1].PINYIN_DRILL_QUESTIONS;

function bindPinyinDrill(){
  const root=document.getElementById("pinyinDrill");
  if(!root) return;

  const currentEl=document.getElementById("drillCurrent");
  const totalEl=document.getElementById("drillTotal");
  const progressEl=document.getElementById("drillProgress");
  const optionsEl=document.getElementById("drillOptions");
  const feedbackEl=document.getElementById("drillFeedback");
  const playBtn=document.getElementById("drillPlay");

  let index=0;
  let answered=false;
  let autoAdvanceTimer=null;

  totalEl.textContent=PINYIN_DRILL_QUESTIONS.length;

  function speakQuestion(){
    const question=PINYIN_DRILL_QUESTIONS[index];
    if(!question) return;

    speechSynthesis.cancel();
    const utterance=new SpeechSynthesisUtterance(question.audio);
    utterance.lang="zh-CN";
    utterance.rate=.9;
    utterance.pitch=1;
    utterance.volume=1;

    const voice=getZhVoice();
    if(voice) utterance.voice=voice;

    speechSynthesis.speak(utterance);
  }

  function renderQuestion(){
    clearTimeout(autoAdvanceTimer);
    answered=false;

    const question=PINYIN_DRILL_QUESTIONS[index];
    currentEl.textContent=index+1;
    progressEl.style.width=`${((index+1)/PINYIN_DRILL_QUESTIONS.length)*100}%`;
    feedbackEl.textContent="Hãy nghe kỹ và chọn một đáp án.";

    optionsEl.innerHTML=question.options.map((option,i)=>`
      <button class="drill-option" data-index="${i}">
        <span class="drill-number">${i+1}</span>
        <span class="text-xl">${option}</span>
      </button>`).join("");

    optionsEl.querySelectorAll(".drill-option").forEach(button=>{
      button.onclick=()=>checkAnswer(Number(button.dataset.index));
    });

    // Chỉ phát âm khi người dùng chủ động bấm nút Nghe.
  }

  function checkAnswer(selectedIndex){
    if(answered) return;
    answered=true;

    const question=PINYIN_DRILL_QUESTIONS[index];
    const isCorrect=question.options[selectedIndex]===question.answer;
    const buttons=[...optionsEl.querySelectorAll(".drill-option")];

    buttons.forEach((button,i)=>{
      const optionValue=question.options[i];
      if(optionValue===question.answer){
        button.classList.add("correct");
      }else if(i===selectedIndex){
        button.classList.add("wrong");
      }
      button.disabled=true;
    });

    if(isCorrect){
      audioTone("ok");
      feedbackEl.textContent=`✨ Chính xác! Đáp án là ${question.answer}.`;
      lightConfetti();
    }else{
      audioTone("bad");
      feedbackEl.textContent=`Chưa đúng. Đáp án đúng là ${question.answer}.`;
    }

    autoAdvanceTimer=setTimeout(()=>{
      nextQuestion();
    },1000);
  }

  function nextQuestion(){
    clearTimeout(autoAdvanceTimer);
    index=(index+1)%PINYIN_DRILL_QUESTIONS.length;
    renderQuestion();
  }

  playBtn.onclick=speakQuestion;

  document.addEventListener("keydown",event=>{
    const activeTag=document.activeElement?.tagName;
    if(activeTag==="INPUT" || activeTag==="TEXTAREA"){
      return; // Không can thiệp bàn phím khi con trỏ đang ở ô nhập liệu.
    }

    const page=root.closest('[data-warmup-page="practice"]');
    if(!page || !page.classList.contains("active")) return;

    if(["1","2","3","4"].includes(event.key)){
      event.preventDefault();
      checkAnswer(Number(event.key)-1);
    }else if(event.key==="Enter" && answered){
      event.preventDefault();
      nextQuestion();
    }
  });

  renderQuestion();
}

function lightConfetti(){
  const colors=["#6366F1","#06B6D4","#34D399","#FB7185","#FBBF24"];
  for(let i=0;i<28;i++){
    const piece=document.createElement("div");
    piece.className="confetti";
    piece.style.left=(25+Math.random()*50)+"vw";
    piece.style.background=colors[i%colors.length];
    piece.style.width="7px";
    piece.style.height="10px";
    piece.style.animationDuration=(1.2+Math.random()*.7)+"s";
    document.body.appendChild(piece);
    setTimeout(()=>piece.remove(),2200);
  }
}

function bindSoundGame(){
  let target="";
  let gameScore=0;
  let streak=0;
  let locked=false;
  let autoNextTimer=null;

  const opts=document.getElementById("soundGameOptions");
  const status=document.getElementById("soundGameResult");
  const scoreEl=document.getElementById("soundGameScore");
  const streakEl=document.getElementById("soundGameStreak");
  const playBtn=document.getElementById("playSoundGame");
  const mascot=document.getElementById("gameMascot");
  const mascotText=document.getElementById("gameMascotText");

  const pronunciationOf = symbol =>
    INITIAL_PRONUNCIATION[symbol]
    || FINAL_PRONUNCIATION[symbol]
    || symbol;

  const audioNameOf = symbol =>
    INITIAL_AUDIO_MAP[symbol]
    || FINAL_AUDIO_MAP[symbol]
    || symbol;

  function shuffle(items){
    const arr=[...items];
    for(let i=arr.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }

  function updateStats(){
    if(scoreEl) scoreEl.textContent=gameScore;
    if(streakEl) streakEl.textContent=streak;
  }

  function playCurrentQuestion(){
    if(!target) return;

    status.textContent="🔊 Đang phát âm MP3...";
    playPinyinAudio(audioNameOf(target),status).catch(()=>{
      status.textContent="Không tải được âm thanh. Hãy bấm Nghe lại.";
    });
  }

  function nextQuestion(){
    clearTimeout(autoNextTimer);
    locked=false;
    status.textContent="";
    if(mascot){mascot.textContent="🐼";mascot.classList.remove("mascot-bounce");}
    if(mascotText) mascotText.textContent="";

    const pool=currentLessonId===1?[...currentLesson.initials,...currentLesson.finals]:["zh","ch","sh","r","z","c","s","ou","an","en","ang"];

    // Chọn ngẫu nhiên một âm mục tiêu mới.
    target=pool[Math.floor(Math.random()*pool.length)];

    // Chọn đúng 3 đáp án gây nhiễu khác mục tiêu.
    const distractors=shuffle(pool.filter(item=>item!==target)).slice(0,3);

    // Trộn vị trí của 4 đáp án.
    const choices=shuffle([target,...distractors]);

    opts.innerHTML=choices.map(choice=>`
      <button
        class="sound-opt btn3d bg-white transition"
        data-value="${choice}">
        ${choice}
      </button>
    `).join("");

    opts.querySelectorAll(".sound-opt").forEach(button=>{
      button.onclick=()=>{
        if(locked) return;

        if(button.dataset.value===target){
          locked=true;
          gameScore+=5;
          streak+=1;
          addScore(5);
          updateStats();

          button.classList.remove("bg-white");
          button.classList.add("bg-emerald-200","ring-4","ring-emerald-300");
          status.textContent=`✨ Chính xác! ${target} đọc là ${pronunciationOf(target)}.`;
          if(mascot){
            mascot.textContent="🐼";
            mascot.classList.remove("mascot-bounce");
            void mascot.offsetWidth;
            mascot.classList.add("mascot-bounce");
          }
          if(mascotText){
            mascotText.textContent="🐼 Đỉnh quá!";
            mascotText.classList.remove("game-message-pop");
            void mascotText.offsetWidth;
            mascotText.classList.add("game-message-pop");
          }
          audioTone("ok");

          opts.querySelectorAll(".sound-opt").forEach(item=>{
            item.disabled=true;
          });

          // Sau 1 giây tạo câu mới nhưng không tự phát âm.
          autoNextTimer=setTimeout(()=>{
            nextQuestion();
          },1000);
        }else{
          streak=0;
          updateStats();

          button.classList.remove("bg-white");
          button.classList.add("bg-rose-200","ring-4","ring-rose-300");
          status.textContent="Chưa đúng, hãy nghe lại và thử tiếp nhé!";
          if(mascot){
            mascot.textContent="🦊";
            mascot.classList.remove("mascot-bounce");
            void mascot.offsetWidth;
            mascot.classList.add("mascot-bounce");
          }
          if(mascotText){
            mascotText.textContent="🦊 Thử lại nào!";
            mascotText.classList.remove("game-message-pop");
            void mascotText.offsetWidth;
            mascotText.classList.add("game-message-pop");
          }
          audioTone("bad");

          setTimeout(()=>{
            button.classList.remove("bg-rose-200","ring-4","ring-rose-300");
            button.classList.add("bg-white");
          },650);
        }
      };
    });

    // Không tự phát âm khi khởi tạo hoặc chuyển câu.
  }

  if(playBtn){
    playBtn.onclick=()=>{
      playCurrentQuestion();
    };
  }

  updateStats();
  nextQuestion();
}
function bindFill(){
  const stage=document.getElementById("fillQuestionStage");
  if(!stage) return;

  const petIcon=document.getElementById("fillPetIcon");
  const petText=document.getElementById("fillPetText");
  const progress=document.getElementById("fillProgressBar");
  const counter=document.getElementById("fillCounter");
  const meta=currentLessonId===1?[
    {translation:"A: Xin chào! B: Xin chào!",pinyin:"nǐ hǎo",meaning:"xin chào / chào bạn"},
    {translation:"A: Xin lỗi! B: Không sao!",pinyin:"méi guānxi",meaning:"không sao / không có gì"},
    {translation:"Em chào cô giáo: Xin chào cô ạ!",pinyin:"nín hǎo",meaning:"xin chào kính trọng / chào cô"},
    {translation:"Cô giáo chào cả lớp: Chào các em!",pinyin:"nǐmen hǎo",meaning:"chào các bạn / chào mọi người / chào các em"}
  ]:[
    {translation:"A: Cảm ơn bạn! B: Không có gì!",pinyin:"xièxie nǐ",meaning:"cảm ơn bạn"},
    {translation:"A: Cảm ơn! B: Không có gì!",pinyin:"bú kèqi",meaning:"không có gì / đừng khách khí"},
    {translation:"A: Tạm biệt! B: Tạm biệt!",pinyin:"zàijiàn",meaning:"tạm biệt"},
    {translation:"Từ mang nghĩa 'không'.",pinyin:"bù",meaning:"không"}
  ];  let index=0,isSubmitted=false,streak=0;

  function playGameSFX(correct,streak=0){
    if(!soundOn) return;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    const ctx=new AC(),now=ctx.currentTime,master=ctx.createGain();
    master.gain.setValueAtTime(.72,now);master.connect(ctx.destination);
    function note(freq,start,duration,volume=.1,type="sine",endFreq=null){
      const osc=ctx.createOscillator(),gain=ctx.createGain();
      osc.type=type;osc.frequency.setValueAtTime(freq,now+start);
      if(endFreq)osc.frequency.exponentialRampToValueAtTime(endFreq,now+start+duration);
      gain.gain.setValueAtTime(.0001,now+start);
      gain.gain.exponentialRampToValueAtTime(volume,now+start+.012);
      gain.gain.exponentialRampToValueAtTime(.0001,now+start+duration);
      osc.connect(gain);gain.connect(master);osc.start(now+start);osc.stop(now+start+duration+.02);
    }
    const sparkle=start=>[1760,2217,2637].forEach((f,i)=>note(f,start+i*.055,.19,.035));
    if(correct){
      [[659,0,.18,.085],[880,.08,.2,.09],[1175,.16,.24,.095],[1568,.25,.32,.08]].forEach(x=>note(x[0],x[1],x[2],x[3]));
      sparkle(.12);
      if(streak>=2){[0,.09,.18].forEach((o,i)=>{note(190+35*i,.42+o,.1,.045,"triangle",110+20*i);note(980+170*i,.44+o,.14,.03)});sparkle(.48)}
    }else{
      note(520,0,.13,.055,"sine",650);note(690,.11,.12,.045,"sine",780);note(310,.24,.3,.065,"triangle",150);note(180,.27,.22,.038,"sine",105);
    }
    setTimeout(()=>{if(ctx.state!=="closed")ctx.close().catch(()=>{})},1100);

function bindTyping(){
  const stage=document.getElementById("typingQuestionStage");
  if(!stage)return;
  const petBox=document.getElementById("typingPet"),petIcon=document.getElementById("typingPetIcon"),petText=document.getElementById("typingPetText");
  const progress=document.getElementById("typingProgressBar"),counter=document.getElementById("typingCounter");
  const meta=[
    {translation:"A: Cảm ơn bạn! B: Không có gì!",pinyin:"xièxie nǐ",meaning:"cảm ơn bạn"},
    {translation:"A: Cảm ơn! B: Không có gì!",pinyin:"bú kèqi",meaning:"không có gì / đừng khách khí"},
    {translation:"A: Tạm biệt! B: Tạm biệt!",pinyin:"zàijiàn",meaning:"tạm biệt"},
    {translation:"Từ mang nghĩa 'không'.",pinyin:"bù",meaning:"không"}
  ];  let index=0,isSubmitted=false,streak=0;
  const inputRef={current:null},composingRef={current:false};

  function playGameSFX(correct,streak=0){
    if(!soundOn) return;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    const ctx=new AC(),now=ctx.currentTime,master=ctx.createGain();
    master.gain.setValueAtTime(.72,now);master.connect(ctx.destination);
    function note(freq,start,duration,volume=.1,type="sine",endFreq=null){
      const osc=ctx.createOscillator(),gain=ctx.createGain();
      osc.type=type;osc.frequency.setValueAtTime(freq,now+start);
      if(endFreq)osc.frequency.exponentialRampToValueAtTime(endFreq,now+start+duration);
      gain.gain.setValueAtTime(.0001,now+start);
      gain.gain.exponentialRampToValueAtTime(volume,now+start+.012);
      gain.gain.exponentialRampToValueAtTime(.0001,now+start+duration);
      osc.connect(gain);gain.connect(master);osc.start(now+start);osc.stop(now+start+duration+.02);
    }
    const sparkle=start=>[1760,2217,2637].forEach((f,i)=>note(f,start+i*.055,.19,.035));
    if(correct){
      [[659,0,.18,.085],[880,.08,.2,.09],[1175,.16,.24,.095],[1568,.25,.32,.08]].forEach(x=>note(x[0],x[1],x[2],x[3]));
      sparkle(.12);
      if(streak>=2){[0,.09,.18].forEach((o,i)=>{note(190+35*i,.42+o,.1,.045,"triangle",110+20*i);note(980+170*i,.44+o,.14,.03)});sparkle(.48)}
    }else{
      note(520,0,.13,.055,"sine",650);note(690,.11,.12,.045,"sine",780);note(310,.24,.3,.065,"triangle",150);note(180,.27,.22,.038,"sine",105);
    }
    setTimeout(()=>{if(ctx.state!=="closed")ctx.close().catch(()=>{})},1100);
  }

  const norm=v=>String(v||"").trim().toLowerCase().normalize("NFC").replace(/\s+/g,"");
  const pinyin=v=>String(v||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ü/g,"u").replace(/\s+/g,"");
  const meanings=v=>String(v||"").split(/[,;/]|hoặc/gi).map(x=>x.trim().toLowerCase().normalize("NFC")).filter(Boolean);
  function splitDialogue(text){
    const m=String(text).match(/^A:\s*(.*?)\s*B:\s*(.*)$/);
    return m?[{role:"A",text:m[1],cls:"typing-line-a"},{role:"B",text:m[2],cls:"typing-line-b"}]:[{role:"",text:String(text),cls:"typing-line-a"}];
  }
  function setPet(state,text){
    petBox.classList.remove("correct","wrong");
    if(state==="ok"){petBox.classList.add("correct");petIcon.textContent="😻💖"}
    else if(state==="bad"){petBox.classList.add("wrong");petIcon.textContent="😿"}
    else petIcon.textContent="🐼";
    petText.textContent=text;
  }
  function renderQuestion(){
    isSubmitted=false;composingRef.current=false;
    const q=currentLesson.fillExercises[index],m=meta[index],lines=splitDialogue(q.q);
    counter.textContent=`Câu ${index+1}/${currentLesson.fillExercises.length}`;
    progress.style.width=`${((index+1)/currentLesson.fillExercises.length)*100}%`;
    setPet("idle","Gõ chữ Hán, Pinyin hoặc nghĩa Tiếng Việt đều được nhé! ⌨️");
    stage.innerHTML=`<div class="typing-card">
      ${lines.map(x=>`<div class="typing-line ${x.cls} hanzi-pronounce" data-hanzi-pronounce="${x.text}">${x.role?`<span class="mr-2">${x.role}:</span>`:""}<span class="cn">${x.text}</span></div>`).join("")}
      <div class="typing-translation">${m.translation}</div>
      <div class="typing-input-row"><span class="input-tag">字/VN</span><input id="typingInput" class="typing-input" type="text" autocomplete="off" placeholder="Gõ chữ Hán, Pinyin hoặc nghĩa Tiếng Việt..."><button id="typingSubmit" class="typing-submit"><i class="fa-solid fa-paper-plane"></i></button></div>
      <div id="typingResult" class="typing-result"></div>
      <div class="typing-help">Enter lần 1 để kiểm tra · Enter lần 2 để sang câu mới.</div>
    </div>`;
    inputRef.current=document.getElementById("typingInput");
    const submit=document.getElementById("typingSubmit");
    inputRef.current.value="";inputRef.current.focus();
    inputRef.current.addEventListener("compositionstart",()=>composingRef.current=true);
    inputRef.current.addEventListener("compositionend",()=>composingRef.current=false);
    inputRef.current.addEventListener("keydown",e=>{
      if(e.key!=="Enter")return;
      if(e.isComposing||composingRef.current||e.keyCode===229)return;

      e.preventDefault();
      e.stopPropagation();

      if(isSubmitted){
        nextQuestion();
      }else{
        submitAnswer();
      }
    });
    submit.onclick=()=>{if(!composingRef.current&&!isSubmitted)submitAnswer()};
  }
  function validate(value){
    const q=currentLesson.fillExercises[index],m=meta[index];
    const vn=String(value||"").trim().toLowerCase().normalize("NFC"),validVN=meanings(m.meaning);
    return norm(value)!==""&&(norm(value)===norm(q.answer)||pinyin(value)===pinyin(m.pinyin)||validVN.includes(vn)||validVN.some(x=>x.includes(vn)));
  }
  function submitAnswer(){
    if(isSubmitted||composingRef.current||!inputRef.current)return;
    isSubmitted=true;
    const q=currentLesson.fillExercises[index],m=meta[index],correct=validate(inputRef.current.value);
    const row=stage.querySelector(".typing-input-row"),result=document.getElementById("typingResult");
    inputRef.current.disabled=true;document.getElementById("typingSubmit").disabled=true;
    if(correct){
      streak++;playGameSFX(true,streak);addScore(10);row.classList.add("ok");
      setPet("ok",streak>=2?`🔥 COMBO ${streak} CÂU ĐÚNG LIÊN TIẾP! 🔥`:"Chính xác rồi! Quá đỉnh luôn! 😻✨");
      result.className="typing-result ok";result.innerHTML=`✅ <span class="cn">${q.answer}</span> · ${m.pinyin} · ${m.meaning}`;lightConfetti();
    }else{
      streak=0;playGameSFX(false);row.classList.add("bad");
      setPet("bad","Hơi suýt soát tí, xem đáp án chuẩn bên dưới nhé! 😿");
      result.className="typing-result bad";result.innerHTML=`❌ Đáp án chuẩn: <span class="cn">${q.answer}</span> · ${m.pinyin} · ${m.meaning}`;
    }
  }
  function nextQuestion(){
    if(!isSubmitted)return;

    if(inputRef.current){
      inputRef.current.value="";
    }

    index=(index+1)%currentLesson.fillExercises.length;
    renderQuestion();

    if(inputRef.current){
      inputRef.current.value="";
      inputRef.current.focus();
      requestAnimationFrame(()=>{
        if(inputRef.current) inputRef.current.focus();
      });
    }
  }

  document.addEventListener("keydown",event=>{
    if(!document.getElementById("typing")?.classList.contains("active"))return;
    if(event.key!=="Enter")return;

    // Không can thiệp phím Enter đang được Unikey/IME dùng để hoàn tất dấu.
    if(event.isComposing||composingRef.current||event.keyCode===229)return;

    // Khi đã hiện kết quả, Enter ở bất kỳ vị trí nào đều chuyển câu.
    if(isSubmitted){
      event.preventDefault();
      handleTypingNextQuestion();
    }
  });

  function handleTypingNextQuestion(){
    nextQuestion();
  }

  renderQuestion();
}

    const ctx=new AC();
    const now=ctx.currentTime;
    const master=ctx.createGain();
    master.gain.setValueAtTime(.7,now);
    master.connect(ctx.destination);

    function note(freq,start,duration,volume=.08,type="sine",endFreq=null){
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.type=type;
      osc.frequency.setValueAtTime(freq,now+start);
      if(endFreq)osc.frequency.exponentialRampToValueAtTime(endFreq,now+start+duration);
      gain.gain.setValueAtTime(.0001,now+start);
      gain.gain.exponentialRampToValueAtTime(volume,now+start+.012);
      gain.gain.exponentialRampToValueAtTime(.0001,now+start+duration);
      osc.connect(gain);
      gain.connect(master);
      osc.start(now+start);
      osc.stop(now+start+duration+.02);
    }

    if(victory){
      [[523,0,.18,.08],[659,.08,.2,.085],[784,.16,.22,.09],[1047,.26,.3,.095],[1319,.38,.34,.08]].forEach(x=>note(x[0],x[1],x[2],x[3]));
      [1760,2217,2637].forEach((f,i)=>note(f,.22+i*.06,.2,.035));
    }else if(correct){
      [[880,0,.16,.075],[1175,.08,.2,.08],[1568,.18,.25,.075]].forEach(x=>note(x[0],x[1],x[2],x[3]));
      [1900,2350].forEach((f,i)=>note(f,.13+i*.06,.17,.03));
    }else{
      note(520,0,.13,.05,"sine",650);
      note(310,.14,.28,.06,"triangle",150);
      note(180,.2,.2,.035,"sine",105);
    }

    setTimeout(()=>{if(ctx.state!=="closed")ctx.close().catch(()=>{})},1100);
  }

  function setPet(state,message){
    petBox.classList.remove("correct","wrong","win");
    petIcon.classList.remove("pet-happy","pet-sad");

    if(state==="correct"){
      petBox.classList.add("correct");
      petIcon.textContent="😻✨";
      petIcon.classList.add("pet-happy");
    }else if(state==="wrong"){
      petBox.classList.add("wrong");
      petIcon.textContent="😿";
      petIcon.classList.add("pet-sad");
    }else if(state==="win"){
      petBox.classList.add("win");
      petIcon.textContent="😻🎉";
      petIcon.classList.add("pet-happy");
    }else{
      petIcon.textContent="🐱";
    }

    petText.textContent=message;
  }

  function shuffled(items){
    return items
      .map(item=>({item,sort:Math.random()}))
      .sort((a,b)=>a.sort-b.sort)
      .map(entry=>entry.item);
  }

  function renderGame(){
    selectedLeft=null;
    matchedKeys=new Set();
    locked=false;

    const pairs=games[mode];
    const rightItems=shuffled(pairs);

    progress.textContent=`🎯 Tiến độ: 0/${pairs.length} cặp`;
    footer.className="match-footer";
    footer.textContent="Ghép đủ 5 cặp để hoàn thành mini-game.";
    setPet("idle","Chọn một thẻ bên trái rồi ghép với thẻ đúng bên phải nhé! 🐾");

    stage.innerHTML=`
      <div class="match-board">
        <div class="match-column">
          ${pairs.map(pair=>`<button class="match-card match-left cn hanzi-pronounce" data-key="${pair.key}" data-hanzi-pronounce="${pair.left}">${pair.left}</button>`).join("")}
        </div>
        <div class="match-column">
          ${rightItems.map(pair=>`<button class="match-card match-right" data-key="${pair.key}">${pair.right}</button>`).join("")}
        </div>
      </div>`;

    stage.querySelectorAll(".match-left").forEach(button=>{
      button.onclick=()=>selectLeft(button);
    });

    stage.querySelectorAll(".match-right").forEach(button=>{
      button.onclick=()=>selectRight(button);
    });
  }

  function selectLeft(button){
    if(locked||button.classList.contains("matched"))return;

    stage.querySelectorAll(".match-left").forEach(item=>item.classList.remove("selected"));
    selectedLeft=button;
    button.classList.add("selected");
  }

  function selectRight(button){
    if(locked||button.classList.contains("matched")||!selectedLeft)return;

    const left=selectedLeft;
    const correct=left.dataset.key===button.dataset.key;

    if(correct){
      matchedKeys.add(left.dataset.key);
      left.classList.remove("selected");
      left.classList.add("matched");
      button.classList.add("matched");
      selectedLeft=null;

      addScore(8);
      playMatchSFX(true);
      setPet("correct","🐱 Mèo reo: Chuẩn đét! Ghép thêm cặp nữa nào! 😻✨");
      progress.textContent=`🎯 Tiến độ: ${matchedKeys.size}/${games[mode].length} cặp`;

      if(matchedKeys.size===games[mode].length){
        completeGame();
      }
    }else{
      locked=true;
      left.classList.add("wrong");
      button.classList.add("wrong");
      playMatchSFX(false);
      setPet("wrong","🐱 Mèo nhắc: Chưa đúng rồi, thử lại cặp khác nhé! 🐾");

      setTimeout(()=>{
        left.classList.remove("wrong","selected");
        button.classList.remove("wrong");
        selectedLeft=null;
        locked=false;
      },800);
    }
  }

  function completeGame(){
    locked=true;
    playMatchSFX(true,true);
    setPet("win","🎉 Mèo nhảy múa: Hoàn thành 5/5 cặp rồi! Tuyệt vời! 😻🎊");
    footer.className="match-footer win";
    footer.textContent="🏆 Hoàn thành! Chọn sub-tab còn lại để tiếp tục thử thách.";
    lightConfetti();
    setTimeout(()=>confetti(),180);
  }

  document.querySelectorAll("[data-match-mode]").forEach(button=>{
    button.onclick=()=>{
      if(button.dataset.matchMode===mode)return;
      mode=button.dataset.matchMode;
      document.querySelectorAll("[data-match-mode]").forEach(item=>item.classList.remove("active"));
      button.classList.add("active");
      renderGame();
    };
  });

  renderGame();
}

function normalizePinyinForTip(value){
  return String(value||"")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/ǖ|ǘ|ǚ|ǜ/g,"ü")
    .trim();
}

function pronunciationHoverTip(element){
  const explicit=element.dataset.hoverTip;
  if(explicit) return explicit;

  const hanzi=element.dataset.hanziPronounce;
  if(hanzi && PRONUNCIATION_HOVER_TIPS[hanzi]){
    return PRONUNCIATION_HOVER_TIPS[hanzi];
  }

  const raw=String(element.dataset.text || element.textContent || "").trim();
  if(PRONUNCIATION_HOVER_TIPS[raw]) return PRONUNCIATION_HOVER_TIPS[raw];

  const firstLine=raw.split(/\s+/)[0];
  if(PRONUNCIATION_HOVER_TIPS[firstLine]) return PRONUNCIATION_HOVER_TIPS[firstLine];

  const normalized=normalizePinyinForTip(firstLine);
  if(PRONUNCIATION_HOVER_TIPS[normalized]) return PRONUNCIATION_HOVER_TIPS[normalized];

  const initialKeys=["zh","ch","sh","b","p","m","f","d","t","n","l","g","k","h","j","q","x","r","z","c","s"];
  const matchedInitial=initialKeys.find(key=>normalized.toLowerCase().startsWith(key));
  if(matchedInitial && PRONUNCIATION_HOVER_TIPS[matchedInitial]){
    return `${PRONUNCIATION_HOVER_TIPS[matchedInitial]} Đọc liền cả âm “${firstLine}” và giữ đúng thanh điệu.`;
  }

  if(/[\u3400-\u9FFF]/.test(raw)){
    return "Nghe âm mẫu, nhìn Pinyin đi kèm và lặp lại chậm 2–3 lần.";
  }

  return `Đọc liền “${firstLine}”, không tách rời các chữ cái và giữ đúng dấu thanh.`;
}

function bindPronunciationHoverOnce(){
  if(document.documentElement.dataset.pronunciationHoverBound==="1") return;
  document.documentElement.dataset.pronunciationHoverBound="1";

  const tooltip=document.createElement("div");
  tooltip.id="pronunciationHoverTooltip";
  tooltip.setAttribute("role","tooltip");
  document.body.appendChild(tooltip);

  const selector=[
    "#warmup .pronunciation-hover",
    "#warmup .pinyin-audio",
    "#warmup .practice-speak",
    "#warmup [data-hanzi-pronounce]"
  ].join(",");

  let activeElement=null;

  function placeTooltip(element){
    const rect=element.getBoundingClientRect();
    tooltip.classList.remove("below");
    tooltip.style.left="0px";
    tooltip.style.top="0px";

    const width=tooltip.offsetWidth;
    const height=tooltip.offsetHeight;
    let left=rect.left+(rect.width-width)/2;
    left=Math.max(8,Math.min(left,window.innerWidth-width-8));

    let top=rect.top-height-10;
    if(top<8){
      top=rect.bottom+10;
      tooltip.classList.add("below");
    }

    tooltip.style.left=`${left}px`;
    tooltip.style.top=`${top}px`;
  }

  document.addEventListener("mouseover",event=>{
    const element=event.target.closest(selector);
    if(!element) return;
    if(event.relatedTarget && element.contains(event.relatedTarget)) return;

    activeElement=element;
    tooltip.textContent=pronunciationHoverTip(element);
    tooltip.classList.add("show");
    requestAnimationFrame(()=>placeTooltip(element));
  });

  document.addEventListener("mouseout",event=>{
    const element=event.target.closest(selector);
    if(!element || element!==activeElement) return;
    if(event.relatedTarget && element.contains(event.relatedTarget)) return;
    activeElement=null;
    tooltip.classList.remove("show","below");
  });

  window.addEventListener("scroll",()=>{
    if(activeElement && tooltip.classList.contains("show")){
      placeTooltip(activeElement);
    }
  },{passive:true});

  window.addEventListener("resize",()=>{
    if(activeElement && tooltip.classList.contains("show")){
      placeTooltip(activeElement);
    }
  });
}
